<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>스톱워치 · Picasso</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    /* 멤피스 팔레트: 납작한 원색 몇 개와 굵은 검정 선 */
    :root {
      --ink: #121212;
      --paper: #fffaf0;
      --m-pink: #ff6fa5;
      --m-pink-deep: #d62a62;
      --m-yellow: #ffcf33;
      --m-teal: #1fb5ac;
      --m-teal-deep: #11857e;
      --m-blue: #3a4ee0;
      --text-secondary: #6b6459;
    }

    body {
      min-height: 100vh;
      background-color: #f8ecd6;
      background-image: radial-gradient(rgba(18,18,18,0.12) 1.4px, transparent 1.6px);
      background-size: 22px 22px;
      font-family: -apple-system, 'SF Pro Display', 'Helvetica Neue', sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
    }

    .card {
      background: var(--paper);
      border-radius: 22px;
      padding: 34px 30px 28px;
      width: min(420px, 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 26px;
      border: 3px solid var(--ink);
      box-shadow: 12px 12px 0 var(--ink);
      position: relative;
    }
    .card > * { position: relative; z-index: 1; }

    /* 카드 장식은 두 개만: 오른쪽 위 점 격자, 왼쪽 아래 삼각형 */
    .card::before, .card::after {
      content: "";
      position: absolute;
      z-index: 0;
      pointer-events: none;
    }
    .card::before {
      top: 16px; right: 18px;
      width: 62px; height: 40px;
      background-image: radial-gradient(var(--ink) 2px, transparent 2.4px);
      background-size: 12px 12px;
    }
    .card::after {
      left: 18px; bottom: 18px;
      width: 0; height: 0;
      border-left: 16px solid transparent;
      border-right: 16px solid transparent;
      border-bottom: 26px solid var(--m-teal);
      transform: rotate(-14deg);
    }

    .title {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 14px;
      font-weight: 900;
      letter-spacing: 4px;
      color: var(--ink);
    }
    .title .pill {
      font-size: 13px;
      letter-spacing: 0.5px;
      padding: 4px 11px;
      border: 2.5px solid var(--ink);
      border-radius: 999px;
      background: var(--m-pink);
      transform: rotate(-4deg);
    }

    /* ── 시간 디스플레이 ── */
    .display {
      position: relative;
      width: 100%;
      aspect-ratio: 1 / 1;
      background: var(--m-yellow);
      border: 3px solid var(--ink);
      border-radius: 16px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
      padding-bottom: 16px;
    }
    .display.bounce { animation: bounce 0.45s cubic-bezier(.3,1.7,.5,1); }

    .face-bg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
    }

    /* 얼굴은 그대로 두고 배경만 1초마다 바뀐다 */
    .face-bg #bg { transition: fill 0.6s ease; }
    .face-bg .deco {
      transform-box: fill-box;
      transform-origin: center;
      transition: transform 0.7s cubic-bezier(.34,1.56,.64,1), fill 0.6s ease;
    }

    /* 돌아가는 동안만 움직이는 배경 장식 */
    #ring, #squiggle {
      transform-box: fill-box;
      transform-origin: center;
      animation-play-state: paused;
    }
    #ring { animation: spin 6s linear infinite; animation-play-state: paused; }
    #squiggle { animation: wiggle 1s ease-in-out infinite alternate; animation-play-state: paused; }
    .display.running #ring,
    .display.running #squiggle { animation-play-state: running; }

    /* 시작할 때 튀어나오는 도형 */
    .confetti { position: absolute; inset: 0; z-index: 3; pointer-events: none; }
    .confetti svg { position: absolute; left: 50%; top: 46%; overflow: visible; }

    .time-plate {
      position: relative;
      z-index: 2;
      display: flex;
      align-items: baseline;
      gap: 2px;
      background: var(--paper);
      border: 3px solid var(--ink);
      border-radius: 12px;
      padding: 8px 18px 6px;
      box-shadow: 6px 6px 0 var(--m-pink);
    }
    .time-main {
      font-size: 44px;
      font-weight: 800;
      letter-spacing: -1.5px;
      color: var(--ink);
      font-variant-numeric: tabular-nums;
      line-height: 1;
    }
    .time-ms {
      font-size: 22px;
      font-weight: 800;
      color: var(--m-pink-deep);
      font-variant-numeric: tabular-nums;
      line-height: 1;
    }

    .lap-current-display {
      min-height: 16px;
      margin-top: 10px;
      font-size: 12px;
      font-variant-numeric: tabular-nums;
    }
    .lap-current-display:not(:empty) {
      padding: 3px 12px;
      background: var(--ink);
      color: var(--m-yellow);
      border-radius: 999px;
      font-weight: 700;
      letter-spacing: 0.5px;
    }

    /* ── 버튼 ── */
    .buttons {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 26px;
    }
    .btn {
      border: 3px solid var(--ink);
      border-radius: 50%;
      cursor: pointer;
      font-family: inherit;
      font-weight: 800;
      display: grid;
      place-items: center;
      transition: transform 0.08s ease, box-shadow 0.08s ease, background 0.2s ease;
    }
    .btn:focus-visible { outline: 3px dashed var(--m-blue); outline-offset: 5px; }

    .btn-main {
      width: 96px; height: 96px;
      font-size: 18px;
      color: var(--paper);
      background: var(--m-teal);
      box-shadow: 6px 6px 0 var(--ink);
    }
    .btn-main.running { background: var(--m-pink-deep); }
    .btn-main:active { transform: translate(4px, 4px); box-shadow: 2px 2px 0 var(--ink); }

    .btn-sub {
      width: 70px; height: 70px;
      font-size: 14px;
      color: var(--ink);
      background: var(--m-yellow);
      box-shadow: 5px 5px 0 var(--ink);
    }
    .btn-sub:not(:disabled):active { transform: translate(3px, 3px); box-shadow: 2px 2px 0 var(--ink); }
    .btn-sub:disabled {
      color: #9a948a;
      background: #eee6d6;
      box-shadow: 3px 3px 0 rgba(18,18,18,0.25);
      border-color: rgba(18,18,18,0.45);
      cursor: default;
    }
    .btn-ghost { visibility: hidden; }

    /* ── 랩 목록 ── */
    .laps-section { width: 100%; }
    .laps-header {
      display: flex;
      justify-content: space-between;
      padding: 0 4px 8px;
      font-size: 11px;
      font-weight: 900;
      letter-spacing: 1.5px;
      color: var(--ink);
      border-bottom: 3px solid var(--ink);
    }
    .laps-list { max-height: 132px; overflow-y: auto; }
    .laps-list::-webkit-scrollbar { display: none; }
    .lap-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 4px;
      border-bottom: 1.5px dashed #d9cfbc;
      font-size: 15px;
      font-variant-numeric: tabular-nums;
      color: var(--ink);
      animation: popIn 0.35s cubic-bezier(.34,1.56,.64,1);
    }
    .lap-num { color: var(--text-secondary); font-size: 13px; min-width: 52px; }
    .lap-split { flex: 1; text-align: center; }
    .lap-total { min-width: 90px; text-align: right; color: var(--text-secondary); }
    .lap-row.fastest .lap-split { color: var(--m-teal-deep); font-weight: 800; }
    .lap-row.slowest .lap-split { color: var(--m-pink-deep); font-weight: 800; }
    .no-laps { text-align: center; color: #a89f8a; font-size: 13px; padding: 16px 0 4px; }

    .hint { font-size: 11px; color: #8f8672; letter-spacing: 0.5px; }

    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes wiggle { from { transform: translateX(-4px); } to { transform: translateX(4px); } }
    @keyframes bounce {
      0%   { transform: none; }
      35%  { transform: scale(1.035) rotate(-1deg); }
      70%  { transform: scale(0.99) rotate(0.6deg); }
      100% { transform: none; }
    }
    @keyframes popIn {
      from { opacity: 0; transform: scale(0.92); }
      to   { opacity: 1; transform: none; }
    }

    @media (prefers-reduced-motion: reduce) {
      .face-bg #bg, .face-bg .deco, .btn { transition: none; }
      #ring, #squiggle, .display.bounce, .lap-row { animation: none; }
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="title">STOPWATCH <span class="pill">Picasso</span></div>

    <div class="display" id="display">
      <!-- 피카소식 얼굴(정면과 옆모습을 한 얼굴에)을 멤피스 색과 굵은 선으로 -->
      <svg class="face-bg" viewBox="0 0 300 300" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
        <defs>
          <pattern id="stripe" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(35)">
            <rect width="12" height="12" fill="#fffaf0"/>
            <rect width="6" height="12" fill="#3a4ee0"/>
          </pattern>
          <pattern id="lozenge" width="22" height="22" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
            <rect width="22" height="22" fill="#fffaf0" stroke="#121212" stroke-width="1.8"/>
            <rect x="7" y="7" width="8" height="8" fill="#3a4ee0" stroke="#121212" stroke-width="1.2"/>
          </pattern>
          <pattern id="dots" width="12" height="12" patternUnits="userSpaceOnUse">
            <circle cx="6" cy="6" r="2.2" fill="#121212"/>
          </pattern>
        </defs>

        <!-- 배경 도형 (돌아가는 동안 1초마다 색과 자리가 바뀐다) -->
        <rect id="bg" x="0" y="0" width="300" height="300" fill="#ffcf33"/>
        <path class="deco" id="d-tri" d="M0 0 H102 L0 128 Z" fill="url(#lozenge)" stroke="#121212" stroke-width="3"/>
        <circle class="deco" id="d-sun" cx="262" cy="32" r="50" fill="#1fb5ac"/>
        <g id="ring">
          <circle cx="262" cy="32" r="36" fill="none" stroke="#121212" stroke-width="4" stroke-dasharray="10 9"/>
        </g>
        <rect class="deco" id="d-dots" x="0" y="190" width="70" height="110" fill="url(#dots)"/>
        <g class="deco" id="d-sq"><path id="squiggle" d="M236 238 q8 -11 16 0 t16 0 t16 0" fill="none" stroke="#121212" stroke-width="4.5" stroke-linecap="round"/></g>
        <circle class="deco" id="d-o" cx="266" cy="132" r="11" fill="none" stroke="#121212" stroke-width="4"/>
        <path class="deco" id="d-pink" d="M248 196 L270 174 L278 202 Z" fill="#3a4ee0" stroke="#121212" stroke-width="3" stroke-linejoin="round"/>

        <!-- 초상: 정면 얼굴 위로 왼쪽을 보는 옆얼굴이 겹친다 (「거울 앞의 소녀」류 1930년대 어법) -->
        <!-- 뒷머리 -->
        <g transform="translate(0 -16) rotate(-5 150 120)">
          <path d="M150 24 C98 22 64 60 64 112 C64 160 74 200 94 232 L134 216 C110 188 100 150 100 112 C100 76 120 54 150 54 C180 54 200 76 202 108 C224 160 216 196 196 214 L176 184 C224 74 198 26 150 24 Z" fill="#121212"/>
          <!-- 목: 정면 쪽 흰색, 옆얼굴 쪽 분홍 -->
          <path d="M132 178 L150 184 L150 250 L128 250 Z" fill="#cdbcf5" stroke="#121212" stroke-width="3.5" stroke-linejoin="round"/>
          <path d="M150 184 L168 178 L172 250 L150 250 Z" fill="#ff6fa5" stroke="#121212" stroke-width="3.5" stroke-linejoin="round"/>
        </g>

        <!-- 줄무늬 옷 -->
        <path d="M58 300 C64 256 98 232 128 228 L172 228 C202 232 236 256 242 300 Z" fill="url(#stripe)" stroke="#121212" stroke-width="4" stroke-linejoin="round"/>

        <g transform="translate(0 -16) rotate(-5 150 120)">
          <!-- 얼굴 전체 (정면) -->
          <path d="M150 44 C186 44 212 70 212 110 C212 142 200 168 178 184 C167 192 158 195 150 195 C140 195 132 192 124 186 C106 172 96 146 96 110 C96 72 115 44 150 44 Z"
                fill="#cdbcf5"/>

          <!-- 옆얼굴 면: 이마에서 턱까지 곡선 한 줄이 경계 -->
          <path d="M156 45 C190 47 212 72 212 110 C212 142 200 168 178 184 C169 190 162 193 156 194
                   C150 192 142 186 140 176 C139 170 143 166 146 163 C141 161 137 158 138 154
                   C139 151 143 150 145 149 C140 147 137 144 139 141 C141 139 145 139 147 137
                   L120 130 C130 116 142 104 147 94 C150 89 152 86 150 80 C148 70 150 56 156 45 Z"
                fill="#ff6fa5"/>

          <!-- 면: 노란 코, 청록 볼 -->
          <path d="M147 95 L121 130 L147 136 Z" fill="#3a4ee0" stroke="#121212" stroke-width="3" stroke-linejoin="round"/>
          <path d="M86 122 L126 141 L106 174 Z" fill="#1fb5ac" stroke="#121212" stroke-width="2.6" stroke-linejoin="round"/>

          <!-- 옆모습 입술 -->
          <path d="M147 137 C145 139 141 139 139 141 C137 144 140 147 145 149 C143 150 139 151 138 154 C137 158 141 161 146 163 L153 150 Z"
                fill="#d62a62" stroke="#121212" stroke-width="2.6" stroke-linejoin="round"/>
          <path d="M141 149 L153 150" stroke="#121212" stroke-width="2.4" stroke-linecap="round"/>

          <!-- 옆얼굴 경계선과 얼굴 외곽선: 가장 굵게 -->
          <path d="M156 194 C150 192 142 186 140 176 C139 170 143 166 146 163 C141 161 137 158 138 154
                   C139 151 143 150 145 149 C140 147 137 144 139 141 C141 139 145 139 147 137
                   L120 130 C130 116 142 104 147 94 C150 89 152 86 150 80 C148 70 150 56 156 45"
                fill="none" stroke="#121212" stroke-width="5.5" stroke-linejoin="round" stroke-linecap="round"/>
          <path d="M150 44 C186 44 212 70 212 110 C212 142 200 168 178 184 C167 192 158 195 150 195 C140 195 132 192 124 186 C106 172 96 146 96 110 C96 72 115 44 150 44 Z"
                fill="none" stroke="#121212" stroke-width="6"/>

          <!-- 귀와 귀걸이 -->
          <path d="M209 100 Q224 98 223 116 Q221 131 208 128 Z" fill="#ff6fa5" stroke="#121212" stroke-width="4" stroke-linejoin="round"/>
          <path d="M213 106 Q219 108 217 120" fill="none" stroke="#121212" stroke-width="2.4" stroke-linecap="round"/>
          <circle cx="215" cy="141" r="6" fill="#ffcf33" stroke="#121212" stroke-width="3"/>

          <!-- 앞머리: 가르마 -->
          <path d="M98 88 C102 60 122 42 150 42 C182 42 206 60 213 93 C198 72 176 64 154 72 C136 62 112 68 98 88 Z" fill="#121212"/>

          <!-- 정면 눈: 낮고 크다, 아몬드 -->
          <path d="M96 96 Q114 86 136 93" fill="none" stroke="#121212" stroke-width="4" stroke-linecap="round"/>
          <path d="M97 110 Q117 95 139 109 Q117 122 97 110 Z" fill="#ffffff" stroke="#121212" stroke-width="3" stroke-linejoin="round"/>
          <circle cx="118" cy="109" r="7.5" fill="#121212"/>
          <circle cx="119.5" cy="107.5" r="2.6" fill="#ffcf33"/>

          <!-- 옆모습 눈: 높고 작다, 앞(코 쪽)이 열린 옆눈 -->
          <g transform="translate(-6 0)">
            <path d="M163 72 L199 69" fill="none" stroke="#121212" stroke-width="4" stroke-linecap="round"/>
            <path d="M168 79 Q184 80 200 86 Q184 93 168 95 Q163 87 168 79 Z" fill="#ffffff" stroke="#121212" stroke-width="3" stroke-linejoin="round"/>
            <circle cx="170.5" cy="87" r="5.4" fill="#1fb5ac"/>
            <circle cx="169.2" cy="87" r="2.5" fill="#121212"/>
          </g>

          <!-- 콧구멍 -->
          <ellipse cx="136" cy="132" rx="3.4" ry="2.3" fill="#121212"/>
        </g>
      </svg>

      <div class="confetti" id="confetti"></div>

      <div class="time-plate">
        <span class="time-main" id="timeMain">00:00</span><span class="time-ms" id="timeMs">.00</span>
      </div>
      <div class="lap-current-display" id="lapCurrentDisplay" style="position:relative;z-index:2;"></div>
    </div>

    <div class="buttons">
      <button class="btn btn-sub" id="btnLapReset" onclick="lapOrReset()" disabled>랩</button>
      <button class="btn btn-main" id="btnStart" onclick="toggleStart()">시작</button>
      <button class="btn btn-sub btn-ghost" tabindex="-1" aria-hidden="true"></button>
    </div>

    <div class="laps-section">
      <div class="laps-header">
        <span>랩</span>
        <span>구간</span>
        <span>누적</span>
      </div>
      <div class="laps-list" id="lapsList">
        <div class="no-laps">랩 기록이 없습니다</div>
      </div>
    </div>

    <div class="hint">Space: 시작/정지 &nbsp;·&nbsp; L: 랩 &nbsp;·&nbsp; R: 재설정</div>
  </div>

  <script>
    let startTime = 0;
    let elapsed = 0;
    let timerInterval = null;
    let running = false;
    let laps = [];
    let lastLapTime = 0;
    let lastSec = -1;

    const display     = document.getElementById('display');
    const confetti    = document.getElementById('confetti');
    const timeMain    = document.getElementById('timeMain');
    const timeMs      = document.getElementById('timeMs');
    const lapCurrent  = document.getElementById('lapCurrentDisplay');
    const btnStart    = document.getElementById('btnStart');
    const btnLapReset = document.getElementById('btnLapReset');
    const lapsList    = document.getElementById('lapsList');
    const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    /* 배경 장면: 바탕색과 도형 자리가 차례로 바뀐다. 얼굴은 움직이지 않는다 */
    const SCENES = [
      { bg: '#ffcf33', sun: '#1fb5ac', pink: '#3a4ee0', t: {} },
      { bg: '#9fe3d6', sun: '#ffcf33', pink: '#121212',
        t: { 'd-sun': 'translate(-20px,30px) scale(0.85)', 'd-dots': 'translate(10px,-16px)', 'd-o': 'translate(-18px,40px) scale(1.4)', 'd-pink': 'rotate(120deg) translate(4px,0)', 'd-sq': 'translate(0,26px)' } },
      { bg: '#ffb38a', sun: '#3a4ee0', pink: '#1fb5ac',
        t: { 'd-sun': 'translate(-6px,10px) scale(1.1)', 'd-dots': 'translate(-12px,8px)', 'd-o': 'translate(-6px,-26px) scale(0.8)', 'd-pink': 'rotate(240deg) scale(1.2)', 'd-sq': 'translate(6px,-14px)' } },
      { bg: '#a9d8ff', sun: '#1fb5ac', pink: '#ffcf33',
        t: { 'd-sun': 'translate(-30px,20px) scale(0.9)', 'd-dots': 'translate(6px,10px)', 'd-o': 'translate(-24px,16px) scale(1.2)', 'd-pink': 'rotate(60deg) translate(-6px,6px)', 'd-sq': 'translate(4px,40px)' } }
    ];
    const DECO = ['d-sun', 'd-dots', 'd-o', 'd-pink', 'd-sq'];
    const decoEls = Object.fromEntries(DECO.map(id => [id, document.getElementById(id)]));
    const bgRect = document.getElementById('bg');
    let sceneIdx = 0;

    function applyScene(i) {
      sceneIdx = i;
      const sc = SCENES[i];
      bgRect.style.fill = sc.bg;
      decoEls['d-sun'].style.fill = sc.sun;
      decoEls['d-pink'].style.fill = sc.pink;
      DECO.forEach(id => { decoEls[id].style.transform = sc.t[id] || ''; });
    }
    function nextScene() { applyScene((sceneIdx + 1) % SCENES.length); }

    /* 멤피스 도형이 가운데서 튀어나온다 */
    const COLORS = ['#ff6fa5', '#1fb5ac', '#3a4ee0', '#fffaf0', '#121212'];
    const SHAPES = [
      c => `<circle cx="0" cy="0" r="9" fill="${c}" stroke="#121212" stroke-width="2.5"/>`,
      c => `<path d="M0 -11 L10 8 L-10 8 Z" fill="${c}" stroke="#121212" stroke-width="2.5" stroke-linejoin="round"/>`,
      () => `<path d="M-14 0 q3.5 -6 7 0 t7 0 t7 0 t7 0" fill="none" stroke="#121212" stroke-width="3.5" stroke-linecap="round"/>`,
      c => `<circle cx="0" cy="0" r="8" fill="none" stroke="${c === '#fffaf0' ? '#121212' : c}" stroke-width="4"/>`,
      c => `<rect x="-8" y="-8" width="16" height="16" fill="${c}" stroke="#121212" stroke-width="2.5"/>`
    ];
    function pop(count) {
      if (reduceMotion) return;
      for (let k = 0; k < count; k++) {
        const ns = 'http://www.w3.org/2000/svg';
        const svg = document.createElementNS(ns, 'svg');
        svg.setAttribute('width', '1'); svg.setAttribute('height', '1');
        const color = COLORS[Math.floor(Math.random() * COLORS.length)];
        svg.innerHTML = SHAPES[k % SHAPES.length](color);
        confetti.appendChild(svg);
        const angle = (k / count) * Math.PI * 2 + Math.random() * 0.5;
        const dist = 90 + Math.random() * 70;
        const dx = Math.cos(angle) * dist, dy = Math.sin(angle) * dist;
        const rot = (Math.random() - 0.5) * 360;
        svg.animate([
          { transform: 'translate(0,0) scale(0.2) rotate(0deg)', opacity: 1 },
          { transform: `translate(${dx}px,${dy}px) scale(1.3) rotate(${rot}deg)`, opacity: 1, offset: 0.6 },
          { transform: `translate(${dx * 1.1}px,${dy * 1.1 + 30}px) scale(1) rotate(${rot * 1.2}deg)`, opacity: 0 }
        ], { duration: 900 + Math.random() * 300, easing: 'cubic-bezier(.2,.8,.3,1)' }).onfinish = () => svg.remove();
      }
    }

    function bounce() {
      if (reduceMotion) return;
      display.classList.remove('bounce');
      void display.offsetWidth;
      display.classList.add('bounce');
    }

    function fmt(ms) {
      const s  = Math.floor(ms / 1000);
      const m  = Math.floor(s / 60);
      const cs = Math.floor((ms % 1000) / 10);
      return {
        main: `${String(m).padStart(2,'0')}:${String(s % 60).padStart(2,'0')}`,
        cs:   `.${String(cs).padStart(2,'0')}`
      };
    }

    function updateDisplay(ms) {
      const { main, cs } = fmt(ms);
      timeMain.textContent = main;
      timeMs.textContent   = cs;
    }

    function toggleStart() {
      if (running) {
        clearInterval(timerInterval);
        elapsed += Date.now() - startTime;
        running = false;
        display.classList.remove('running');
        btnStart.textContent = '시작';
        btnStart.classList.remove('running');
        btnLapReset.textContent = '재설정';
        btnLapReset.disabled = false;
        lapCurrent.textContent = '';
      } else {
        startTime = Date.now();
        timerInterval = setInterval(tick, 30);
        running = true;
        display.classList.add('running');
        btnStart.textContent = '정지';
        btnStart.classList.add('running');
        btnLapReset.textContent = '랩';
        btnLapReset.disabled = false;
        pop(14);
        bounce();
        if (!reduceMotion) nextScene();
      }
    }

    function tick() {
      const now = elapsed + Date.now() - startTime;
      updateDisplay(now);
      const split = now - lastLapTime;
      const { main, cs } = fmt(split);
      lapCurrent.textContent = `랩 ${laps.length + 1}  ${main}${cs}`;

      const sec = Math.floor(now / 1000);
      if (sec !== lastSec) {
        if (lastSec !== -1 && !reduceMotion) nextScene();
        lastSec = sec;
      }
    }

    function lapOrReset() {
      if (running) {
        const now = elapsed + Date.now() - startTime;
        const split = now - lastLapTime;
        laps.unshift({ split, total: now });
        lastLapTime = now;
        renderLaps();
        pop(5);
      } else {
        clearInterval(timerInterval);
        elapsed = 0;
        running = false;
        laps = [];
        lastLapTime = 0;
        lastSec = -1;
        updateDisplay(0);
        applyScene(0);
        const ring = document.getElementById('ring');
        ring.style.animation = 'none';
        void ring.getBoundingClientRect();
        ring.style.animation = '';
        display.classList.remove('running');
        lapCurrent.textContent = '';
        btnStart.textContent = '시작';
        btnStart.classList.remove('running');
        btnLapReset.textContent = '랩';
        btnLapReset.disabled = true;
        lapsList.innerHTML = '<div class="no-laps">랩 기록이 없습니다</div>';
      }
    }

    function renderLaps() {
      const splits = laps.map(l => l.split);
      const minS   = Math.min(...splits);
      const maxS   = Math.max(...splits);

      lapsList.innerHTML = laps.map((l, i) => {
        let cls = '';
        if (laps.length > 1) {
          if (l.split === minS) cls = 'fastest';
          else if (l.split === maxS) cls = 'slowest';
        }
        const { main: sm, cs: scs } = fmt(l.split);
        const { main: tm, cs: tcs } = fmt(l.total);
        return `
          <div class="lap-row ${cls}">
            <span class="lap-num">랩 ${laps.length - i}</span>
            <span class="lap-split">${sm}${scs}</span>
            <span class="lap-total">${tm}${tcs}</span>
          </div>`;
      }).join('');
    }

    document.addEventListener('keydown', (e) => {
      if (e.target.tagName === 'INPUT') return;
      if (e.code === 'Space') { e.preventDefault(); toggleStart(); }
      else if ((e.key === 'l' || e.key === 'L') && running) lapOrReset();
      else if ((e.key === 'r' || e.key === 'R') && !running && elapsed > 0) lapOrReset();
    });
  </script>
</body>
</html>
