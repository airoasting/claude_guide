<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>가을밤 모닥불 스탑워치</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔥</text></svg>" />
<style>
  @font-face{font-family:'Pretendard';src:url('../fonts/PretendardVariable.ttf') format('truetype');font-weight:100 900;font-style:normal;font-display:swap;}
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{font-family:'Pretendard',-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
    background:linear-gradient(180deg,#0E1428 0%,#1B2140 55%,#2A1F2A 100%);display:flex;align-items:flex-start;justify-content:center;
    color:#F6E2C0;padding:54px 14px 14px;overflow:hidden;position:relative}

  /* ── 밤하늘 ── */
  .sky{position:fixed;inset:0;pointer-events:none}
  .star{position:absolute;width:2px;height:2px;border-radius:50%;background:#FFF6DA;animation:twinkle 3s ease-in-out infinite}
  @keyframes twinkle{0%,100%{opacity:.25}50%{opacity:1}}
  .moon{position:absolute;right:22px;top:20px;width:30px;height:30px;border-radius:50%;
    box-shadow:-7px 4px 0 0 #F6E2B0;filter:drop-shadow(0 0 8px rgba(246,226,176,.35))}
  .ground{position:absolute;left:0;right:0;bottom:0;height:40px;
    background:linear-gradient(180deg,#1E1620 0%,#130E14 60%,#0B080C 100%);box-shadow:0 -1px 0 rgba(255,150,70,.12)}
  .pine{position:absolute;bottom:38px;width:0;height:0;border-left:22px solid transparent;border-right:22px solid transparent;border-bottom:90px solid #0A0F1E}
  .pine.a{left:-6px;transform:scale(1.2);transform-origin:bottom}
  .pine.b{left:26px;transform:scale(.8);transform-origin:bottom}
  .pine.c{right:-4px;transform:scale(1.3);transform-origin:bottom}
  .pine.d{right:30px;transform:scale(.75);transform-origin:bottom}
  .glow{position:absolute;left:50%;bottom:-110px;width:340px;height:340px;margin-left:-170px;border-radius:50%;
    background:radial-gradient(circle,rgba(255,140,50,.22),rgba(255,140,50,0) 65%);transition:opacity .6s,transform .6s;opacity:.55;transform:scale(.8)}
  .sky.go .glow{opacity:1;transform:scale(1)}

  /* 떨어지는 단풍잎 */
  .leaf{position:absolute;top:-24px;opacity:0;animation:fall linear infinite}
  @keyframes fall{0%{transform:translate(0,0) rotate(0);opacity:0}
    8%{opacity:.9}
    30%{transform:translate(var(--a),110px) rotate(calc(var(--r)*.3))}
    60%{transform:translate(var(--b),230px) rotate(calc(var(--r)*.65))}
    100%{transform:translate(var(--c),400px) rotate(var(--r));opacity:0}}

  .wrap{display:flex;flex-direction:column;align-items:center;gap:12px;width:100%;max-width:300px;position:relative;z-index:1}

  /* ── 모닥불 ── */
  .fire{position:fixed;left:50%;bottom:22px;width:170px;height:150px;margin-left:-85px;z-index:1}
  .fire::before{content:"";position:absolute;left:50%;bottom:-6px;width:200px;height:24px;margin-left:-100px;border-radius:50%;
    background:radial-gradient(ellipse,rgba(255,140,60,.35),rgba(255,140,60,0) 70%)}
  .logs{position:absolute;left:50%;bottom:8px;width:0;height:0}
  .log{position:absolute;width:104px;height:16px;border-radius:8px;background:linear-gradient(180deg,#7A4A2A,#4E2C17);
    box-shadow:inset 0 -3px 0 rgba(0,0,0,.25)}
  .log::after{content:"";position:absolute;right:3px;top:2px;width:12px;height:12px;border-radius:50%;
    background:radial-gradient(circle,#C99263 30%,#8A5A34 32%,#A06B40 55%,#7A4A2A 70%)}
  .log.l{left:-56px;bottom:0;transform:rotate(16deg)}
  .log.r{left:-48px;bottom:0;transform:rotate(-16deg) scaleX(-1)}
  .stone{position:absolute;bottom:-6px;width:20px;height:12px;border-radius:50%;background:#565A66;box-shadow:inset -2px -2px 0 #3E414B}
  .stone:nth-child(3){left:-84px;bottom:-4px}.stone:nth-child(4){left:-62px;bottom:-9px}.stone:nth-child(5){left:-36px;bottom:-12px}
  .stone:nth-child(6){left:-10px;bottom:-13px}.stone:nth-child(7){left:16px;bottom:-12px}.stone:nth-child(8){left:42px;bottom:-9px}.stone:nth-child(9){left:64px;bottom:-4px}

  .flames{position:absolute;left:50%;bottom:22px;width:0;height:0;transform-origin:50% 100%;transform:scale(.55);transition:transform .5s cubic-bezier(.3,1.4,.5,1)}
  .fire.go .flames{transform:scale(1)}
  .fl{position:absolute;bottom:0;border-radius:50% 50% 50% 50%/62% 62% 38% 38%;transform-origin:50% 100%;
    animation:flick 1s ease-in-out infinite alternate;mix-blend-mode:screen}
  .fl.o{left:-34px;width:68px;height:96px;background:radial-gradient(ellipse at 50% 85%,#FF7A1A,#E8461A 60%,rgba(200,40,20,0) 75%)}
  .fl.m{left:-24px;width:48px;height:72px;background:radial-gradient(ellipse at 50% 85%,#FFB13B,#FF8A1F 65%,rgba(255,120,30,0) 78%);animation-duration:.8s;animation-delay:-.3s}
  .fl.i{left:-13px;width:26px;height:44px;background:radial-gradient(ellipse at 50% 85%,#FFF6C8,#FFD45A 60%,rgba(255,200,80,0) 80%);animation-duration:.6s;animation-delay:-.2s}
  .fl.s1{left:-40px;width:26px;height:50px;background:radial-gradient(ellipse at 50% 85%,#FF9A2A,rgba(230,70,26,0) 75%);animation-duration:.9s;animation-delay:-.5s}
  .fl.s2{left:14px;width:26px;height:56px;background:radial-gradient(ellipse at 50% 85%,#FF9A2A,rgba(230,70,26,0) 75%);animation-duration:1.1s;animation-delay:-.1s}
  @keyframes flick{0%{transform:scaleY(1) skewX(0)}35%{transform:scaleY(1.08) skewX(3deg)}70%{transform:scaleY(.94) skewX(-3deg)}100%{transform:scaleY(1.05) skewX(1deg)}}

  /* 불티 */
  .sparks{position:absolute;left:50%;bottom:60px;width:0;height:0}
  .sp{position:absolute;width:3px;height:3px;border-radius:50%;background:#FFC86A;box-shadow:0 0 6px #FF9A2A;opacity:0}
  .fire.go .sp{animation:rise 2s ease-out infinite}
  .sp:nth-child(1){left:-10px;animation-delay:0s}
  .sp:nth-child(2){left:8px;animation-delay:.5s}
  .sp:nth-child(3){left:-2px;animation-delay:1s}
  .sp:nth-child(4){left:14px;animation-delay:1.4s}
  .sp:nth-child(5){left:-16px;animation-delay:.8s}
  @keyframes rise{0%{transform:translate(0,0);opacity:0}15%{opacity:1}100%{transform:translate(12px,-70px);opacity:0}}

  .time{font-variant-numeric:tabular-nums;font-weight:800;font-size:42px;letter-spacing:1px;color:#FFE3B0;
    text-shadow:0 0 14px rgba(255,150,60,.35)}
  .time .cs{font-size:22px;color:#FF9F4A}
  .row{display:flex;gap:9px}
  button{font-family:inherit;font-weight:800;font-size:14px;border:none;cursor:pointer;
    padding:13px 0;width:80px;border-radius:22px;box-shadow:0 4px 0 rgba(0,0,0,.3),0 6px 12px rgba(0,0,0,.25);transition:transform .07s,opacity .15s}
  button:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.3)}
  #b1{background:#F08A3C;color:#2A1206}#b1.run{background:#C9473A;color:#FFF0E0}
  #b2{background:#D9A55B;color:#2A1A08}#b3{background:#5C5470;color:#EDE6F5}
  button:disabled{opacity:.5;cursor:default}
  .lp{font-size:12px;color:#D9B98A;font-weight:700;min-height:16px}
  button:focus-visible{outline:3px solid #FFE3B0;outline-offset:2px}
  button:hover:not(:disabled){filter:brightness(1.08)}
  @media (prefers-reduced-motion: reduce){
    *,*::before,*::after{animation-duration:.001ms !important;animation-iteration-count:1 !important;
      transition-duration:.001ms !important;scroll-behavior:auto !important}
  }
</style>
</head>
<body>
  <div class="sky" id="sky" aria-hidden="true">
    <span class="glow"></span>
    <span class="moon"></span>
    <span class="pine a"></span><span class="pine b"></span><span class="pine c"></span><span class="pine d"></span>
    <span class="ground"></span>
  </div>
  <div class="fire" id="fig" aria-hidden="true">
      <div class="flames">
        <span class="fl o"></span><span class="fl s1"></span><span class="fl s2"></span><span class="fl m"></span><span class="fl i"></span>
      </div>
      <div class="sparks"><span class="sp"></span><span class="sp"></span><span class="sp"></span><span class="sp"></span><span class="sp"></span></div>
      <div class="logs">
        <span class="log l"></span><span class="log r"></span>
        <span class="stone"></span><span class="stone"></span><span class="stone"></span><span class="stone"></span><span class="stone"></span><span class="stone"></span><span class="stone"></span>
      </div>
    </div>
  <div class="wrap">
    <div class="time"><span id="t">00:00<span class="cs">.00</span></span></div>
    <div class="row">
      <button id="b1">시작</button>
      <button id="b2" disabled>랩</button>
      <button id="b3" disabled>리셋</button>
    </div>
    <div class="lp" id="lp" aria-live="polite"></div>
  </div>
<script>
(function(){
  /* 별과 단풍잎을 흩뿌린다 */
  var sky=document.getElementById('sky');
  for(var i=0;i<26;i++){var s=document.createElement('span');s.className='star';
    s.style.left=(Math.random()*100)+'%';s.style.top=(Math.random()*48)+'%';
    s.style.animationDelay=(-Math.random()*3)+'s';sky.appendChild(s);}
  /* 낙엽은 떨어질 때마다 자리, 속도, 흔들림, 회전을 새로 뽑는다 */
  function rnd(a,b){return a+Math.random()*(b-a);}
  function shuffle(lf){
    var w=rnd(10,26)*(Math.random()<.5?-1:1);
    lf.textContent=Math.random()<.5?'🍁':'🍂';
    lf.style.left=rnd(-5,95)+'%';
    lf.style.fontSize=rnd(10,16)+'px';
    lf.style.setProperty('--a',w+'px');
    lf.style.setProperty('--b',(-w*rnd(.4,1))+'px');
    lf.style.setProperty('--c',(w*rnd(.2,1.2))+'px');
    lf.style.setProperty('--r',(rnd(180,520)*(Math.random()<.5?-1:1))+'deg');
  }
  for(var j=0;j<6;j++){var lf=document.createElement('span');lf.className='leaf';shuffle(lf);
    lf.style.animationDuration=rnd(6,11)+'s';lf.style.animationDelay=(-rnd(0,11))+'s';
    lf.addEventListener('animationiteration',function(){shuffle(this);this.style.animationDuration=rnd(6,11)+'s';});
    sky.appendChild(lf);}

  var t=document.getElementById('t'),b1=document.getElementById('b1'),b2=document.getElementById('b2'),b3=document.getElementById('b3'),lp=document.getElementById('lp');
  var fig=document.getElementById('fig');
  function setGo(on){fig.classList.toggle('go',on);sky.classList.toggle('go',on);}
  var run=false,st=0,acc=0,iv=null,laps=[],last=0;
  function el(){return acc+(run?performance.now()-st:0);}
  function f(ms){if(ms<0)ms=0;var c=Math.floor(ms/10),cc=c%100,s=Math.floor(c/100),ss=s%60,mm=Math.floor(s/60);
    return String(mm).padStart(2,'0')+':'+String(ss).padStart(2,'0')+'<span class="cs">.'+String(cc).padStart(2,'0')+'</span>';}
  function plain(ms){if(ms<0)ms=0;var c=Math.floor(ms/10),cc=c%100,s=Math.floor(c/100),ss=s%60,mm=Math.floor(s/60);
    return String(mm).padStart(2,'0')+':'+String(ss).padStart(2,'0')+'.'+String(cc).padStart(2,'0');}
  function draw(){t.innerHTML=f(el());}

  /* ── 접근성 공통 ──
     정지·초기화 결과를 스크린리더에 한 번씩 알린다. 시간 표시 자체는
     10ms마다 바뀌므로 라이브 리전으로 두지 않는다. */
  var srSay=(function(){
    var r=document.createElement('div');
    r.setAttribute('role','status'); r.setAttribute('aria-live','polite');
    r.style.cssText='position:absolute;width:1px;height:1px;margin:-1px;padding:0;'+
      'overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0';
    document.body.appendChild(r);
    return function(m){ r.textContent=''; setTimeout(function(){ r.textContent=m; },30); };
  })();
  function srHuman(ms){
    if(ms<0)ms=0;
    var cs=Math.floor(ms/10)%100, s=Math.floor(ms/1000), ss=s%60, mm=Math.floor(s/60);
    return (mm?mm+'분 ':'')+ss+'점'+String(cs).padStart(2,'0')+'초';
  }
  var srWasRun=false, srLast=0;
  function ui(){b1.textContent=run?'정지':(el()>0?'재개':'시작');b1.classList.toggle('run',run);b2.disabled=!run;b3.disabled=run||el()===0;
    var srE=el();
    if(srWasRun&&!run) srSay('정지. 경과 시간 '+srHuman(srE));
    else if(!srWasRun&&!run&&srLast>0&&srE===0) srSay('초기화했습니다');
    srWasRun=run; srLast=srE;
    if(document.activeElement&&document.activeElement.disabled) b1.focus();
  }
  function start(){run=true;st=performance.now();if(!iv)iv=setInterval(draw,31);setGo(true);draw();ui();}
  function stop(){if(!run)return;acc=el();run=false;clearInterval(iv);iv=null;setGo(false);draw();ui();}
  function reset(){if(run)return; run=false;clearInterval(iv);iv=null;acc=0;st=0;laps=[];last=0;setGo(false);draw();ui();lp.textContent='';}
  function lap(){if(!run)return;var e=el(),sp=e-last;last=e;laps.push(sp);var best=Math.min.apply(null,laps);lp.textContent='랩 '+laps.length+' · '+plain(sp)+(laps.length>1&&sp===best?' ★':'');}
  b1.onclick=function(){run?stop():start();};b2.onclick=lap;b3.onclick=reset;
  window.addEventListener('pagehide',function(){clearInterval(iv);iv=null;});
  window.addEventListener('pageshow',function(){if(run&&!iv)iv=setInterval(draw,31);});
  document.addEventListener('keydown',function(e){
    if(e.metaKey||e.ctrlKey||e.altKey||e.repeat)return;
    if(e.target&&e.target.tagName==='BUTTON'&&(e.key===' '||e.code==='Space'))return;
    if(e.key===' '){e.preventDefault();run?stop():start();}
    else if(e.key==='l'||e.key==='L'){lap();}
    else if(e.key==='r'||e.key==='R'){reset();}
  });
  document.addEventListener('visibilitychange',function(){if(!document.hidden&&run)draw();});
  draw();ui();
})();
</script>
</body>
</html>
