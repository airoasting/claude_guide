<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>옥수수 스탑워치</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌽</text></svg>" />
<style>
  @font-face{font-family:'Pretendard';src:url('../fonts/PretendardVariable.ttf') format('truetype');font-weight:100 900;font-style:normal;font-display:swap;}
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{font-family:'Pretendard',-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
    background:linear-gradient(180deg,#EAF6FF 0%,#F3FBE9 60%,#FBF3D8 100%);
    display:flex;align-items:center;justify-content:center;color:#5A3A1C;padding:14px}
  .wrap{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:14px;width:100%;max-width:300px}

  /* ── 평택항 ──
     왼쪽엔 컨테이너 크레인과 쌓인 컨테이너, 수평선엔 서해대교 같은 사장교, 오른쪽 바다엔 자동차 운반선.
     시작하면 크레인이 컨테이너를 옮기고, 배가 움직이고, 물결이 흐르고, 갈매기가 난다 */
  html,body{overflow:hidden}
  .port{position:fixed;inset:0;pointer-events:none;z-index:0}
  .port svg{width:100%;height:100%;display:block}
  .port .wave{animation:drift 6s linear infinite;animation-play-state:paused}
  @keyframes drift{to{transform:translateX(-40px)}}
  .port .ship{animation:sail 14s ease-in-out infinite alternate;animation-play-state:paused}
  @keyframes sail{to{transform:translateX(-46px)}}
  .port .trolley{animation:carry 4.8s ease-in-out infinite;animation-play-state:paused}
  @keyframes carry{0%,8%{transform:translateX(0)}42%,58%{transform:translateX(52px)}92%,100%{transform:translateX(0)}}
  .port .cable{animation:hoist 4.8s ease-in-out infinite;animation-play-state:paused;transform-box:fill-box;transform-origin:50% 0}
  @keyframes hoist{0%,100%{transform:scaleY(1)}20%,30%{transform:scaleY(.45)}50%{transform:scaleY(1)}70%,80%{transform:scaleY(.45)}}
  .port .box{animation:lift 4.8s ease-in-out infinite;animation-play-state:paused}
  @keyframes lift{0%,100%{transform:translateY(0)}20%,30%{transform:translateY(-15px)}50%{transform:translateY(0)}70%,80%{transform:translateY(-15px)}}
  .port .gull{opacity:0;animation:fly 9s linear infinite;animation-play-state:paused}
  @keyframes fly{0%{opacity:0;transform:translate(0,0)}10%{opacity:.8}90%{opacity:.8}100%{opacity:0;transform:translate(-430px,-30px)}}
  body.run .port .wave,body.run .port .ship,body.run .port .trolley,body.run .port .cable,body.run .port .box,body.run .port .gull{animation-play-state:running}
  body.live .port .gull{opacity:revert}
  @media (prefers-reduced-motion:reduce){.port *{animation:none !important}}
  .corn{position:relative;width:128px;height:158px}
  .silk{position:absolute;top:-12px;left:50%;transform:translateX(-50%);width:60px;height:18px}
  .silk span{position:absolute;bottom:0;left:50%;width:2px;height:16px;transform-origin:bottom center;
    background:linear-gradient(180deg,transparent,#C98A3A);border-radius:2px}
  .silk span:nth-child(1){transform:translateX(-50%) rotate(-26deg);height:12px}
  .silk span:nth-child(2){transform:translateX(-50%) rotate(-8deg)}
  .silk span:nth-child(3){transform:translateX(-50%) rotate(8deg)}
  .silk span:nth-child(4){transform:translateX(-50%) rotate(24deg);height:12px}
  .leaf{position:absolute;bottom:2px;left:50%;width:56px;height:108px;transform-origin:bottom center;
    border-radius:6% 94% 6% 94% / 0 100% 0 100%;
    background:linear-gradient(135deg,#95CE5C,#6FB23E 55%,#4E8C2A);z-index:1}
  .leaf.l{transform:translateX(-50%) rotate(-26deg) scaleX(-1)}
  .leaf.r{transform:translateX(-50%) rotate(26deg)}
  .cob{position:absolute;left:50%;top:0;transform:translateX(-50%);width:92px;height:154px;z-index:2;
    border-radius:50% 50% 46% 46% / 28% 28% 60% 60%;
    background-color:#F6C338;
    background-image:
      radial-gradient(ellipse 8px 10px at 8px 9px,#FFE06A 0 42%,#F6C338 55%,#E0982A 78%,transparent 82%),
      radial-gradient(ellipse 8px 10px at 8px 9px,#FFE06A 0 42%,#F6C338 55%,#E0982A 78%,transparent 82%);
    background-size:20px 24px,20px 24px;background-position:0 0,10px 12px;
    box-shadow:inset -8px -10px 22px rgba(150,90,10,.3),inset 8px 8px 18px rgba(255,240,170,.5),0 8px 16px rgba(120,80,20,.18)}
  /* ── 옥수수 얼굴 ── */
  .face{position:absolute;left:50%;top:56px;transform:translateX(-50%);width:92px;height:56px;z-index:3}
  .eye{position:absolute;top:0;width:13px;height:16px;border-radius:50%;background:#4A2E12;
    box-shadow:0 1px 0 rgba(255,240,190,.5)}
  .eye.l{left:21px}.eye.r{right:21px}
  .eye::after{content:'';position:absolute;top:3px;left:3px;width:5px;height:5px;border-radius:50%;background:#fff}
  .cheek{position:absolute;top:20px;width:15px;height:9px;border-radius:50%;background:rgba(233,118,104,.5);filter:blur(.5px)}
  .cheek.l{left:9px}.cheek.r{right:9px}
  .mouth{position:absolute;top:21px;left:50%;width:22px;height:11px;transform:translateX(-50%);
    border:3px solid #4A2E12;border-top:none;border-radius:0 0 22px 22px;transition:all .18s}
  /* 재는 동안엔 신이 나서 입을 벌리고 눈을 깜빡인다 */
  .corn.go .mouth{width:19px;height:18px;border-top:3px solid #4A2E12;border-radius:9px 9px 11px 11px;background:#A8442F}
  .eye{animation:blink 4.8s ease-in-out infinite}
  .corn.go .eye{animation-duration:3.1s}
  @keyframes blink{0%,90%,100%{transform:scaleY(1)}94%{transform:scaleY(.12)}}
  /* 랩을 찍으면 폴짝 뛴다. 흔들림(.corn.go)과 겹치지 않게 알맹이와 얼굴만 움직인다 */
  .corn.pop .cob,.corn.pop .face{animation:hop .42s cubic-bezier(.3,1.5,.5,1) 1}
  @keyframes hop{
    0%,100%{transform:translateX(-50%) translateY(0) scale(1)}
    38%{transform:translateX(-50%) translateY(-12px) scale(1.05,.95)}
  }

  .time{font-variant-numeric:tabular-nums;font-weight:800;font-size:42px;letter-spacing:1px;color:#5A3A1C}
  .time .cs{font-size:22px;color:#B07A3E}
  .row{display:flex;gap:9px;margin-top:18px}
  button{font-family:inherit;font-weight:800;font-size:14px;color:#fff;border:none;cursor:pointer;
    padding:13px 0;width:80px;border-radius:22px;box-shadow:0 4px 0 rgba(0,0,0,.13),0 6px 10px rgba(0,0,0,.10);transition:transform .07s,opacity .15s}
  button:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.13)}
  #b1{background:#57B84A;color:#0E2A08}#b1.run{background:#E0705C;color:#3E1208}
  #b2{background:#E0982A;color:#3A2405}#b3{background:#B6ADA0;color:#33302A}
  button:disabled{opacity:.6;cursor:default}
  .lp{font-size:12px;color:#9A7A52;font-weight:700;min-height:16px}
  button:focus-visible{outline:3px solid #5A3A1C;outline-offset:2px}
  /* 시작하면 옥수수가 바람에 흔들린다 */
  .corn.go{transform-origin:bottom center;animation:cornSway .9s ease-in-out infinite}
  @keyframes cornSway{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
  .corn.go .leaf.l{animation:leafL .9s ease-in-out infinite}
  .corn.go .leaf.r{animation:leafR .9s ease-in-out infinite}
  @keyframes leafL{0%,100%{transform:translateX(-50%) rotate(-26deg) scaleX(-1)}50%{transform:translateX(-50%) rotate(-37deg) scaleX(-1)}}
  @keyframes leafR{0%,100%{transform:translateX(-50%) rotate(26deg)}50%{transform:translateX(-50%) rotate(37deg)}}
  .corn.go .silk{transform-origin:bottom center;animation:silkWave .9s ease-in-out infinite}
  @keyframes silkWave{0%,100%{transform:translateX(-50%) rotate(-7deg)}50%{transform:translateX(-50%) rotate(7deg)}}
  @media (prefers-reduced-motion: reduce){
    *,*::before,*::after{animation-duration:.001ms !important;animation-iteration-count:1 !important;
      transition-duration:.001ms !important;scroll-behavior:auto !important}
  }
  button:hover:not(:disabled){filter:brightness(1.1)}
</style>
</head>
<body>
  <div class="port" aria-hidden="true">
    <svg viewBox="0 0 400 360" preserveAspectRatio="xMidYMid slice">
      <defs>
        <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#CFE6F6"/><stop offset="1" stop-color="#F1F6F2"/></linearGradient>
        <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9CCBE0"/><stop offset="1" stop-color="#C9E4EC"/></linearGradient>
        <linearGradient id="field" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F3EED7"/><stop offset="1" stop-color="#FBF3D8"/></linearGradient>
      </defs>
      <rect width="400" height="172" fill="url(#sky)"/>
      <circle cx="330" cy="58" r="16" fill="#FFF3C9" opacity=".8"/>

      <!-- 서해대교 같은 사장교. 탑 둘에서 케이블이 부채꼴로 내려온다 -->
      <g stroke="#9DB2C2" fill="none" opacity=".9">
        <path d="M120 150H400" stroke-width="3"/>
        <path d="M206 150V92M214 150V92M296 150V92M304 150V92" stroke-width="2.4"/>
        <path d="M204 100h12M294 100h12" stroke-width="2"/>
        <path d="M210 94L150 150M210 94L170 150M210 94L190 150M210 94L230 150M210 94L250 150M210 94L270 150
                 M300 94L260 150M300 94L280 150M300 94L320 150M300 94L340 150M300 94L360 150" stroke-width=".7"/>
      </g>

      <!-- 바다 -->
      <rect y="168" width="400" height="92" fill="url(#sea)"/>
      <g class="wave" stroke="#fff" stroke-width="1.2" opacity=".55" fill="none">
        <path d="M0 196q10-4 20 0t20 0 20 0 20 0 20 0 20 0 20 0 20 0 20 0 20 0 20 0 20 0 20 0 20 0 20 0 20 0 20 0 20 0 20 0 20 0 20 0 20 0"/>
        <path d="M0 226q12-4 24 0t24 0 24 0 24 0 24 0 24 0 24 0 24 0 24 0 24 0 24 0 24 0 24 0 24 0 24 0 24 0 24 0 24 0 24 0"/>
      </g>

      <!-- 자동차 운반선. 높고 네모난 선체 -->
      <g class="ship">
        <path d="M262 186h104l-8 14H270z" fill="#2F4D6E"/>
        <rect x="266" y="150" width="96" height="36" rx="3" fill="#F2F4F6"/>
        <rect x="266" y="176" width="96" height="5" fill="#C9473A"/>
        <rect x="344" y="140" width="14" height="10" rx="1" fill="#E6E9EC"/>
        <g fill="#9FB3C4"><rect x="272" y="158" width="66" height="2"/><rect x="272" y="166" width="66" height="2"/></g>
      </g>

      <!-- 부두와 컨테이너 -->
      <rect x="0" y="176" width="168" height="12" fill="#B9BEC3"/>
      <g>
        <rect x="2" y="160" width="26" height="8" fill="#C9473A"/><rect x="2" y="152" width="26" height="8" fill="#3C78B4"/><rect x="2" y="144" width="26" height="8" fill="#E8913A"/>
        <rect x="2" y="168" width="26" height="8" fill="#4C9A6A"/>
        <rect x="30" y="168" width="26" height="8" fill="#3C78B4"/><rect x="30" y="160" width="26" height="8" fill="#E8913A"/><rect x="30" y="152" width="26" height="8" fill="#8A96A3"/>
        <rect x="58" y="168" width="26" height="8" fill="#C9473A"/><rect x="58" y="160" width="26" height="8" fill="#4C9A6A"/>
        <g stroke="rgba(0,0,0,.18)" stroke-width=".6"><path d="M9 144v32M16 144v32M23 144v32M37 152v24M44 152v24M51 152v24M65 160v16M72 160v16M79 160v16"/></g>
      </g>

      <!-- 컨테이너 크레인 둘. 붐이 바다 쪽으로 뻗는다 -->
      <g fill="none" stroke="#D8553C" stroke-width="3" stroke-linejoin="round">
        <path d="M96 176V112M126 176V112M96 140h30M96 112h30"/>
        <path d="M86 112H190M100 112L111 84 122 112M111 84L160 112"/>
      </g>
      <g fill="none" stroke="#E7A34A" stroke-width="2.4" stroke-linejoin="round" opacity=".85">
        <path d="M30 144V100M52 144V100M30 100h22M24 100H104M33 100L41 78 49 100M41 78L80 100"/>
      </g>
      <!-- 트롤리가 붐을 따라 컨테이너를 옮긴다 -->
      <g class="trolley">
        <rect x="128" y="108" width="12" height="6" fill="#4A4F55"/>
        <rect class="cable" x="133" y="114" width="1.4" height="30" fill="#4A4F55"/>
        <g class="box"><rect x="124" y="144" width="20" height="8" fill="#3C78B4"/><path d="M129 144v8M134 144v8M139 144v8" stroke="rgba(0,0,0,.2)" stroke-width=".6"/></g>
      </g>

      <!-- 갈매기 -->
      <g fill="none" stroke="#6E7F8E" stroke-width="1.4" stroke-linecap="round">
        <path class="gull" d="M400 70q4-4 8 0q4-4 8 0" style="animation-delay:-1s"/>
        <path class="gull" d="M420 92q3-3 6 0q3-3 6 0" style="animation-delay:-5s"/>
      </g>

      <!-- 앞쪽 들판. 옥수수가 서 있는 곳 -->
      <path d="M0 262q100-14 200 0t200 0V360H0z" fill="url(#field)"/>
    </svg>
  </div>

  <div class="wrap">
    <div class="corn" aria-hidden="true">
      <div class="silk"><span></span><span></span><span></span><span></span></div>
      <span class="leaf l"></span><span class="leaf r"></span>
      <span class="cob"></span>
      <div class="face">
        <span class="eye l"></span><span class="eye r"></span>
        <span class="cheek l"></span><span class="cheek r"></span>
        <span class="mouth"></span>
      </div>
    </div>
    <div class="time"><span id="t">00:00<span class="cs">.00</span></span></div>
    <div class="row">
      <button id="b1">시작</button>
      <button id="b2" disabled>랩</button>
      <button id="b3" disabled>리셋</button>
    </div>
    <div class="lp" id="lp" aria-live="polite"></div>
  </div>
<script>
(function(){
  var t=document.getElementById('t'),b1=document.getElementById('b1'),b2=document.getElementById('b2'),b3=document.getElementById('b3'),lp=document.getElementById('lp');
  var fig=document.querySelector('.corn');
  var run=false,st=0,acc=0,iv=null,laps=[],last=0,popT=null;
  function el(){return acc+(run?performance.now()-st:0);}
  function f(ms){if(ms<0)ms=0;var c=Math.floor(ms/10),cc=c%100,s=Math.floor(c/100),ss=s%60,mm=Math.floor(s/60);
    return String(mm).padStart(2,'0')+':'+String(ss).padStart(2,'0')+'<span class="cs">.'+String(cc).padStart(2,'0')+'</span>';}
  function plain(ms){if(ms<0)ms=0;var c=Math.floor(ms/10),cc=c%100,s=Math.floor(c/100),ss=s%60,mm=Math.floor(s/60);
    return String(mm).padStart(2,'0')+':'+String(ss).padStart(2,'0')+'.'+String(cc).padStart(2,'0');}
  function draw(){t.innerHTML=f(el());}

  /* ── 접근성 공통 ──
     정지·초기화 결과를 스크린리더에 한 번씩 알린다. 시간 표시 자체는
     10ms마다 바뀌므로 라이브 리전으로 두지 않는다. */
  var srSay=(function(){
    var r=document.createElement('div');
    r.setAttribute('role','status'); r.setAttribute('aria-live','polite');
    r.style.cssText='position:absolute;width:1px;height:1px;margin:-1px;padding:0;'+
      'overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0';
    document.body.appendChild(r);
    return function(m){ r.textContent=''; setTimeout(function(){ r.textContent=m; },30); };
  })();
  function srHuman(ms){
    if(ms<0)ms=0;
    var cs=Math.floor(ms/10)%100, s=Math.floor(ms/1000), ss=s%60, mm=Math.floor(s/60);
    return (mm?mm+'분 ':'')+ss+'점'+String(cs).padStart(2,'0')+'초';
  }
  var srWasRun=false, srLast=0;
  function ui(){b1.textContent=run?'정지':(el()>0?'재개':'시작');b1.classList.toggle('run',run);b2.disabled=!run;b3.disabled=run||el()===0;
    /* 정지와 초기화를 알리고, 방금 누른 버튼이 잠기면 포커스를 되돌린다 */
    var srE=el();
    if(srWasRun&&!run) srSay('정지. 경과 시간 '+srHuman(srE));
    else if(!srWasRun&&!run&&srLast>0&&srE===0) srSay('초기화했습니다');
    srWasRun=run; srLast=srE;
    if(document.activeElement&&document.activeElement.disabled) b1.focus();
  }
  function scene(){document.body.classList.toggle('run',run);document.body.classList.toggle('live',run||acc>0);}
  function start(){run=true;st=performance.now();if(!iv)iv=setInterval(draw,31);fig.classList.add('go');draw();ui();scene();}
  function stop(){if(!run)return;acc=el();run=false;clearInterval(iv);iv=null;fig.classList.remove('go');draw();ui();scene();}
  function reset(){if(run)return; run=false;clearInterval(iv);iv=null;acc=0;st=0;laps=[];last=0;fig.classList.remove('go');draw();ui();lp.textContent='';scene();}
  function lap(){if(!run)return;var e=el(),sp=e-last;last=e;laps.push(sp);var best=Math.min.apply(null,laps);lp.textContent='랩 '+laps.length+' · '+plain(sp)+(laps.length>1&&sp===best?' ★':'');
    fig.classList.remove('pop'); void fig.offsetWidth; fig.classList.add('pop');
    clearTimeout(popT); popT=setTimeout(function(){fig.classList.remove('pop');},420);}
  b1.onclick=function(){run?stop():start();};b2.onclick=lap;b3.onclick=reset;
  window.addEventListener('pagehide',function(){clearInterval(iv);iv=null;clearTimeout(popT);});
  window.addEventListener('pageshow',function(){if(run&&!iv)iv=setInterval(draw,31);});
  document.addEventListener('keydown',function(e){
    if(e.metaKey||e.ctrlKey||e.altKey||e.repeat)return;
    if(e.target&&e.target.tagName==='BUTTON'&&(e.key===' '||e.code==='Space'))return;
    if(e.key===' '){e.preventDefault();run?stop():start();}
    else if(e.key==='l'||e.key==='L'){lap();}
    else if(e.key==='r'||e.key==='R'){reset();}
  });
  document.addEventListener('visibilitychange',function(){if(!document.hidden&&run)draw();});
  draw();ui();
})();
</script>
</body>
</html>
