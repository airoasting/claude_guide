<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>라인 타일랜드 스탑워치</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='%23100D0B'/><path d='M28 30 L34 54 L22 52 Z' fill='%23E8A05A'/><path d='M72 30 L66 54 L78 52 Z' fill='%23E8A05A'/><circle cx='50' cy='56' r='26' fill='%23E8A05A'/><circle cx='41' cy='52' r='4' fill='%23241A12'/><circle cx='59' cy='52' r='4' fill='%23241A12'/></svg>" />
<style>
  @font-face{font-family:'Pretendard';src:url('../fonts/PretendardVariable.ttf') format('truetype');font-weight:100 900;font-style:normal;font-display:swap;}
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overflow:hidden}
  :root{
    --grn:#06C755;          /* 라인 그린 */
    --neon:#8CFFB4;         /* 네온관이 뿜는 빛 */
    --fur:#A2673A;
    --fur-dk:#6E4423;
    --muzzle:#E2C49B;
  }
  body{font-family:'Pretendard',-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
    color:#F2FFF6;background:#0B0908;position:relative;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;
    padding:12px 14px 86px;overflow:hidden}

  /* ── 만화 무대. 그러데이션 없이 평면 색으로 끊어 칠하고, 굵은 잉크 선으로 감싼다 ── */
  .room{position:absolute;inset:0;pointer-events:none;overflow:hidden;background:#2AAE5C}
  /* 고양이 뒤로 퍼지는 집중선. 달리는 동안 천천히 돈다 */
  .rays{position:absolute;left:50%;top:160px;width:900px;height:900px;margin:-450px 0 0 -450px;
    background:repeating-conic-gradient(#38C66D 0 7.5deg,#2AAE5C 7.5deg 15deg)}
  body.go .rays{animation:spin 40s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  /* 무대 소품(조명 원판, 잎사귀, 마룻바닥, 반짝이). 폭이 바뀌어도 고양이 기준 가운데에 둔다 */
  .set{position:absolute;left:50%;top:0;width:600px;height:360px;margin-left:-300px;overflow:visible}
  .twinkle{transform-box:fill-box;transform-origin:center}
  body.go .twinkle{animation:twinkle .9s ease-in-out infinite alternate}
  body.go .twinkle.t2{animation-delay:-.3s}
  body.go .twinkle.t3{animation-delay:-.6s}
  /* 잎사귀는 줄기 끝(왼쪽 위 꼭짓점)을 축으로 흔들린다. 시작하면 움직이고, 멈추면 그 자세로 선다 */
  .sway{transform-box:fill-box;transform-origin:0 0;animation:sway 1.1s ease-in-out infinite alternate;animation-play-state:paused}
  .sway.s2{animation-duration:.9s;animation-delay:-.4s}
  .sway.s3{animation-duration:1.2s;animation-delay:-.7s}
  .sway.s4{animation-duration:.95s;animation-delay:-.2s}
  body.go .sway{animation-play-state:running}
  @keyframes sway{from{transform:rotate(-7deg)}to{transform:rotate(7deg)}}
  @keyframes twinkle{from{transform:scale(.7) rotate(0)}to{transform:scale(1.15) rotate(20deg)}}

  /* ── 네온 사인 ── */
  .sign{position:relative;z-index:3;flex-shrink:0;width:100%;
    display:flex;flex-direction:column;align-items:flex-end;gap:3px;
    padding-right:2px;min-height:58px;justify-content:center}
  .sign span{font-size:10px;font-weight:800;letter-spacing:.2px;white-space:nowrap;
    color:#F4FFF7;font-variant-numeric:tabular-nums;
    -webkit-text-stroke:3px #0E2416;paint-order:stroke fill;
    text-shadow:0 0 5px rgba(190,255,210,.95),0 0 13px rgba(50,235,120,.85),0 0 26px rgba(20,200,90,.6);
    animation:pop .34s cubic-bezier(.3,1.5,.6,1) 1}
  .sign span.hit{color:#FFF4CF;
    text-shadow:0 0 5px rgba(255,240,190,.95),0 0 14px rgba(255,196,60,.85),0 0 28px rgba(230,150,20,.55)}
  @keyframes pop{0%{opacity:0;transform:translateY(-5px)}100%{opacity:1;transform:none}}
  body.go .sign span:first-child{animation:pop .34s cubic-bezier(.3,1.5,.6,1) 1,flick 3.4s steps(1,end) .4s infinite}
  @keyframes flick{0%,92%,100%{opacity:1}94%{opacity:.42}96%{opacity:1}97%{opacity:.55}}

  /* ── 고양이 (cat.mp4를 12fps 112장으로 뽑아 둔 것) ── */
  .stage{position:relative;z-index:3;width:118px;height:148px;flex-shrink:0}
  .doll{width:100%;height:100%;display:block;object-fit:contain;
    filter:drop-shadow(0 8px 12px rgba(0,0,0,.5))}
  /* 발밑 그림자 */
  .stage::after{content:'';position:absolute;left:50%;bottom:2px;width:62px;height:11px;
    margin-left:-31px;border-radius:50%;z-index:-1;
    background:radial-gradient(closest-side,rgba(0,0,0,.5),transparent)}

  /* ── 시간 ── */
  .read{position:relative;z-index:3;text-align:center}
  .time{font-size:26px;font-weight:800;letter-spacing:-.9px;white-space:nowrap;line-height:1;
    font-variant-numeric:tabular-nums;color:#FFFFFF;
    -webkit-text-stroke:5px #0E2416;paint-order:stroke fill;
    text-shadow:0 3px 0 #0E2416}
  .time .cs{font-size:15px;font-weight:700;color:var(--neon)}

  /* ── 조작부 ── */
  .row{position:absolute;left:0;right:0;bottom:34px;z-index:4;display:flex;justify-content:center;gap:8px}
  /* 버튼도 만화 무대에 맞춰 잉크 테두리와 아래로 떨어지는 단단한 그림자를 준다 */
  button{font-family:inherit;font-size:12.5px;font-weight:800;cursor:pointer;white-space:nowrap;
    padding:10px 0;width:78px;border-radius:20px;transition:transform .07s,box-shadow .07s,background .16s;
    color:#EAFFF1;border:2.5px solid #0E2416;background:#1F4A2E;box-shadow:0 4px 0 #0E2416}
  button:active:not(:disabled){transform:translateY(3px);box-shadow:0 1px 0 #0E2416}
  button:disabled{opacity:.6;cursor:default;color:#9DBFA8}
  button:focus-visible{outline:2px solid var(--neon);outline-offset:3px}
  button:hover:not(:disabled){background:#28603B}
  #b1{background:var(--grn);color:#04331A}
  #b1:hover{background:#0AE063}

  @media (prefers-reduced-motion: reduce){
    *,*::before,*::after{animation:none !important;transition-duration:.001ms !important}
  }
</style>
</head>
<body>
  <div class="room" aria-hidden="true">
    <span class="rays"></span>
    <svg class="set" viewBox="0 0 600 360">
      <defs>
        <g id="leaf"><g stroke="#0E2416" stroke-linejoin="round" stroke-linecap="round">
          <path d="M0 0 C40 8 70 46 66 104 C30 92 2 58 0 0 Z" fill="#1E8B48" stroke-width="3.5"/>
          <path d="M0 0 C40 8 70 46 66 104 C52 66 30 34 0 0 Z" fill="#45C774" stroke="none"/>
          <path d="M0 0 C40 8 70 46 66 104 C30 92 2 58 0 0 Z" fill="none" stroke-width="3.5"/>
          <path d="M2 4 C28 34 48 64 64 100" fill="none" stroke-width="2.5"/>
        </g></g>
        <path id="star" d="M0 -10 Q2 -2 10 0 Q2 2 0 10 Q-2 2 -10 0 Q-2 -2 0 -10 Z" fill="#FFE14D" stroke="#0E2416" stroke-width="2.5" stroke-linejoin="round"/>
        <clipPath id="discClip"><circle cx="300" cy="160" r="74"/></clipPath>
      </defs>
      <!-- 고양이 뒤 조명 원판: 두 단계 명암 -->
      <g clip-path="url(#discClip)">
        <rect x="220" y="80" width="160" height="160" fill="#86E2A2"/>
        <circle cx="292" cy="152" r="72" fill="#C2F7D2"/>
      </g>
      <circle cx="300" cy="160" r="74" fill="none" stroke="#0E2416" stroke-width="4"/>
      <!-- 위에서 늘어진 잎사귀 -->
      <g transform="translate(132 -12) rotate(-14)"><use class="sway" href="#leaf"/></g>
      <g transform="translate(176 -18) rotate(12) scale(.78)"><use class="sway s2" href="#leaf"/></g>
      <g transform="translate(468 70) scale(-1 1) rotate(-6)"><use class="sway s3" href="#leaf"/></g>
      <g transform="translate(440 104) scale(-.74 .74) rotate(18)"><use class="sway s4" href="#leaf"/></g>
      <!-- 마룻바닥: 판자 선이 무대 가운데로 모인다 -->
      <path d="M0 233 H600 V360 H0 Z" fill="#B5713F"/>
      <path d="M0 233 H600 V243 H0 Z" fill="#D08A52"/>
      <g stroke="#0E2416" stroke-width="2" opacity=".32">
        <path d="M300 243 V360 M300 243 L210 360 M300 243 L120 360 M300 243 L30 360 M300 243 L-60 360 M300 243 L390 360 M300 243 L480 360 M300 243 L570 360 M300 243 L660 360"/>
      </g>
      <path d="M0 233 H600" stroke="#0E2416" stroke-width="4"/>
      <!-- 반짝이 -->
      <g transform="translate(220 98) scale(1.1)"><use class="twinkle" href="#star"/></g>
      <g transform="translate(384 118) scale(.85)"><use class="twinkle t2" href="#star"/></g>
      <g transform="translate(212 196) scale(.7)"><use class="twinkle t3" href="#star"/></g>
    </svg>
  </div>

  <!-- 전시장 벽의 네온 사인. 랩을 찍으면 여기에 한 줄씩 걸린다 -->
  <div class="sign" id="sign" aria-live="polite"></div>

  <div class="stage">
    <img class="doll" id="doll" src="images/cat-frames/f001.webp" alt="" />
  </div>

  <div class="read">
    <div class="time" id="t" role="timer">00:00:00<span class="cs">.00</span></div>
  </div>

  <div class="row">
    <button id="b1" type="button">시작</button>
    <button id="b2" type="button" disabled>랩</button>
    <button id="b3" type="button" disabled>리셋</button>
  </div>

<script>
(function(){
  var t=document.getElementById('t'),sign=document.getElementById('sign'),
      doll=document.getElementById('doll'),
      b1=document.getElementById('b1'),b2=document.getElementById('b2'),b3=document.getElementById('b3');
  var run=false,st=0,acc=0,iv=null,laps=[],last=0;

  /* 네온 사인은 세 줄까지만 걸린다. 랩이 없으면 인사말, 있으면 최근 랩 세 개 */
  var HELLO=['#See U again','#เจอกันใหม่นะ','#또 만나요','#下次再见'];
  var MAX_LINE=4;
  function paintSign(){
    var lines,hit=-1;
    if(!laps.length){ lines=HELLO.slice(); }
    else{
      var best=Math.min.apply(null,laps);
      var from=Math.max(0,laps.length-MAX_LINE);
      lines=[];
      for(var i=from;i<laps.length;i++){
        lines.push('#'+(i+1)+' '+plain(laps[i]));
        if(laps.length>1&&laps[i]===best) hit=lines.length-1;
      }
    }
    sign.textContent='';
    for(var k=0;k<lines.length;k++){
      var s=document.createElement('span');
      s.textContent=lines[k];
      if(k===hit) s.className='hit';
      sign.appendChild(s);
    }
  }

  /* ── 캐릭터 재생 ──
     cat.mp4의 0~222번째 프레임을 한 칸씩 건너뛰어 112장으로 뽑고,
     초록 배경을 지워 투명 webp로 저장해 뒀다.
     223번째가 첫 장과 거의 같아서 마지막 장 다음이 자연스럽게 이어진다.
     카드가 여러 개 떠 있으므로 처음 시작할 때만 받아 온다. */
  var FRAMES=112, FPS=12, DIR='images/cat-frames/';
  var frameNo=0, frameT=null, cached=false, loading=false;
  var REDUCED=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  function src(i){ return DIR+'f'+String(i+1).padStart(3,'0')+'.webp'; }
  function preload(done){
    if(cached||loading){ if(cached)done(); return; }
    loading=true;
    var left=FRAMES;
    for(var i=0;i<FRAMES;i++){
      var im=new Image();
      im.onload=im.onerror=function(){ if(--left===0){ cached=true; loading=false; done(); } };
      im.src=src(i);
    }
  }
  function playDoll(){
    if(REDUCED) return;
    clearInterval(frameT);
    frameT=setInterval(function(){
      frameNo=(frameNo+1)%FRAMES;
      doll.src=src(frameNo);
    }, Math.round(1000/FPS));
  }
  function pauseDoll(){ clearInterval(frameT); frameT=null; }
  function rewindDoll(){ pauseDoll(); frameNo=0; doll.src=src(0); }

  function el(){return acc+(run?performance.now()-st:0);}
  function pad(n,w){return String(n).padStart(w,'0');}
  function f(ms){if(ms<0)ms=0;var cs=Math.floor(ms/10)%100,s=Math.floor(ms/1000),ss=s%60,m=Math.floor(s/60),mm=m%60,hh=Math.floor(m/60);
    if(hh>99)hh=99;
    return pad(hh,2)+':'+pad(mm,2)+':'+pad(ss,2)+'<span class="cs">.'+pad(cs,2)+'</span>';}
  function plain(ms){if(ms<0)ms=0;var cs=Math.floor(ms/10)%100,s=Math.floor(ms/1000),ss=s%60,mm=Math.floor(s/60);
    return pad(mm,2)+':'+pad(ss,2)+'.'+pad(cs,2);}
  function draw(){t.innerHTML=f(el());}

  /* ── 접근성 공통 ──
     정지·초기화 결과를 스크린리더에 한 번씩 알린다. 시간 표시 자체는
     10ms마다 바뀌므로 라이브 리전으로 두지 않는다. */
  var srSay=(function(){
    var r=document.createElement('div');
    r.setAttribute('role','status'); r.setAttribute('aria-live','polite');
    r.style.cssText='position:absolute;width:1px;height:1px;margin:-1px;padding:0;'+
      'overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0';
    document.body.appendChild(r);
    return function(m){ r.textContent=''; setTimeout(function(){ r.textContent=m; },30); };
  })();
  function srHuman(ms){
    if(ms<0)ms=0;
    var cs=Math.floor(ms/10)%100, s=Math.floor(ms/1000), ss=s%60, mm=Math.floor(s/60);
    return (mm?mm+'분 ':'')+ss+'점'+String(cs).padStart(2,'0')+'초';
  }
  var srWasRun=false, srLast=0;
  function ui(){
    document.body.classList.toggle('go',run);
    b1.textContent=run?'정지':(el()>0?'재개':'시작');
    b2.disabled=!run; b3.disabled=run||el()===0;

    /* 정지와 초기화를 알리고, 방금 누른 버튼이 잠기면 포커스를 되돌린다 */
    var srE=el();
    if(srWasRun&&!run) srSay('정지. 경과 시간 '+srHuman(srE));
    else if(!srWasRun&&!run&&srLast>0&&srE===0) srSay('초기화했습니다');
    srWasRun=run; srLast=srE;
    if(document.activeElement&&document.activeElement.disabled) b1.focus();
  }
  function start(){if(run)return;run=true;st=performance.now();if(!iv)iv=setInterval(draw,31);
    preload(function(){ if(run) playDoll(); });
    draw();ui();}
  function stop(){if(!run)return;acc=el();run=false;clearInterval(iv);iv=null;pauseDoll();draw();ui();}
  function reset(){if(run)return;acc=0;st=0;laps=[];last=0;rewindDoll();paintSign();draw();ui();}
  /* 랩을 찍으면 네온 사인에 해시태그가 한 줄 걸린다 */
  function lap(){
    if(!run)return;
    var e=el(),sp=e-last;last=e;laps.push(sp);
    paintSign();ui();
  }
  b1.addEventListener('click',function(){run?stop():start();});
  b2.addEventListener('click',lap);
  b3.addEventListener('click',reset);
  document.addEventListener('keydown',function(e){
    if(e.metaKey||e.ctrlKey||e.altKey||e.repeat)return;
    if(e.target&&e.target.tagName==='BUTTON'&&e.key===' ')return;
    if(e.key===' '){e.preventDefault();run?stop():start();}
    else if(e.key==='l'||e.key==='L'){lap();}
    else if(e.key==='r'||e.key==='R'){reset();}
  });
  document.addEventListener('visibilitychange',function(){if(!document.hidden&&run)draw();});
  window.addEventListener('pageshow',function(){if(run&&!iv)iv=setInterval(draw,31);
    if(run&&!frameT&&cached)playDoll();});
  window.addEventListener('pagehide',function(){clearInterval(iv);iv=null;pauseDoll();});
  paintSign();draw();ui();
})();
</script>
</body>
</html>
