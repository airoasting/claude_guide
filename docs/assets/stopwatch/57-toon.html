<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>따르릉 자명종 스탑워치</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='54' r='40' fill='%23FF5D6C' stroke='%231B1B2F' stroke-width='8'/></svg>" />
<style>
  @font-face{font-family:'Pretendard';src:url('../fonts/PretendardVariable.ttf') format('truetype');font-weight:100 900;font-style:normal;font-display:swap;}
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  :root{--ink:#1B1B2F}
  /* 하늘도 셀 셰이딩: 그러데이션 없이 두 단계로 끊어 칠한다 */
  body{font-family:'Pretendard',"Helvetica Neue",Arial,sans-serif;color:var(--ink);overflow:hidden;
    background:linear-gradient(180deg,#8FDCFF 0 58%,#73CDF7 58% 100%);
    display:flex;align-items:center;justify-content:center;padding:14px;position:relative}

  /* ── 구름 (외곽선 + 아래쪽 평면 그림자) ── */
  .sky{position:fixed;inset:0;pointer-events:none;z-index:0}
  .cloud{position:absolute;animation:drift 26s linear infinite}
  .cloud.c1{top:9%;left:-90px}
  .cloud.c2{top:58%;left:-90px;animation-duration:34s;animation-delay:-17s;transform:scale(.8)}
  @keyframes drift{from{translate:0 0}to{translate:calc(100vw + 180px) 0}}

  .wrap{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:14px}

  /* ── 자명종 캐릭터 ── */
  .scene{position:relative;width:240px;height:214px}
  .scene svg{display:block;width:240px;height:214px;overflow:visible}
  #clock{transform-box:view-box;transform-origin:120px 204px}
  .bell{transform-box:fill-box;transform-origin:50% 90%}
  #hammer{transform-box:view-box;transform-origin:120px 40px}
  .shake{opacity:0}

  /* 시간은 자명종 얼굴 위에 HTML로 올린다 (role=timer) */
  .time{position:absolute;left:0;right:0;top:101px;text-align:center;pointer-events:none;
    font-weight:900;font-size:27px;letter-spacing:-.5px;font-variant-numeric:tabular-nums;line-height:32px;color:var(--ink)}
  .time .cs{font-size:16px;color:#E03A57}
  #clockWrap{transform-box:view-box;transform-origin:120px 204px}

  /* 표정 */
  .eye-happy,.mouth-open,.mouth-happy{display:none}
  .is-run .mouth-idle{display:none}.is-run .mouth-open{display:inline}
  .is-stop .eye-open,.is-stop .mouth-idle{display:none}
  .is-stop .eye-happy,.is-stop .mouth-happy{display:inline}
  .eye-open{transform-box:fill-box;transform-origin:center;animation:blink 4.2s infinite}
  @keyframes blink{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}

  /* 달리는 동안: 몸이 떨리고 종이 울리고 망치가 친다 */
  .is-run #clock{animation:wobble .16s ease-in-out infinite alternate}
  .is-run .bell-l{animation:ringL .09s linear infinite alternate}
  .is-run .bell-r{animation:ringR .09s linear infinite alternate}
  .is-run #hammer{animation:hammer .09s linear infinite alternate}
  .is-run .shake{animation:flick .18s steps(1) infinite}
  @keyframes wobble{from{transform:rotate(-2.5deg) translateY(0)}to{transform:rotate(2.5deg) translateY(-3px)}}
  @keyframes ringL{from{transform:rotate(-6deg)}to{transform:rotate(6deg)}}
  @keyframes ringR{from{transform:rotate(6deg)}to{transform:rotate(-6deg)}}
  @keyframes hammer{from{transform:rotate(-24deg)}to{transform:rotate(24deg)}}
  @keyframes flick{0%{opacity:1}50%{opacity:.25}}

  /* 의성어 말풍선 */
  .pop{position:absolute;pointer-events:none;font-weight:900;color:#FFD23F;
    -webkit-text-stroke:5px var(--ink);paint-order:stroke fill;text-shadow:0 4px 0 var(--ink);white-space:nowrap}
  .pop-ring{right:-26px;top:-8px;font-size:24px;transform:rotate(12deg) scale(0);transition:transform .18s cubic-bezier(.3,1.8,.5,1)}
  .is-run .pop-ring{transform:rotate(12deg) scale(1);animation:ringPop .5s ease-in-out infinite}
  @keyframes ringPop{0%,100%{transform:rotate(12deg) scale(1)}50%{transform:rotate(7deg) scale(1.12)}}
  .pop-lap{left:-20px;top:-6px;font-size:20px;color:#B9A2FF;transform:rotate(-12deg) scale(0)}
  .pop-lap.go{animation:lapPop .9s ease-out forwards}
  @keyframes lapPop{0%{transform:rotate(-12deg) scale(0)}25%{transform:rotate(-12deg) scale(1.3,.8)}40%{transform:rotate(-12deg) scale(.9,1.15)}55%,80%{transform:rotate(-12deg) scale(1);opacity:1}100%{transform:rotate(-12deg) scale(1) translateY(-10px);opacity:0}}

  /* 리셋하면 한 바퀴 돌며 찌그러졌다 튀어 오른다 */
  .boing #clockWrap{animation:boing .55s ease-out}
  @keyframes boing{0%{transform:scale(1)}25%{transform:scale(1.12,.84)}50%{transform:scale(.92,1.1) translateY(-10px)}75%{transform:scale(1.04,.97)}100%{transform:scale(1)}}

  /* ── 버튼: 두 단계 명암, 굵은 외곽선, 아래로 두꺼운 그림자, 하이라이트 점 ── */
  .row{display:flex;gap:10px}
  button{position:relative;font-family:inherit;font-weight:900;font-size:16px;cursor:pointer;
    width:74px;padding:10px 0 11px;border:3px solid var(--ink);border-radius:16px;color:#fff;
    -webkit-text-stroke:4px var(--ink);paint-order:stroke fill;
    box-shadow:0 5px 0 var(--ink);transition:transform .07s,box-shadow .07s,filter .15s}
  button::before{content:'';position:absolute;top:5px;left:9px;width:13px;height:6px;border-radius:6px;background:#fff;opacity:.85}
  button::after{content:'';position:absolute;top:6px;left:25px;width:5px;height:5px;border-radius:50%;background:#fff;opacity:.85}
  button:active:not(:disabled){transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
  button:hover:not(:disabled){filter:brightness(1.07)}
  #b2{background:linear-gradient(180deg,#B9A2FF 0 58%,#8467E6 58%)}
  #b1{background:linear-gradient(180deg,#FF6B7D 0 58%,#E03A57 58%)}
  #b1.run{background:linear-gradient(180deg,#5FB8FF 0 58%,#2F86E0 58%)}
  #b3{background:linear-gradient(180deg,#7BE07B 0 58%,#3FB55C 58%)}
  button:disabled{filter:saturate(.25) brightness(1.08);opacity:.7;cursor:default}
  button:focus-visible{outline:3px solid #fff;outline-offset:3px}

  .lp{min-height:26px;padding:2px 14px;border:3px solid var(--ink);border-radius:999px;background:#fff;
    box-shadow:0 3px 0 var(--ink);font-size:12px;font-weight:800;line-height:16px;font-variant-numeric:tabular-nums}
  .lp:empty{visibility:hidden}

  @media (prefers-reduced-motion: reduce){
    *,*::before,*::after{animation-duration:.001ms !important;animation-iteration-count:1 !important;
      transition-duration:.001ms !important;scroll-behavior:auto !important}
  }
</style>
</head>
<body>
  <div class="sky" aria-hidden="true">
    <svg class="cloud c1" width="92" height="44" viewBox="0 0 92 44"><defs><clipPath id="cc1"><path d="M14 40 a12 12 0 0 1 2-23 a16 16 0 0 1 28-9 a14 14 0 0 1 26 4 a13 13 0 0 1 8 28 z"/></clipPath></defs><g clip-path="url(#cc1)"><rect width="92" height="44" fill="#CFE6F5"/><path d="M10 34 a12 12 0 0 1 4-21 a16 16 0 0 1 28-9 a14 14 0 0 1 26 4 a13 13 0 0 1 10 22 z" fill="#fff"/></g><path d="M14 40 a12 12 0 0 1 2-23 a16 16 0 0 1 28-9 a14 14 0 0 1 26 4 a13 13 0 0 1 8 28 z" fill="none" stroke="#1B1B2F" stroke-width="3" stroke-linejoin="round"/></svg>
    <svg class="cloud c2" width="92" height="44" viewBox="0 0 92 44"><g clip-path="url(#cc1)"><rect width="92" height="44" fill="#CFE6F5"/><path d="M10 34 a12 12 0 0 1 4-21 a16 16 0 0 1 28-9 a14 14 0 0 1 26 4 a13 13 0 0 1 10 22 z" fill="#fff"/></g><path d="M14 40 a12 12 0 0 1 2-23 a16 16 0 0 1 28-9 a14 14 0 0 1 26 4 a13 13 0 0 1 8 28 z" fill="none" stroke="#1B1B2F" stroke-width="3" stroke-linejoin="round"/></svg>
  </div>

  <div class="wrap">
    <div class="scene" id="scene">
      <svg viewBox="0 0 240 214" aria-hidden="true">
        <defs>
          <clipPath id="bodyClip"><circle cx="120" cy="118" r="80"/></clipPath>
          <clipPath id="faceClip"><circle cx="120" cy="118" r="62"/></clipPath>
          <clipPath id="bellClip"><path d="M-24 8 A24 24 0 0 1 24 8 Z"/></clipPath>
          <g id="bellShape">
            <circle cx="0" cy="-19" r="5" fill="#E89B1A" stroke="#1B1B2F" stroke-width="3"/>
            <g clip-path="url(#bellClip)">
              <rect x="-26" y="-18" width="52" height="28" fill="#E89B1A"/>
              <circle cx="-6" cy="5" r="22" fill="#FFD23F"/>
              <ellipse cx="-11" cy="-6" rx="4" ry="2.6" fill="#fff" transform="rotate(-40 -11 -6)"/>
            </g>
            <path d="M-24 8 A24 24 0 0 1 24 8 Z" fill="none" stroke="#1B1B2F" stroke-width="4" stroke-linejoin="round"/>
            <rect x="-28" y="6" width="56" height="8" rx="4" fill="#E89B1A" stroke="#1B1B2F" stroke-width="3.5"/>
          </g>
        </defs>

        <ellipse cx="120" cy="207" rx="74" ry="6" fill="#1B1B2F" opacity=".18"/>

        <g id="clockWrap"><g id="clock">
          <!-- 다리 -->
          <path d="M90 184 L78 202 M150 184 L162 202" stroke="#1B1B2F" stroke-width="7" stroke-linecap="round"/>
          <ellipse cx="74" cy="203" rx="13" ry="6" fill="#3A3A5C" stroke="#1B1B2F" stroke-width="3"/>
          <ellipse cx="166" cy="203" rx="13" ry="6" fill="#3A3A5C" stroke="#1B1B2F" stroke-width="3"/>

          <!-- 울림 선 -->
          <g class="shake" stroke="#1B1B2F" stroke-width="3.5" stroke-linecap="round" fill="none">
            <path d="M28 26 Q20 42 28 58"/><path d="M16 18 Q6 42 16 66"/>
            <path d="M212 26 Q220 42 212 58"/><path d="M224 18 Q234 42 224 66"/>
          </g>

          <!-- 망치 -->
          <g id="hammer">
            <path d="M120 40 L120 16" stroke="#1B1B2F" stroke-width="5" stroke-linecap="round"/>
            <circle cx="120" cy="13" r="7" fill="#FFD23F" stroke="#1B1B2F" stroke-width="3.5"/>
            <path d="M117 10 a3 3 0 0 1 3-2" stroke="#fff" stroke-width="2.4" stroke-linecap="round" fill="none"/>
          </g>

          <!-- 종 두 개 -->
          <g transform="translate(70 46) rotate(-30)"><g class="bell bell-l"><use href="#bellShape"/></g></g>
          <g transform="translate(170 46) rotate(30)"><g class="bell bell-r"><use href="#bellShape"/></g></g>

          <!-- 몸통: 아래쪽 외곽선이 더 두껍게 보이도록 뒤에 잉크 원을 한 겹 깐다 -->
          <circle cx="120" cy="124" r="84" fill="#1B1B2F"/>
          <g clip-path="url(#bodyClip)">
            <rect x="30" y="30" width="180" height="180" fill="#D93A4E"/>
            <circle cx="110" cy="108" r="78" fill="#FF5D6C"/>
            <ellipse cx="78" cy="68" rx="15" ry="7" fill="#fff" opacity=".9" transform="rotate(-38 78 68)"/>
            <circle cx="96" cy="54" r="3.5" fill="#fff" opacity=".9"/>
          </g>
          <circle cx="120" cy="118" r="80" fill="none" stroke="#1B1B2F" stroke-width="4"/>

          <!-- 얼굴판 -->
          <g clip-path="url(#faceClip)">
            <rect x="50" y="50" width="140" height="140" fill="#EBCF98"/>
            <circle cx="114" cy="112" r="60" fill="#FFF6E2"/>
          </g>
          <circle cx="120" cy="118" r="62" fill="none" stroke="#1B1B2F" stroke-width="4"/>
          <g stroke="#1B1B2F" stroke-linecap="round">
            <path d="M120 60 v7 M120 176 v-7" stroke-width="4"/>
            <path d="M149 67.8 l-2.5 4.3 M170.2 89 l-4.3 2.5 M170.2 147 l-4.3-2.5 M149 168.2 l-2.5-4.3 M91 168.2 l2.5-4.3 M69.8 147 l4.3-2.5 M69.8 89 l4.3 2.5 M91 67.8 l2.5 4.3" stroke-width="2.5"/>
          </g>

          <!-- 눈 -->
          <g class="eye-open">
            <ellipse cx="102" cy="88" rx="7" ry="10" fill="#1B1B2F"/>
            <ellipse cx="138" cy="88" rx="7" ry="10" fill="#1B1B2F"/>
            <circle cx="104.5" cy="84" r="2.8" fill="#fff"/><circle cx="140.5" cy="84" r="2.8" fill="#fff"/>
          </g>
          <g class="eye-happy" stroke="#1B1B2F" stroke-width="4" stroke-linecap="round" fill="none">
            <path d="M94 92 Q102 80 110 92"/><path d="M130 92 Q138 80 146 92"/>
          </g>

          <!-- 볼, 입 -->
          <ellipse cx="86" cy="146" rx="9" ry="5" fill="#FF9AA4"/>
          <ellipse cx="154" cy="146" rx="9" ry="5" fill="#FF9AA4"/>
          <path class="mouth-idle" d="M112 146 Q120 153 128 146" stroke="#1B1B2F" stroke-width="3.5" stroke-linecap="round" fill="none"/>
          <path class="mouth-happy" d="M108 144 Q120 158 132 144" stroke="#1B1B2F" stroke-width="3.5" stroke-linecap="round" fill="none"/>
          <g class="mouth-open">
            <path d="M108 142 Q120 162 132 142 Z" fill="#7A1E2E" stroke="#1B1B2F" stroke-width="3.5" stroke-linejoin="round"/>
            <path d="M114 152 Q120 148 126 152 Q120 156 114 152 Z" fill="#FF7A8A"/>
          </g>
        </g></g>
      </svg>
      <div class="time"><span id="t" role="timer">00:00<span class="cs">.00</span></span></div>
      <span class="pop pop-ring" aria-hidden="true">따르릉!</span>
      <span class="pop pop-lap" id="popLap" aria-hidden="true">랩!</span>
    </div>
    <div class="row">
      <button id="b2" disabled>랩</button>
      <button id="b1">시작</button>
      <button id="b3" disabled>리셋</button>
    </div>
    <div class="lp" id="lp" aria-live="polite"></div>
  </div>
<script>
(function(){
  var t=document.getElementById('t'),b1=document.getElementById('b1'),b2=document.getElementById('b2'),b3=document.getElementById('b3'),lp=document.getElementById('lp');
  var scene=document.getElementById('scene'),popLap=document.getElementById('popLap');
  var run=false,st=0,acc=0,iv=null,laps=[],last=0;
  function el(){return acc+(run?performance.now()-st:0);}
  function f(ms){if(ms<0)ms=0;var c=Math.floor(ms/10),cc=c%100,s=Math.floor(c/100),ss=s%60,mm=Math.floor(s/60);
    return String(mm).padStart(2,'0')+':'+String(ss).padStart(2,'0')+'<span class="cs">.'+String(cc).padStart(2,'0')+'</span>';}
  function plain(ms){if(ms<0)ms=0;var c=Math.floor(ms/10),cc=c%100,s=Math.floor(c/100),ss=s%60,mm=Math.floor(s/60);
    return String(mm).padStart(2,'0')+':'+String(ss).padStart(2,'0')+'.'+String(cc).padStart(2,'0');}
  function draw(){t.innerHTML=f(el());}

  /* ── 접근성 공통 ──
     정지·초기화 결과를 스크린리더에 한 번씩 알린다. 시간 표시 자체는
     10ms마다 바뀌므로 라이브 리전으로 두지 않는다. */
  var srSay=(function(){
    var r=document.createElement('div');
    r.setAttribute('role','status'); r.setAttribute('aria-live','polite');
    r.style.cssText='position:absolute;width:1px;height:1px;margin:-1px;padding:0;'+
      'overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0';
    document.body.appendChild(r);
    return function(m){ r.textContent=''; setTimeout(function(){ r.textContent=m; },30); };
  })();
  function srHuman(ms){
    if(ms<0)ms=0;
    var cs=Math.floor(ms/10)%100, s=Math.floor(ms/1000), ss=s%60, mm=Math.floor(s/60);
    return (mm?mm+'분 ':'')+ss+'점'+String(cs).padStart(2,'0')+'초';
  }
  var srWasRun=false, srLast=0;
  function ui(){b1.textContent=run?'정지':(el()>0?'재개':'시작');b1.classList.toggle('run',run);b2.disabled=!run;b3.disabled=run||el()===0;
    /* 표정: 달리면 입을 벌리고, 멈추면 눈웃음 */
    scene.classList.toggle('is-run',run);
    scene.classList.toggle('is-stop',!run&&el()>0);
    /* 정지와 초기화를 알리고, 방금 누른 버튼이 잠기면 포커스를 되돌린다 */
    var srE=el();
    if(srWasRun&&!run) srSay('정지. 경과 시간 '+srHuman(srE));
    else if(!srWasRun&&!run&&srLast>0&&srE===0) srSay('초기화했습니다');
    srWasRun=run; srLast=srE;
    if(document.activeElement&&document.activeElement.disabled) b1.focus();
  }
  function replay(node,cls){node.classList.remove(cls);void node.getBoundingClientRect();node.classList.add(cls);}
  function start(){run=true;st=performance.now();if(!iv)iv=setInterval(draw,31);draw();ui();}
  function stop(){if(!run)return;acc=el();run=false;clearInterval(iv);iv=null;draw();ui();}
  function reset(){if(run)return; run=false;clearInterval(iv);iv=null;acc=0;st=0;laps=[];last=0;draw();ui();lp.textContent='';replay(scene,'boing');}
  function lap(){if(!run)return;var e=el(),sp=e-last;last=e;laps.push(sp);var best=Math.min.apply(null,laps);
    lp.textContent='LAP '+laps.length+' · '+plain(sp)+(laps.length>1&&sp===best?' ★':'');
    popLap.textContent='랩 '+laps.length+'!';replay(popLap,'go');}
  b1.onclick=function(){run?stop():start();};b2.onclick=lap;b3.onclick=reset;
  window.addEventListener('pagehide',function(){clearInterval(iv);iv=null;});
  window.addEventListener('pageshow',function(){if(run&&!iv)iv=setInterval(draw,31);});
  document.addEventListener('keydown',function(e){
    if(e.metaKey||e.ctrlKey||e.altKey||e.repeat)return;
    if(e.target&&e.target.tagName==='BUTTON'&&(e.key===' '||e.code==='Space'))return;
    if(e.key===' '){e.preventDefault();run?stop():start();}
    else if(e.key==='l'||e.key==='L'){lap();}
    else if(e.key==='r'||e.key==='R'){reset();}
  });
  document.addEventListener('visibilitychange',function(){if(!document.hidden&&run)draw();});
  draw();ui();
})();
</script>
</body>
</html>
