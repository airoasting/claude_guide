<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>민트 기프트 박스 스탑워치</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='16' fill='%2381D8D0'/></svg>" />
<style>
  @font-face{font-family:'Pretendard';src:url('../fonts/PretendardVariable.ttf') format('truetype');font-weight:100 900;font-style:normal;font-display:swap;}
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overflow:hidden}
  :root{
    --tif:#81D8D0;
    --tif-deep:#5FC3D0;
    --cream:#FBF9F3;
    --ink:#1D4A46;
  }
  body{font-family:'Pretendard',-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
    color:var(--ink);position:relative;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:15px;padding:12px 12px 90px;
    background:radial-gradient(120% 100% at 50% 16%,#A6E8E6 0%,var(--tif) 44%,#6FCBD2 100%)}

  /* 반짝임 */
  .spark{position:absolute;inset:0;pointer-events:none;opacity:.55;
    background-image:
      radial-gradient(1.6px 1.6px at 12% 22%,rgba(255,255,255,.9),transparent),
      radial-gradient(1.3px 1.3px at 84% 16%,rgba(255,255,255,.8),transparent),
      radial-gradient(1.5px 1.5px at 22% 82%,rgba(255,255,255,.7),transparent),
      radial-gradient(1.2px 1.2px at 90% 74%,rgba(255,255,255,.65),transparent);
    animation:tw 5s ease-in-out infinite}
  @keyframes tw{50%{opacity:.22}}

  /* ── 선물 상자 ── */
  .gift{position:relative;z-index:2;flex-shrink:0;margin-top:22px}

  .bow{position:absolute;left:50%;top:-25px;width:78px;height:30px;margin-left:-39px;z-index:4;
    filter:drop-shadow(0 2px 3px rgba(20,80,76,.28))}

  .lid{position:relative;width:226px;height:27px;border-radius:6px 6px 3px 3px;z-index:3;
    background:linear-gradient(180deg,#93DFDF,#71CCD2);
    box-shadow:0 4px 10px rgba(20,80,76,.22),inset 0 1px 0 rgba(255,255,255,.5)}

  .box{position:relative;width:212px;height:158px;margin:0 auto;border-radius:3px 3px 6px 6px;
    background:linear-gradient(180deg,#82D8D6 0%,#5FC1C9 100%);
    box-shadow:0 12px 26px rgba(18,74,70,.3),inset 0 -2px 8px rgba(20,80,76,.18);
    display:flex;align-items:center;justify-content:center}

  /* 세로 리본 (상자 앞면을 타고 내려온다) */
  .rib-v{position:absolute;left:50%;top:0;width:23px;height:100%;margin-left:-11.5px;z-index:1;
    background:linear-gradient(90deg,rgba(255,255,255,.72),#FFFFFF 34%,#F1F3F1 66%,rgba(255,255,255,.72));
    box-shadow:0 0 8px rgba(20,80,76,.10)}
  .rib-h{position:absolute;left:-7px;right:-7px;top:6px;height:15px;z-index:2;
    background:linear-gradient(180deg,rgba(255,255,255,.7),#FFFFFF 40%,#EFF2F0);
    box-shadow:0 1px 3px rgba(20,80,76,.16)}

  /* ── 명판 ── */
  .plaque{position:relative;z-index:3;width:172px;padding:14px 12px 12px;border-radius:4px;
    background:linear-gradient(180deg,var(--cream),#F2EFE7);
    box-shadow:0 6px 16px rgba(18,74,70,.26),inset 0 1px 0 rgba(255,255,255,.9);
    text-align:center}
  .time{font-family:Georgia,'Times New Roman',serif;
    font-size:25px;font-weight:400;letter-spacing:.4px;white-space:nowrap;line-height:1.1;
    font-variant-numeric:tabular-nums;color:var(--ink)}
  .time .cs{font-size:15px;color:#5C8C87}
  .rule{width:78px;height:1px;margin:8px auto 0;background:linear-gradient(90deg,transparent,#C4CFCC,transparent)}
  .laps{text-align:center;margin-top:6px;min-height:13px;font-size:10px;font-weight:600;letter-spacing:.3px;
    color:#6E8E8A;font-variant-numeric:tabular-nums}

  /* ── 조작부 ── */
  .row{position:absolute;left:0;right:0;bottom:34px;z-index:3;justify-content:center;display:flex;gap:9px}
  button{font-family:inherit;font-size:12.5px;font-weight:700;cursor:pointer;white-space:nowrap;
    padding:11px 0;width:77px;border-radius:999px;transition:all .18s;
    color:var(--ink);border:1.5px solid rgba(255,255,255,.9);background:rgba(255,255,255,.72)}
  button:disabled{opacity:1;color:rgba(20,58,54,.85);background:rgba(255,255,255,.62);
    border-color:rgba(255,255,255,.6);cursor:default}
  button:focus-visible{outline:2px solid var(--cream);outline-offset:3px}
  button:hover:not(:disabled){background:rgba(255,255,255,.92)}
  #b1{background:var(--cream);color:var(--ink);border-color:transparent;font-weight:800;
    box-shadow:0 5px 15px rgba(18,74,70,.26)}
  #b1:hover{background:#FFFFFF;transform:translateY(-1px);box-shadow:0 7px 20px rgba(18,74,70,.32)}

  body.go .bow{animation:sway 3.2s ease-in-out infinite}
  @keyframes sway{50%{transform:rotate(-2.5deg)}}
  body.go .plaque{box-shadow:0 6px 18px rgba(18,74,70,.3),inset 0 1px 0 rgba(255,255,255,.95),0 0 0 1px rgba(255,255,255,.5)}

  @media (prefers-reduced-motion: reduce){.spark,.bow{animation:none !important}}
</style>
</head>
<body>
  <div class="spark" aria-hidden="true"></div>

  <div class="gift">
    <svg class="bow" viewBox="0 0 156 60" aria-hidden="true">
      <path d="M74 40 C60 40 36 34 24 20 C16 10 26 2 40 6 C56 11 70 26 76 40 Z" fill="#FFFFFF"/>
      <path d="M82 40 C96 40 120 34 132 20 C140 10 130 2 116 6 C100 11 86 26 80 40 Z" fill="#F6F8F7"/>
      <path d="M74 40 C60 40 36 34 24 20" fill="none" stroke="rgba(20,80,76,.14)" stroke-width="1.4"/>
      <path d="M82 40 C96 40 120 34 132 20" fill="none" stroke="rgba(20,80,76,.14)" stroke-width="1.4"/>
      <path d="M70 42 L52 58 L66 52 Z" fill="#F1F4F2"/>
      <path d="M86 42 L104 58 L90 52 Z" fill="#F1F4F2"/>
      <ellipse cx="78" cy="41" rx="11" ry="9" fill="#FFFFFF"/>
      <ellipse cx="78" cy="40" rx="11" ry="9" fill="none" stroke="rgba(20,80,76,.12)" stroke-width="1.2"/>
    </svg>

    <div class="lid">
      <div class="rib-h" aria-hidden="true"></div>
    </div>

    <div class="box">
      <div class="rib-v" aria-hidden="true"></div>
      <div class="plaque">
        <div class="time" id="t" role="timer">00:00:00<span class="cs">.00</span></div>
        <div class="rule" aria-hidden="true"></div>
        <div class="laps" id="lp" aria-live="polite"></div>
      </div>
    </div>
  </div>

  <div class="row">
    <button id="b1" type="button">시작</button>
    <button id="b2" type="button" disabled>랩</button>
    <button id="b3" type="button" disabled>리셋</button>
  </div>

<script>
(function(){
  var t=document.getElementById('t'),b1=document.getElementById('b1'),b2=document.getElementById('b2'),
      b3=document.getElementById('b3'),lp=document.getElementById('lp');
  var run=false,st=0,acc=0,iv=null,laps=[],last=0;
  function el(){return acc+(run?performance.now()-st:0);}
  function pad(n,w){return String(n).padStart(w,'0');}
  function f(ms){if(ms<0)ms=0;var cs=Math.floor(ms/10)%100,s=Math.floor(ms/1000),ss=s%60,m=Math.floor(s/60),mm=m%60,hh=Math.floor(m/60);
    if(hh>99)hh=99;
    return pad(hh,2)+':'+pad(mm,2)+':'+pad(ss,2)+'<span class="cs">.'+pad(cs,2)+'</span>';}
  function plain(ms){if(ms<0)ms=0;var cs=Math.floor(ms/10)%100,s=Math.floor(ms/1000),ss=s%60,mm=Math.floor(s/60);
    return pad(mm,2)+':'+pad(ss,2)+'.'+pad(cs,2);}
  function draw(){t.innerHTML=f(el());}

  /* ── 접근성 공통 ──
     정지·초기화 결과를 스크린리더에 한 번씩 알린다. 시간 표시 자체는
     10ms마다 바뀌므로 라이브 리전으로 두지 않는다. */
  var srSay=(function(){
    var r=document.createElement('div');
    r.setAttribute('role','status'); r.setAttribute('aria-live','polite');
    r.style.cssText='position:absolute;width:1px;height:1px;margin:-1px;padding:0;'+
      'overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0';
    document.body.appendChild(r);
    return function(m){ r.textContent=''; setTimeout(function(){ r.textContent=m; },30); };
  })();
  function srHuman(ms){
    if(ms<0)ms=0;
    var cs=Math.floor(ms/10)%100, s=Math.floor(ms/1000), ss=s%60, mm=Math.floor(s/60);
    return (mm?mm+'분 ':'')+ss+'점'+String(cs).padStart(2,'0')+'초';
  }
  var srWasRun=false, srLast=0;
  function ui(){
    document.body.classList.toggle('go',run);
    b1.textContent=run?'정지':(el()>0?'재개':'시작');
    b2.disabled=!run; b3.disabled=run||el()===0;
  
    /* 정지와 초기화를 알리고, 방금 누른 버튼이 잠기면 포커스를 되돌린다 */
    var srE=el();
    if(srWasRun&&!run) srSay('정지. 경과 시간 '+srHuman(srE));
    else if(!srWasRun&&!run&&srLast>0&&srE===0) srSay('초기화했습니다');
    srWasRun=run; srLast=srE;
    if(document.activeElement&&document.activeElement.disabled) b1.focus();
  }
  function start(){if(run)return;run=true;st=performance.now();if(!iv)iv=setInterval(draw,31);draw();ui();}
  function stop(){if(!run)return;acc=el();run=false;clearInterval(iv);iv=null;draw();ui();}
  function reset(){if(run)return;acc=0;st=0;laps=[];last=0;lp.textContent='';draw();ui();}
  function lap(){if(!run)return;var e=el(),sp=e-last;last=e;laps.push(sp);
    var best=Math.min.apply(null,laps);
    lp.textContent='LAP '+laps.length+'  +'+plain(sp)+(laps.length>1?(sp===best?'  ★ 최단':'  · 최단 '+plain(best)):'');}
  b1.addEventListener('click',function(){run?stop():start();});
  b2.addEventListener('click',lap);
  b3.addEventListener('click',reset);
  document.addEventListener('keydown',function(e){
    if(e.metaKey||e.ctrlKey||e.altKey||e.repeat)return;
    if(e.target&&e.target.tagName==='BUTTON'&&e.key===' ')return;
    if(e.key===' '){e.preventDefault();run?stop():start();}
    else if(e.key==='l'||e.key==='L'){lap();}
    else if(e.key==='r'||e.key==='R'){reset();}
  });
  document.addEventListener('visibilitychange',function(){if(!document.hidden&&run)draw();});
  window.addEventListener('pageshow',function(){if(run&&!iv)iv=setInterval(draw,31);});
  window.addEventListener('pagehide',function(){clearInterval(iv);iv=null;});
  draw();ui();
})();
</script>
</body>
</html>
