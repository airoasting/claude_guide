<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>라이너 스탑워치</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='18' fill='%2312290F'/><path d='M62 16 L84 16 L84 39 L71 51 L71 74 L55 90 L55 69 L32 69 L32 45 L11 45 L27 29 L49 29 Z' fill='%23fff'/></svg>" />
<style>
  @font-face{font-family:'Pretendard';src:url('../fonts/PretendardVariable.ttf') format('truetype');font-weight:100 900;font-style:normal;font-display:swap;}
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  :root{
    --ln:#12290F;      /* 라이너 딥그린 (로고 배경과 같은 값) */
    --ln-mid:#55B26B;  /* 채움 그린. 바탕과 같은 초록 계열에서 한 단계만 올린 톤 */
    --ink:#EAF3EC;
  }
  body{font-family:'Pretendard',-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
    color:var(--ink);overflow:hidden;position:relative;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:9px;padding:14px 14px 86px;
    /* 로고 색을 바탕으로 깔고 위에서 아래로 깊어진다 */
    background:radial-gradient(130% 106% at 50% 16%,#1B3A16 0%,var(--ln) 46%,#0A1C08 100%)}

  /* 배경 격자 (마크의 기하 감각을 옅게 반복) */
  .grid{position:absolute;inset:0;pointer-events:none;opacity:.5;
    background-image:
      linear-gradient(rgba(255,255,255,.055) 1px,transparent 1px),
      linear-gradient(90deg,rgba(255,255,255,.055) 1px,transparent 1px);
    background-size:26px 26px}

  /* 로고: 제자리에서 우측 상단으로 밀고 올라가는 비행감 */
  .markwrap{position:relative;z-index:2;width:126px;height:126px;flex-shrink:0;
    animation:fly 4.8s ease-in-out infinite}
  @keyframes fly{0%,100%{transform:translate(0,0) rotate(0)}50%{transform:translate(6px,-7px) rotate(2.6deg)}}
  body.go .markwrap{animation-duration:1.5s}

  /* 분사 궤적: 비행 방향(우상단)의 반대편으로 흘러 나간다 */
  .trail{position:absolute;left:50%;top:50%;width:0;height:0;z-index:-1;
    pointer-events:none;transform:rotate(-45deg)}
  .trail i{position:absolute;right:14px;height:3px;border-radius:3px;opacity:0;
    background:linear-gradient(90deg,rgba(122,198,140,0),rgba(122,198,140,.78))}
  .trail i:nth-child(1){top:-18px;width:26px;animation-delay:0s}
  .trail i:nth-child(2){top:-5px;width:40px;animation-delay:-.2s}
  .trail i:nth-child(3){top:8px;width:32px;animation-delay:-.4s}
  .trail i:nth-child(4){top:21px;width:22px;animation-delay:-.6s}
  body.go .trail i{animation:streak .8s linear infinite}
  @keyframes streak{
    0%{opacity:0;transform:translateX(0) scaleX(.35)}
    20%{opacity:.9}
    100%{opacity:0;transform:translateX(-68px) scaleX(1.35)}
  }
  /* 뒤에서 번지는 초록 잔광 */
  .markwrap::before{content:'';position:absolute;inset:-16px;border-radius:50%;z-index:-1;
    background:radial-gradient(circle at 38% 62%,rgba(85,178,107,.36) 0%,transparent 66%);
    opacity:0;transition:opacity .4s}
  body.go .markwrap::before{opacity:1;animation:halo 2.4s ease-in-out infinite}
  @keyframes halo{0%,100%{transform:scale(.9);opacity:.5}50%{transform:scale(1.12);opacity:1}}

  .mark{width:100%;height:100%;display:block;
    filter:drop-shadow(0 10px 22px rgba(0,0,0,.5))}
  /* 1초마다 한 번 툭 뛴다 */
  .mark.pop{animation:pop .34s cubic-bezier(.34,1.56,.64,1) 1}
  @keyframes pop{0%{transform:scale(1)}38%{transform:scale(1.07)}100%{transform:scale(1)}}

  .word{position:relative;z-index:2;font-size:13px;font-weight:800;letter-spacing:.6px;text-indent:0;
    color:var(--ink);opacity:.82}
  .word .tag{margin-left:3px}

  .time{position:relative;z-index:6;font-size:31px;font-weight:800;letter-spacing:-.5px;white-space:nowrap;
    font-variant-numeric:tabular-nums;color:#FFFFFF;line-height:1.05}
  .time .cs{font-size:18px;font-weight:700;color:var(--ln-mid)}

  .row{position:absolute;left:0;right:0;bottom:34px;z-index:6;justify-content:center;display:flex;gap:8px;margin-top:16px}
  button{font-family:inherit;font-size:12.5px;font-weight:700;cursor:pointer;white-space:nowrap;
    padding:11px 0;width:75px;border-radius:11px;transition:all .17s;
    color:var(--ink);border:1.5px solid rgba(234,243,236,.3);background:transparent}
  button:disabled{opacity:.45;cursor:default}
  button:focus-visible{outline:2px solid var(--ln-mid);outline-offset:3px}
  button:hover:not(:disabled){border-color:rgba(234,243,236,.7);background:rgba(255,255,255,.09)}
  #b1{background:#FFFFFF;color:var(--ln);border-color:transparent;font-weight:800;
    box-shadow:0 4px 16px rgba(0,0,0,.36)}
  #b1:hover{background:#E8F5EC;transform:translateY(-1px);box-shadow:0 6px 20px rgba(0,0,0,.42)}

  .laps{position:absolute;left:0;right:0;bottom:14px;z-index:6;text-align:center;min-height:15px;font-size:11px;font-weight:700;letter-spacing:.3px;
    color:rgba(234,243,236,.6);font-variant-numeric:tabular-nums}


  /* ══ 8비트 모드. 시작을 누르면 켜진다 ══════════════════════
     로고를 20x20 격자로 래스터화해서 픽셀 스프라이트를 따로 두고,
     대기 상태의 벡터 마크와 맞바꾼다 */

  /* 픽셀 별밭. 로켓이 우상단으로 나아가므로 좌하단으로 흘러 내린다.
     한 칸(55x67)을 네 번 붙여 두고 정확히 한 칸만큼 밀어 이음매를 없앴다 */
  .stars{position:absolute;inset:0;width:100%;height:100%;z-index:0;
    pointer-events:none;opacity:0;transition:opacity .3s}
  body.go .stars{opacity:1}
  body.go .starfield{animation:drift 3.8s steps(67) infinite}
  @keyframes drift{from{transform:translate(0px,-67px)}to{transform:translate(-55px,0px)}}

  /* 주사선 */
  .scan{position:absolute;inset:0;z-index:4;pointer-events:none;opacity:0;transition:opacity .3s;
    background:repeating-linear-gradient(180deg,rgba(0,0,0,.11) 0 1px,transparent 1px 3px)}
  body.go .scan{opacity:1}

  /* 벡터 마크 ↔ 픽셀 스프라이트 */
  .mark,.pxmark{transition:opacity .22s}
  .pxmark{position:absolute;inset:0;width:100%;height:100%;opacity:0}
  body.go .mark{opacity:0}
  body.go .pxmark{opacity:1}
  .pxbody{fill:#FFFFFF}
  .pxcell{fill:#55B26B;opacity:0}

  /* 8비트에서는 부드러운 궤적과 잔광 대신 각진 화염을 쓴다 */
  body.go .trail{display:none}
  body.go .markwrap::before{opacity:0;animation:none}
  body.go .markwrap{animation-timing-function:steps(4)}

  .pxflame{position:absolute;left:72px;top:104px;width:0;height:0;z-index:-1;
    pointer-events:none;opacity:0;transition:opacity .2s}
  body.go .pxflame{opacity:1}
  .pxflame i{position:absolute;width:7px;height:7px;display:block}
  body.go .pxflame i{animation:jet .62s steps(3) infinite}
  @keyframes jet{
    0%  {transform:translate(0,0);          background:#FFFFFF;opacity:1}
    30% {                                    background:#A9EDC1}
    60% {transform:translate(-15px,17px);   background:#55B26B}
    100%{transform:translate(-32px,36px);   background:#17401F;opacity:0}
  }
  .pxflame i:nth-child(1){animation-delay:0s;      left:0;  top:0}
  .pxflame i:nth-child(2){animation-delay:-.10s;   left:-6px;top:5px}
  .pxflame i:nth-child(3){animation-delay:-.21s;   left:5px; top:3px}
  .pxflame i:nth-child(4){animation-delay:-.31s;   left:-2px;top:8px}
  .pxflame i:nth-child(5){animation-delay:-.41s;   left:-9px;top:2px}
  .pxflame i:nth-child(6){animation-delay:-.52s;   left:2px; top:10px}

  /* 글자도 각지게 */
  body.go .time{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
    letter-spacing:1.5px;text-shadow:2px 2px 0 #071507}
  body.go .word{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
    font-size:11.5px;letter-spacing:1.4px}
  body.go .laps{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;letter-spacing:0}
  body.go .grid{opacity:.14}
  body.go button{border-radius:0;transition:none}
  body.go button:not(#b1){box-shadow:2px 2px 0 rgba(0,0,0,.45)}
  body.go #b1{box-shadow:3px 3px 0 #071507}
  body.go #b1:hover{transform:none;box-shadow:3px 3px 0 #071507}

  @media (prefers-reduced-motion: reduce){
    .starfield,.pxflame i{animation:none !important}
  }

  @media (prefers-reduced-motion: reduce){.markwrap,.markwrap::before,.mark,.trail i{animation:none !important}.trail{display:none}}
</style>
</head>
<body>
  <div class="grid" aria-hidden="true"></div>
  <div class="scan" aria-hidden="true"></div>
  <svg class="stars" viewBox="0 0 55 67" preserveAspectRatio="xMidYMid slice"
       shape-rendering="crispEdges" aria-hidden="true">
    <defs><g id="stile"><rect x="32" y="20" width="1" height="1" fill="#4E9463"/><rect x="38" y="66" width="2" height="2" fill="#79C48F"/><rect x="53" y="65" width="1" height="1" fill="#4E9463"/><rect x="18" y="22" width="1" height="1" fill="#2E5F3D"/><rect x="49" y="52" width="2" height="2" fill="#79C48F"/><rect x="0" y="29" width="1" height="1" fill="#2E5F3D"/><rect x="32" y="15" width="2" height="2" fill="#79C48F"/><rect x="30" y="10" width="1" height="1" fill="#2E5F3D"/><rect x="30" y="29" width="1" height="1" fill="#2E5F3D"/><rect x="30" y="54" width="1" height="1" fill="#2E5F3D"/><rect x="23" y="26" width="1" height="1" fill="#2E5F3D"/><rect x="7" y="55" width="1" height="1" fill="#2E5F3D"/><rect x="34" y="7" width="1" height="1" fill="#4E9463"/><rect x="50" y="41" width="1" height="1" fill="#4E9463"/><rect x="1" y="58" width="1" height="1" fill="#4E9463"/><rect x="26" y="27" width="1" height="1" fill="#4E9463"/><rect x="9" y="7" width="1" height="1" fill="#4E9463"/><rect x="44" y="15" width="1" height="1" fill="#2E5F3D"/><rect x="33" y="58" width="1" height="1" fill="#2E5F3D"/><rect x="18" y="0" width="1" height="1" fill="#2E5F3D"/><rect x="14" y="65" width="1" height="1" fill="#2E5F3D"/><rect x="35" y="40" width="1" height="1" fill="#2E5F3D"/><rect x="29" y="26" width="1" height="1" fill="#2E5F3D"/><rect x="6" y="17" width="1" height="1" fill="#2E5F3D"/></g></defs>
    <g class="starfield">
      <use href="#stile"/><use href="#stile" x="55"/>
      <use href="#stile" y="67"/><use href="#stile" x="55" y="67"/>
    </g>
  </svg>

  <div class="markwrap">
    <div class="trail" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
    <div class="pxflame" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i></div>
  <svg class="mark" id="mark" viewBox="0 0 1280 1280" aria-label="라이너 로고">
    <defs>
      <clipPath id="cell">
        <rect x="650" y="392" width="236" height="236" rx="16"/>
      </clipPath>
    </defs>
    <path d="M790 210 L1068 210 L1068 495 L908 650 L908 945 L700 1145 L700 880 L415 880 L415 580 L135 580 L337 370 L620 370 Z"
          fill="#FFFFFF" stroke="#FFFFFF" stroke-width="20" stroke-linejoin="round"/>
    <rect x="650" y="392" width="236" height="236" rx="16" fill="#12290F"/>
    <g clip-path="url(#cell)">
      <rect id="cellFill" x="650" y="628" width="236" height="0" fill="#55B26B"/>
    </g>
  </svg>
  <!-- 8비트 스프라이트. 가운데 네 칸이 1초마다 아래에서 위로 켜진다 -->
  <svg class="pxmark" viewBox="0 0 20 20" shape-rendering="crispEdges" aria-hidden="true">
    <g class="pxbody"><rect x="12" y="3" width="5" height="1"/><rect x="11" y="4" width="6" height="1"/><rect x="10" y="5" width="7" height="1"/><rect x="5" y="6" width="5" height="1"/><rect x="14" y="6" width="3" height="1"/><rect x="4" y="7" width="6" height="1"/><rect x="14" y="7" width="3" height="1"/><rect x="3" y="8" width="7" height="1"/><rect x="14" y="8" width="2" height="1"/><rect x="6" y="9" width="4" height="1"/><rect x="14" y="9" width="1" height="1"/><rect x="6" y="10" width="8" height="1"/><rect x="6" y="11" width="8" height="1"/><rect x="6" y="12" width="8" height="1"/><rect x="6" y="13" width="8" height="1"/><rect x="11" y="14" width="3" height="1"/><rect x="11" y="15" width="2" height="1"/><rect x="11" y="16" width="1" height="1"/></g>
    <rect class="pxcell" id="px0" x="10" y="9" width="4" height="1"/>
    <rect class="pxcell" id="px1" x="10" y="8" width="4" height="1"/>
    <rect class="pxcell" id="px2" x="10" y="7" width="4" height="1"/>
    <rect class="pxcell" id="px3" x="10" y="6" width="4" height="1"/>
  </svg>
  </div>

  <div class="word">LINER<span class="tag">&middot; AI FOR ALL</span></div>
  <div class="time" id="t" role="timer">00:00:00<span class="cs">.00</span></div>

  <div class="row">
    <button id="b1" type="button">시작</button>
    <button id="b2" type="button" disabled>랩</button>
    <button id="b3" type="button" disabled>리셋</button>
  </div>
  <div class="laps" id="lp" aria-live="polite"></div>

<script>
(function(){
  var t=document.getElementById('t'),cell=document.getElementById('cellFill'),
      mark=document.getElementById('mark'),lastSec=-1,
      b1=document.getElementById('b1'),b2=document.getElementById('b2'),
      b3=document.getElementById('b3'),lp=document.getElementById('lp');
  var run=false,st=0,acc=0,iv=null,laps=[],last=0;
  var CELL_TOP=392,CELL_H=236,CELL_BOT=CELL_TOP+CELL_H;
  var pxCells=[0,1,2,3].map(function(i){return document.getElementById('px'+i);});
  function el(){return acc+(run?performance.now()-st:0);}
  function pad(n,w){return String(n).padStart(w,'0');}
  function f(ms){if(ms<0)ms=0;var cs=Math.floor(ms/10)%100,s=Math.floor(ms/1000),ss=s%60,m=Math.floor(s/60),mm=m%60,hh=Math.floor(m/60);
    if(hh>99)hh=99;
    return pad(hh,2)+':'+pad(mm,2)+':'+pad(ss,2)+'<span class="cs">.'+pad(cs,2)+'</span>';}
  function plain(ms){if(ms<0)ms=0;var cs=Math.floor(ms/10)%100,s=Math.floor(ms/1000),ss=s%60,mm=Math.floor(s/60);
    return pad(mm,2)+':'+pad(ss,2)+'.'+pad(cs,2);}
  function draw(){
    var e=el();
    t.innerHTML=f(e);
    /* 흰 사각형이 1초마다 아래에서 위로 차오른다 */
    var frac=(e%1000)/1000;
    var h=frac*CELL_H;
    cell.setAttribute('y',CELL_BOT-h);
    cell.setAttribute('height',h);
    /* 8비트 쪽은 같은 1초를 네 칸으로 끊어 켠다 */
    var lit=Math.floor(frac*5);
    for(var i=0;i<4;i++) pxCells[i].style.opacity = (i<lit)?1:0;
    /* 1초를 채울 때마다 마크가 한 번 뛴다 */
    var sec=Math.floor(e/1000);
    if(run&&sec!==lastSec&&lastSec!==-1){
      mark.classList.remove('pop'); void mark.offsetWidth; mark.classList.add('pop');
    }
    lastSec=sec;
  }

  /* ── 접근성 공통 ──
     정지·초기화 결과를 스크린리더에 한 번씩 알린다. 시간 표시 자체는
     10ms마다 바뀌므로 라이브 리전으로 두지 않는다. */
  var srSay=(function(){
    var r=document.createElement('div');
    r.setAttribute('role','status'); r.setAttribute('aria-live','polite');
    r.style.cssText='position:absolute;width:1px;height:1px;margin:-1px;padding:0;'+
      'overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0';
    document.body.appendChild(r);
    return function(m){ r.textContent=''; setTimeout(function(){ r.textContent=m; },30); };
  })();
  function srHuman(ms){
    if(ms<0)ms=0;
    var cs=Math.floor(ms/10)%100, s=Math.floor(ms/1000), ss=s%60, mm=Math.floor(s/60);
    return (mm?mm+'분 ':'')+ss+'점'+String(cs).padStart(2,'0')+'초';
  }
  var srWasRun=false, srLast=0;
  function ui(){
    document.body.classList.toggle('go',run);
    b1.textContent=run?'정지':(el()>0?'재개':'시작');
    b2.disabled=!run; b3.disabled=run||el()===0;
  
    /* 정지와 초기화를 알리고, 방금 누른 버튼이 잠기면 포커스를 되돌린다 */
    var srE=el();
    if(srWasRun&&!run) srSay('정지. 경과 시간 '+srHuman(srE));
    else if(!srWasRun&&!run&&srLast>0&&srE===0) srSay('초기화했습니다');
    srWasRun=run; srLast=srE;
    if(document.activeElement&&document.activeElement.disabled) b1.focus();
  }
  function start(){if(run)return;run=true;st=performance.now();if(!iv)iv=setInterval(draw,31);draw();ui();}
  function stop(){if(!run)return;acc=el();run=false;clearInterval(iv);iv=null;draw();ui();}
  function reset(){if(run)return;acc=0;st=0;laps=[];last=0;lastSec=-1;lp.textContent='';draw();ui();}
  function lap(){if(!run)return;var e=el(),sp=e-last;last=e;laps.push(sp);
    var best=Math.min.apply(null,laps);
    lp.textContent='LAP '+laps.length+' · '+plain(sp)+(laps.length>1&&sp===best?' ★':'');}
  b1.addEventListener('click',function(){run?stop():start();});
  b2.addEventListener('click',lap);
  b3.addEventListener('click',reset);
  document.addEventListener('keydown',function(e){
    if(e.metaKey||e.ctrlKey||e.altKey||e.repeat)return;
    if(e.target&&e.target.tagName==='BUTTON'&&e.key===' ')return;
    if(e.key===' '){e.preventDefault();run?stop():start();}
    else if(e.key==='l'||e.key==='L'){lap();}
    else if(e.key==='r'||e.key==='R'){reset();}
  });
  document.addEventListener('visibilitychange',function(){if(!document.hidden&&run)draw();});
  window.addEventListener('pageshow',function(){if(run&&!iv)iv=setInterval(draw,31);});
  window.addEventListener('pagehide',function(){clearInterval(iv);iv=null;});
  draw();ui();
})();
</script>
</body>
</html>
