<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>프리챌 스탑워치</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='%23A32739'/><rect x='14' y='42' width='72' height='16' fill='%23fff'/><rect x='30' y='24' width='16' height='16' fill='%23D9A227'/><rect x='58' y='60' width='16' height='16' fill='%23D9A227'/></svg>" />
<style>
  @font-face{font-family:'Pretendard';src:url('../fonts/PretendardVariable.ttf') format('truetype');font-weight:100 900;font-style:normal;font-display:swap;}
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overflow:hidden}
  :root{ --red:#A32739; --ink:#FFFFFF; }   /* 로고의 진한 자줏빛 붉은색을 바탕으로 깐다 */
  body{font-family:'Pretendard',-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
    color:var(--ink);position:relative;
    background:radial-gradient(126% 84% at 50% 8%,#C23347 0%,var(--red) 44%,#7C1D2B 100%);
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;padding:16px 16px 84px}

  /* 위에서 흰 빛이 옅게 번진다 */
  .sky{position:absolute;inset:0;pointer-events:none;
    background:radial-gradient(120% 76% at 50% -14%,rgba(255,255,255,.16) 0%,transparent 62%)}
  /* 2000년대 모눈 종이 */
  .paper{position:absolute;inset:0;pointer-events:none;opacity:.5;
    background-image:
      linear-gradient(rgba(255,255,255,.14) 1px,transparent 1px),
      linear-gradient(90deg,rgba(255,255,255,.14) 1px,transparent 1px);
    background-size:16px 16px}

  /* ── 수치가 화면의 주인공 ── */
  .read{position:relative;z-index:2;display:flex;flex-direction:column;
    align-items:center;gap:9px}
  .time{font-size:34px;font-weight:800;letter-spacing:-1.1px;white-space:nowrap;line-height:1;
    font-variant-numeric:tabular-nums}
  .time .cs{font-size:20px;font-weight:700;color:rgba(255,255,255,.66)}

  /* ── 시간과 로고 사이의 픽셀 띠. 뷰박스와 같은 크기로 그려야 셀 경계가 안 뭉갠다 ── */
  .mosaic{position:relative;z-index:2;flex-shrink:0;width:144px;height:36px;display:block}



  /* 재는 동안 칸마다 제각기 농도가 오간다. 색을 바꾸는 게 아니라
     바탕색 위에 얹은 흰빛과 그늘의 투명도만 움직인다 */
  body.go .mosaic rect{animation-iteration-count:infinite;animation-timing-function:ease-in-out}
  body.go .mosaic .pxA{animation-name:pxA}
  body.go .mosaic .pxB{animation-name:pxB}
  body.go .mosaic .pxD{animation-name:pxD}
  body.go .mosaic .pxG{animation-name:pxG}
  @keyframes pxA{0%,100%{opacity:.14}28%{opacity:.30}56%{opacity:.09}80%{opacity:.22}}
  @keyframes pxB{0%,100%{opacity:.34}24%{opacity:.16}52%{opacity:.46}78%{opacity:.25}}
  @keyframes pxD{0%,100%{opacity:.11}30%{opacity:.04}60%{opacity:.17}84%{opacity:.07}}
  @keyframes pxG{0%,100%{opacity:.46}26%{opacity:.22}58%{opacity:.60}82%{opacity:.34}}

  /* ── 워드마크 ── */
  .badge{position:relative;z-index:2;flex-shrink:0}
  .badge .wm{display:block;font-size:29px;font-weight:900;letter-spacing:1.6px;text-indent:1.6px;
    line-height:1;color:#FFFFFF}
  body.go .badge{animation:lift 2.2s ease-in-out infinite}
  @keyframes lift{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}

  .laps{position:absolute;left:0;right:0;bottom:14px;z-index:3;text-align:center;min-height:14px;
    font-size:11px;font-weight:800;letter-spacing:.2px;color:rgba(255,255,255,.6);font-variant-numeric:tabular-nums}

  /* ── 조작부 ── */
  .row{position:absolute;left:0;right:0;bottom:34px;z-index:3;display:flex;justify-content:center;gap:8px}
  button{font-family:inherit;font-size:12.5px;font-weight:800;cursor:pointer;white-space:nowrap;
    padding:11px 0;width:78px;border-radius:8px;transition:all .16s;
    color:#FFFFFF;border:1.5px solid rgba(255,255,255,.34);background:transparent}
  button:disabled{color:rgba(255,255,255,.4);background:rgba(255,255,255,.06);
    border-color:rgba(255,255,255,.16);cursor:default}
  button:focus-visible{outline:2px solid #FFFFFF;outline-offset:3px}
  button:hover:not(:disabled){border-color:rgba(255,255,255,.8);background:rgba(255,255,255,.12)}
  #b1{background:#FFFFFF;color:var(--red);border-color:transparent;
    box-shadow:0 4px 14px rgba(0,0,0,.28)}
  #b1:hover{background:#FBE9EC;border-color:transparent}

  @media (prefers-reduced-motion: reduce){
    *,*::before,*::after{animation-duration:.001ms !important;animation-iteration-count:1 !important;
      transition-duration:.001ms !important}
  }
</style>
</head>
<body>
  <div class="sky" aria-hidden="true"></div>
  <div class="paper" aria-hidden="true"></div>

  <div class="read">
    <div class="time" id="t" role="timer">00:00:00<span class="cs">.00</span></div>
  </div>

  <svg class="mosaic" viewBox="0 0 144 36" aria-hidden="true" shape-rendering="crispEdges"><rect class="pxB" style="animation-delay:-1.89s;animation-duration:2.42s" x="12" y="0" width="12" height="12" fill="#FFFFFF" opacity="0.358"/><rect class="pxD" style="animation-delay:-2.64s;animation-duration:3.59s" x="24" y="0" width="12" height="12" fill="#000000" opacity="0.148"/><rect class="pxB" style="animation-delay:-4.29s;animation-duration:3.81s" x="36" y="0" width="12" height="12" fill="#FFFFFF" opacity="0.395"/><rect class="pxD" style="animation-delay:-0.51s;animation-duration:4.89s" x="48" y="0" width="12" height="12" fill="#000000" opacity="0.124"/><rect class="pxB" style="animation-delay:-1.1s;animation-duration:2.72s" x="60" y="0" width="12" height="12" fill="#FFFFFF" opacity="0.417"/><rect class="pxA" style="animation-delay:-1.07s;animation-duration:2.62s" x="84" y="0" width="12" height="12" fill="#FFFFFF" opacity="0.166"/><rect class="pxB" style="animation-delay:-4.29s;animation-duration:4.66s" x="96" y="0" width="12" height="12" fill="#FFFFFF" opacity="0.351"/><rect class="pxA" style="animation-delay:-2.08s;animation-duration:3.55s" x="108" y="0" width="12" height="12" fill="#FFFFFF" opacity="0.218"/><rect class="pxB" style="animation-delay:-4.94s;animation-duration:2.5s" x="0" y="12" width="12" height="12" fill="#FFFFFF" opacity="0.271"/><rect class="pxD" style="animation-delay:-2.59s;animation-duration:2.62s" x="12" y="12" width="12" height="12" fill="#000000" opacity="0.122"/><rect class="pxD" style="animation-delay:-0.59s;animation-duration:3.39s" x="24" y="12" width="12" height="12" fill="#000000" opacity="0.102"/><rect class="pxD" style="animation-delay:-3.76s;animation-duration:4.56s" x="36" y="12" width="12" height="12" fill="#000000" opacity="0.117"/><rect class="pxG" style="animation-delay:-4.69s;animation-duration:4.49s" x="48" y="12" width="12" height="12" fill="#F5C954" opacity="0.46"/><rect class="pxB" style="animation-delay:-0.37s;animation-duration:3.05s" x="60" y="12" width="12" height="12" fill="#FFFFFF" opacity="0.33"/><rect class="pxA" style="animation-delay:-4.26s;animation-duration:2.61s" x="72" y="12" width="12" height="12" fill="#FFFFFF" opacity="0.174"/><rect class="pxA" style="animation-delay:-4.65s;animation-duration:2.62s" x="84" y="12" width="12" height="12" fill="#FFFFFF" opacity="0.172"/><rect class="pxA" style="animation-delay:-3.28s;animation-duration:4.75s" x="96" y="12" width="12" height="12" fill="#FFFFFF" opacity="0.206"/><rect class="pxB" style="animation-delay:-1.32s;animation-duration:3.84s" x="108" y="12" width="12" height="12" fill="#FFFFFF" opacity="0.391"/><rect class="pxD" style="animation-delay:-2.99s;animation-duration:3.03s" x="120" y="12" width="12" height="12" fill="#000000" opacity="0.103"/><rect class="pxA" style="animation-delay:-3.74s;animation-duration:4.62s" x="132" y="12" width="12" height="12" fill="#FFFFFF" opacity="0.148"/><rect class="pxA" style="animation-delay:-2.06s;animation-duration:2.86s" x="12" y="24" width="12" height="12" fill="#FFFFFF" opacity="0.209"/><rect class="pxA" style="animation-delay:-1.82s;animation-duration:2.95s" x="24" y="24" width="12" height="12" fill="#FFFFFF" opacity="0.167"/><rect class="pxG" style="animation-delay:-4.59s;animation-duration:4.62s" x="36" y="24" width="12" height="12" fill="#F5C954" opacity="0.46"/><rect class="pxB" style="animation-delay:-4.74s;animation-duration:4.32s" x="48" y="24" width="12" height="12" fill="#FFFFFF" opacity="0.384"/><rect class="pxD" style="animation-delay:-2.12s;animation-duration:3.79s" x="60" y="24" width="12" height="12" fill="#000000" opacity="0.086"/><rect class="pxA" style="animation-delay:-1.43s;animation-duration:3.46s" x="72" y="24" width="12" height="12" fill="#FFFFFF" opacity="0.156"/><rect class="pxD" style="animation-delay:-2.52s;animation-duration:2.61s" x="84" y="24" width="12" height="12" fill="#000000" opacity="0.098"/><rect class="pxB" style="animation-delay:-3.67s;animation-duration:3.7s" x="108" y="24" width="12" height="12" fill="#FFFFFF" opacity="0.37"/></svg>

  <div class="badge"><span class="wm">FREECHAL</span></div>

  <div class="laps" id="lp" aria-live="polite"></div>

  <div class="row">
    <button id="b1" type="button">시작</button>
    <button id="b2" type="button" disabled>랩</button>
    <button id="b3" type="button" disabled>리셋</button>
  </div>

<script>
(function(){
  var t=document.getElementById('t'),
      lp=document.getElementById('lp'),
      b1=document.getElementById('b1'),b2=document.getElementById('b2'),b3=document.getElementById('b3');
  var run=false,st=0,acc=0,iv=null,laps=[],last=0;
  function el(){return acc+(run?performance.now()-st:0);}
  function pad(n,w){return String(n).padStart(w,'0');}
  function f(ms){if(ms<0)ms=0;var cs=Math.floor(ms/10)%100,s=Math.floor(ms/1000),ss=s%60,m=Math.floor(s/60),mm=m%60,hh=Math.floor(m/60);
    if(hh>99)hh=99;
    return pad(hh,2)+':'+pad(mm,2)+':'+pad(ss,2)+'<span class="cs">.'+pad(cs,2)+'</span>';}
  function plain(ms){if(ms<0)ms=0;var cs=Math.floor(ms/10)%100,s=Math.floor(ms/1000),ss=s%60,mm=Math.floor(s/60);
    return pad(mm,2)+':'+pad(ss,2)+'.'+pad(cs,2);}
  function draw(){ t.innerHTML=f(el()); }

  /* ── 접근성 공통 ──
     정지·초기화 결과를 스크린리더에 한 번씩 알린다. 시간 표시 자체는
     10ms마다 바뀌므로 라이브 리전으로 두지 않는다. */
  var srSay=(function(){
    var r=document.createElement('div');
    r.setAttribute('role','status'); r.setAttribute('aria-live','polite');
    r.style.cssText='position:absolute;width:1px;height:1px;margin:-1px;padding:0;'+
      'overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0';
    document.body.appendChild(r);
    return function(m){ r.textContent=''; setTimeout(function(){ r.textContent=m; },30); };
  })();
  function srHuman(ms){
    if(ms<0)ms=0;
    var cs=Math.floor(ms/10)%100, s=Math.floor(ms/1000), ss=s%60, mm=Math.floor(s/60);
    return (mm?mm+'분 ':'')+ss+'점'+String(cs).padStart(2,'0')+'초';
  }
  var srWasRun=false, srLast=0;
  function ui(){
    document.body.classList.toggle('go',run);
    b1.textContent=run?'정지':(el()>0?'재개':'시작');
    b2.disabled=!run; b3.disabled=run||el()===0;
  
    /* 정지와 초기화를 알리고, 방금 누른 버튼이 잠기면 포커스를 되돌린다 */
    var srE=el();
    if(srWasRun&&!run) srSay('정지. 경과 시간 '+srHuman(srE));
    else if(!srWasRun&&!run&&srLast>0&&srE===0) srSay('초기화했습니다');
    srWasRun=run; srLast=srE;
    if(document.activeElement&&document.activeElement.disabled) b1.focus();
  }
  function start(){if(run)return;run=true;st=performance.now();if(!iv)iv=setInterval(draw,31);draw();ui();}
  function stop(){if(!run)return;acc=el();run=false;clearInterval(iv);iv=null;draw();ui();}
  function reset(){if(run)return;acc=0;st=0;laps=[];last=0;lp.textContent='';draw();ui();}
  /* 랩 하나가 도전 한 번이다 */
  function lap(){
    if(!run)return;
    var e=el(),sp=e-last;last=e;laps.push(sp);
    var best=Math.min.apply(null,laps);
    lp.textContent='도전 '+laps.length+'  +'+plain(sp)+(laps.length>1?(sp===best?'  ★ 최단':'  · 최단 '+plain(best)):'');
    ui();
  }
  b1.addEventListener('click',function(){run?stop():start();});
  b2.addEventListener('click',lap);
  b3.addEventListener('click',reset);
  document.addEventListener('keydown',function(e){
    if(e.metaKey||e.ctrlKey||e.altKey||e.repeat)return;
    if(e.target&&e.target.tagName==='BUTTON'&&e.key===' ')return;
    if(e.key===' '){e.preventDefault();run?stop():start();}
    else if(e.key==='l'||e.key==='L'){lap();}
    else if(e.key==='r'||e.key==='R'){reset();}
  });
  document.addEventListener('visibilitychange',function(){if(!document.hidden&&run)draw();});
  window.addEventListener('pageshow',function(){if(run&&!iv)iv=setInterval(draw,31);});
  window.addEventListener('pagehide',function(){clearInterval(iv);iv=null;});
  draw();ui();
})();
</script>
</body>
</html>
