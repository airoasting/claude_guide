<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>프리챌 스탑워치</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='%23fff'/><circle cx='50' cy='50' r='32' fill='none' stroke='%23A32739' stroke-width='13' stroke-dasharray='150 62' transform='rotate(42 50 50)'/></svg>" />
<style>
  @font-face{font-family:'Pretendard';src:url('../fonts/PretendardVariable.ttf') format('truetype');font-weight:100 900;font-style:normal;font-display:swap;}
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overflow:hidden}
  :root{ --red:#A32739; --ink:#1A1D24; }   /* 로고의 진한 자줏빛 붉은색 */
  body{font-family:'Pretendard',-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
    color:var(--ink);background:#FFFFFF;position:relative;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:11px;padding:16px 16px 84px}

  /* 로고 색이 옅게 번진다 */
  .sky{position:absolute;inset:0;pointer-events:none;
    background:radial-gradient(120% 76% at 50% -14%,rgba(163,39,57,.09) 0%,transparent 62%)}
  /* 2000년대 모눈 종이 */
  .paper{position:absolute;inset:0;pointer-events:none;opacity:.5;
    background-image:
      linear-gradient(rgba(120,150,190,.16) 1px,transparent 1px),
      linear-gradient(90deg,rgba(120,150,190,.16) 1px,transparent 1px);
    background-size:16px 16px}

  /* ── 머리말: 약자를 그대로 펼친다 ── */
  .cap{position:relative;z-index:2;font-size:9.5px;font-weight:900;letter-spacing:3.4px;text-indent:3.4px;
    color:#98A0AC;white-space:nowrap}
  .cap b{color:var(--red);font-weight:900}

  /* ── 마크 = 로고의 빨간 C 게이지 ── */
  .mark{position:relative;z-index:2;width:148px;height:148px;flex-shrink:0}
  .mark svg{width:100%;height:100%;display:block;overflow:visible}
  .c{fill:none;stroke-width:17;stroke-linecap:butt}
  .c.track{stroke:#EEDDE1}
  .c.prog{stroke:var(--red);transition:stroke-dashoffset .12s linear}

  /* 시간은 C 안에 */
  .read{position:absolute;inset:0;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:3px;pointer-events:none}
  .time{font-size:21px;font-weight:800;letter-spacing:-.7px;white-space:nowrap;line-height:1;
    font-variant-numeric:tabular-nums}
  .time .cs{font-size:13px;font-weight:700;color:var(--red)}
  .sub{font-size:9px;font-weight:900;letter-spacing:1.8px;text-indent:1.8px;color:#6B7383;white-space:nowrap}

  /* ── 시간과 로고 사이의 픽셀 띠. 뷰박스와 같은 크기로 그려야 셀 경계가 안 뭉갠다 ── */
  .mosaic{position:relative;z-index:2;flex-shrink:0;width:144px;height:36px;display:block}

  /* ── 워드마크 ── */
  .badge{position:relative;z-index:2;flex-shrink:0}
  .badge .wm{display:block;font-size:29px;font-weight:900;letter-spacing:1.6px;text-indent:1.6px;
    line-height:1;color:var(--red)}
  body.go .badge{animation:lift 2.2s ease-in-out infinite}
  @keyframes lift{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}

  .laps{position:absolute;left:0;right:0;bottom:14px;z-index:3;text-align:center;min-height:14px;
    font-size:11px;font-weight:800;letter-spacing:.2px;color:#6B7583;font-variant-numeric:tabular-nums}

  /* ── 조작부 ── */
  .row{position:absolute;left:0;right:0;bottom:34px;z-index:3;display:flex;justify-content:center;gap:8px}
  button{font-family:inherit;font-size:12.5px;font-weight:800;cursor:pointer;white-space:nowrap;
    padding:11px 0;width:78px;border-radius:8px;transition:all .16s;
    color:var(--ink);border:1.5px solid rgba(26,29,36,.2);background:#fff}
  button:disabled{color:#A6AEBB;background:#EEF2F7;border-color:rgba(26,29,36,.1);cursor:default}
  button:focus-visible{outline:2px solid var(--red);outline-offset:2px}
  button:hover:not(:disabled){border-color:var(--ink);background:#FAFCFF}
  #b1{background:var(--red);color:#fff;border-color:transparent;
    box-shadow:0 4px 12px rgba(163,39,57,.3)}
  #b1:hover{background:#82202E;border-color:transparent}

  @media (prefers-reduced-motion: reduce){
    *,*::before,*::after{animation-duration:.001ms !important;animation-iteration-count:1 !important;
      transition-duration:.001ms !important}
  }
</style>
</head>
<body>
  <div class="sky" aria-hidden="true"></div>
  <div class="paper" aria-hidden="true"></div>

  <div class="cap"><b>FREE</b> 자유 + <b>CHAL</b>LENGE 도전</div>

  <div class="mark">
    <svg viewBox="0 0 200 200" aria-hidden="true">
      <!-- 로고의 C. 오른쪽이 열려 있고, 아래 끝에서 시계방향으로 차오른다 (60초 한 바퀴) -->
      <path class="c track" d="M156.48 150.85 A76 76 0 1 1 156.48 49.15"/>
      <path class="c prog" id="ring" d="M156.48 150.85 A76 76 0 1 1 156.48 49.15"
            pathLength="1" stroke-dasharray="1" stroke-dashoffset="1"/>
    </svg>
    <div class="read">
      <div class="time" id="t" role="timer">00:00:00<span class="cs">.00</span></div>
      <div class="sub" id="sub">도전 0</div>
    </div>
  </div>

  <svg class="mosaic" viewBox="0 0 144 36" aria-hidden="true" shape-rendering="crispEdges"><rect x="12" y="0" width="12" height="12" fill="#E6E6E6"/><rect x="24" y="0" width="12" height="12" fill="#D2D2D2"/><rect x="36" y="0" width="12" height="12" fill="#B6B6B6"/><rect x="48" y="0" width="12" height="12" fill="#D2D2D2"/><rect x="60" y="0" width="12" height="12" fill="#E6E6E6"/><rect x="84" y="0" width="12" height="12" fill="#E6E6E6"/><rect x="96" y="0" width="12" height="12" fill="#D2D2D2"/><rect x="108" y="0" width="12" height="12" fill="#E6E6E6"/><rect x="0" y="12" width="12" height="12" fill="#E6E6E6"/><rect x="12" y="12" width="12" height="12" fill="#D2D2D2"/><rect x="24" y="12" width="12" height="12" fill="#B6B6B6"/><rect x="36" y="12" width="12" height="12" fill="#909090"/><rect x="48" y="12" width="12" height="12" fill="#A32739"/><rect x="60" y="12" width="12" height="12" fill="#B6B6B6"/><rect x="72" y="12" width="12" height="12" fill="#D2D2D2"/><rect x="84" y="12" width="12" height="12" fill="#D9A227"/><rect x="96" y="12" width="12" height="12" fill="#E6E6E6"/><rect x="108" y="12" width="12" height="12" fill="#D2D2D2"/><rect x="120" y="12" width="12" height="12" fill="#E6E6E6"/><rect x="132" y="12" width="12" height="12" fill="#E6E6E6"/><rect x="12" y="24" width="12" height="12" fill="#D2D2D2"/><rect x="24" y="24" width="12" height="12" fill="#E6E6E6"/><rect x="36" y="24" width="12" height="12" fill="#D9A227"/><rect x="48" y="24" width="12" height="12" fill="#D2D2D2"/><rect x="60" y="24" width="12" height="12" fill="#B6B6B6"/><rect x="72" y="24" width="12" height="12" fill="#D2D2D2"/><rect x="84" y="24" width="12" height="12" fill="#E6E6E6"/><rect x="108" y="24" width="12" height="12" fill="#E6E6E6"/></svg>

  <div class="badge"><span class="wm">FREECHAL</span></div>

  <div class="laps" id="lp" aria-live="polite"></div>

  <div class="row">
    <button id="b1" type="button">시작</button>
    <button id="b2" type="button" disabled>랩</button>
    <button id="b3" type="button" disabled>리셋</button>
  </div>

<script>
(function(){
  var t=document.getElementById('t'),sub=document.getElementById('sub'),
      ring=document.getElementById('ring'),lp=document.getElementById('lp'),
      b1=document.getElementById('b1'),b2=document.getElementById('b2'),b3=document.getElementById('b3');
  var run=false,st=0,acc=0,iv=null,laps=[],last=0;
  function el(){return acc+(run?performance.now()-st:0);}
  function pad(n,w){return String(n).padStart(w,'0');}
  function f(ms){if(ms<0)ms=0;var cs=Math.floor(ms/10)%100,s=Math.floor(ms/1000),ss=s%60,m=Math.floor(s/60),mm=m%60,hh=Math.floor(m/60);
    if(hh>99)hh=99;
    return pad(hh,2)+':'+pad(mm,2)+':'+pad(ss,2)+'<span class="cs">.'+pad(cs,2)+'</span>';}
  function plain(ms){if(ms<0)ms=0;var cs=Math.floor(ms/10)%100,s=Math.floor(ms/1000),ss=s%60,mm=Math.floor(s/60);
    return pad(mm,2)+':'+pad(ss,2)+'.'+pad(cs,2);}
  function draw(){
    var e=el();
    t.innerHTML=f(e);
    ring.setAttribute('stroke-dashoffset', (1-(e%60000)/60000).toFixed(4));
  }

  /* ── 접근성 공통 ──
     정지·초기화 결과를 스크린리더에 한 번씩 알린다. 시간 표시 자체는
     10ms마다 바뀌므로 라이브 리전으로 두지 않는다. */
  var srSay=(function(){
    var r=document.createElement('div');
    r.setAttribute('role','status'); r.setAttribute('aria-live','polite');
    r.style.cssText='position:absolute;width:1px;height:1px;margin:-1px;padding:0;'+
      'overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0';
    document.body.appendChild(r);
    return function(m){ r.textContent=''; setTimeout(function(){ r.textContent=m; },30); };
  })();
  function srHuman(ms){
    if(ms<0)ms=0;
    var cs=Math.floor(ms/10)%100, s=Math.floor(ms/1000), ss=s%60, mm=Math.floor(s/60);
    return (mm?mm+'분 ':'')+ss+'점'+String(cs).padStart(2,'0')+'초';
  }
  var srWasRun=false, srLast=0;
  function ui(){
    document.body.classList.toggle('go',run);
    b1.textContent=run?'정지':(el()>0?'재개':'시작');
    b2.disabled=!run; b3.disabled=run||el()===0;
    sub.textContent='도전 '+laps.length;
  
    /* 정지와 초기화를 알리고, 방금 누른 버튼이 잠기면 포커스를 되돌린다 */
    var srE=el();
    if(srWasRun&&!run) srSay('정지. 경과 시간 '+srHuman(srE));
    else if(!srWasRun&&!run&&srLast>0&&srE===0) srSay('초기화했습니다');
    srWasRun=run; srLast=srE;
    if(document.activeElement&&document.activeElement.disabled) b1.focus();
  }
  function start(){if(run)return;run=true;st=performance.now();if(!iv)iv=setInterval(draw,31);draw();ui();}
  function stop(){if(!run)return;acc=el();run=false;clearInterval(iv);iv=null;draw();ui();}
  function reset(){if(run)return;acc=0;st=0;laps=[];last=0;lp.textContent='';draw();ui();}
  /* 랩 하나가 도전 한 번이다 */
  function lap(){
    if(!run)return;
    var e=el(),sp=e-last;last=e;laps.push(sp);
    var best=Math.min.apply(null,laps);
    lp.textContent='도전 '+laps.length+'  +'+plain(sp)+(laps.length>1?(sp===best?'  ★ 최단':'  · 최단 '+plain(best)):'');
    ui();
  }
  b1.addEventListener('click',function(){run?stop():start();});
  b2.addEventListener('click',lap);
  b3.addEventListener('click',reset);
  document.addEventListener('keydown',function(e){
    if(e.metaKey||e.ctrlKey||e.altKey||e.repeat)return;
    if(e.target&&e.target.tagName==='BUTTON'&&e.key===' ')return;
    if(e.key===' '){e.preventDefault();run?stop():start();}
    else if(e.key==='l'||e.key==='L'){lap();}
    else if(e.key==='r'||e.key==='R'){reset();}
  });
  document.addEventListener('visibilitychange',function(){if(!document.hidden&&run)draw();});
  window.addEventListener('pageshow',function(){if(run&&!iv)iv=setInterval(draw,31);});
  window.addEventListener('pagehide',function(){clearInterval(iv);iv=null;});
  draw();ui();
})();
</script>
</body>
</html>
