<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>슬램 스탑워치</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='44' fill='%23F0782A' stroke='%232A1A10' stroke-width='6'/><path d='M50 6v88M6 50h88' stroke='%232A1A10' stroke-width='5'/></svg>" />
<style>
  @font-face{font-family:'Pretendard';src:url('../fonts/PretendardVariable.ttf') format('truetype');font-weight:100 900;font-display:swap;}
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overflow:hidden}
  :root{--org:#F5761E;--org-dk:#D9520E;--ink:#2A1A10;--paper:#FFF9EE;--red:#D42A1E;--yel:#FFD23A;--led:#FF4A3A;}
  body{font-family:'Pretendard',-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",sans-serif;color:var(--ink);
    position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:8px 8px 8px;word-break:keep-all;
    background:var(--org)}
  /* 방사선 + 망점. 배경층을 따로 잘라 스크롤 영역을 늘리지 않는다 */
  .bg{position:absolute;inset:0;overflow:hidden;pointer-events:none}
  .rays{position:absolute;inset:-40%;
    background:repeating-conic-gradient(from 0deg at 50% 26%,rgba(255,255,255,.16) 0deg 9deg,transparent 9deg 18deg)}
  .dots{position:absolute;inset:0;opacity:.35;
    background:radial-gradient(circle,rgba(255,255,255,.55) 1px,transparent 1.4px) 0 0/9px 9px}

  /* ── 만화 한 컷: 집중선 배경, 굵은 먹선, 망점 그림자 ── */
  .panel{position:relative;width:min(304px,100%);height:178px;margin-bottom:12px;overflow:hidden;
    background:#FFF;border:3px solid var(--ink);box-shadow:5px 5px 0 var(--ink)}
  .speed{position:absolute;inset:-60%;
    background:repeating-conic-gradient(from 0deg at 50% 50%,rgba(42,26,16,.85) 0deg .55deg,transparent .55deg 4.2deg);
    -webkit-mask:radial-gradient(circle at 50% 50%,transparent 24%,#000 46%);mask:radial-gradient(circle at 50% 50%,transparent 24%,#000 46%)}
  body.go .speed{animation:spin 14s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .hero{position:absolute;left:50%;bottom:-22px;width:207px;height:184px;margin-left:-103px}
  .hero svg{display:block;width:100%;height:100%;overflow:visible}
  .ball{transform-box:view-box;transform-origin:88px 14px}
  body.go .ball{animation:shoot 1.1s cubic-bezier(.35,0,.6,1) infinite alternate}
  @keyframes shoot{from{transform:translate(0,0) rotate(0)}to{transform:translate(10px,-10px) rotate(200deg)}}
  .armR{transform-box:view-box;transform-origin:64px 112px}
  body.go .armR{animation:push 1.1s ease-in-out infinite alternate}
  @keyframes push{to{transform:rotate(4deg) translateY(-3px)}}
  .sweat{opacity:0;transition:opacity .3s}
  body.go .sweat{opacity:1}
  .bubble{position:absolute;right:8px;top:10px;padding:8px 10px;border-radius:50%;background:#FFF;border:2px solid var(--ink);
    font-size:11px;font-weight:900;line-height:1.25;text-align:center;color:var(--ink);z-index:2}
  .bubble::after{content:"";position:absolute;left:8px;bottom:-9px;width:12px;height:12px;background:#FFF;
    border-right:2px solid var(--ink);border-bottom:2px solid var(--ink);transform:skewX(30deg) rotate(30deg)}
  .cap{position:absolute;left:0;bottom:0;padding:4px 8px 3px;background:var(--ink);color:#FFF;font-size:10px;font-weight:900;
    font-style:italic;letter-spacing:.6px;z-index:2}
  .sfx{position:absolute;left:10px;top:14px;font-size:24px;font-weight:900;font-style:italic;color:#FFF;z-index:2;
    -webkit-text-stroke:2px var(--ink);paint-order:stroke fill;transform:rotate(-12deg);opacity:0;transition:opacity .2s}
  body.go .sfx{opacity:1;animation:pop 1.1s ease-in-out infinite alternate}
  @keyframes pop{from{transform:rotate(-12deg) scale(.9)}to{transform:rotate(-12deg) scale(1.12)}}

  /* 스코어보드 */
  .board{position:relative;width:min(304px,100%);padding:12px 12px 12px;border-radius:18px;background:var(--paper);
    border:3px solid var(--ink);box-shadow:5px 5px 0 var(--ink),0 16px 30px rgba(0,0,0,.25)}
  .led{padding:11px 10px 9px;border-radius:10px;background:#160E0A;border:3px solid #3A2A1E;
    box-shadow:inset 0 0 0 1px #5A4030,inset 0 6px 14px rgba(0,0,0,.7)}
  .time{text-align:center;font-family:"Courier New",Courier,monospace;font-weight:700;font-size:38px;line-height:1;letter-spacing:1px;
    font-variant-numeric:tabular-nums;color:var(--led);text-shadow:0 0 10px rgba(255,74,58,.75),0 0 2px #FFF}
  .time .cs{font-size:19px;color:var(--yel);text-shadow:0 0 10px rgba(255,210,58,.7)}
  .time .dim{color:#3C201A;text-shadow:none}
  .row{display:flex;gap:8px;margin-top:10px}
  button{flex:1;height:38px;border:2.5px solid var(--ink);border-radius:11px;cursor:pointer;font-family:inherit;
    font-size:13.5px;font-weight:900;color:var(--ink);background:#FFF;box-shadow:3px 3px 0 var(--ink);transition:transform .08s,box-shadow .08s}
  button:active:not(:disabled){transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
  #b1{background:var(--yel)}#b1.on{background:var(--red);color:#FFF}#b2{background:#BFE3F5}
  button:disabled{opacity:.42;cursor:default;box-shadow:2px 2px 0 var(--ink)}
  button:focus-visible{outline:3px solid #2A76D2;outline-offset:2px}
  .lapline{height:22px;line-height:14px;margin-top:9px;padding-top:6px;border-top:2px dashed var(--ink);font-size:10.5px;font-weight:700;color:#5A3A22;
    font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:center}
  .lapline b{color:var(--ink)}.lapline em{font-style:normal;color:var(--red);margin-right:6px}

  @media (prefers-reduced-motion:reduce){.ball,.armR,.speed,.sfx{animation:none !important}}
</style>
</head>
<body>

  <div class="panel" aria-hidden="true">

        <!-- 공 -->
        <g class="ball">
          <circle cx="88" cy="14" r="14" fill="#F0782A" stroke-width="2.4"/>

        <!-- 귀 -->

        <!-- 얼굴: 긴 얼굴, 각진 턱 -->
        <path d="M84.2 44C83.4 58 84 71 86 78.6C88.6 86.4 94 92.4 100 94.4C106 92.4 111.4 86.4 114 78.6C116 71 116.6 58 115.8 44Z" fill="#F6D2B0" stroke-width="2.3"/>
        <g clip-path="url(#faceClip2)">
          <path d="M84 66C85 75 87.4 82 92 87.6L84 90Z" fill="url(#tone)" stroke="none" opacity=".35"/>
          <path d="M96.6 77.6Q100 80.4 103.6 77.6L103.4 79.4Q100 81.6 96.8 79.4Z" fill="url(#tone)" stroke="none" opacity=".8"/>
        </g>
        <path d="M110.6 74.6C110.2 78 108.8 81 107 83" stroke-width=".8" opacity=".7"/>
        <!-- 눈썹: 굵고 곧게 뻗다가 미간으로 내려앉는다 -->
        <path d="M85.4 59.8C89 57.8 94 58.2 98 61L97.4 62.8C93.6 60.8 89.4 60.6 86 61.8Z" fill="#2A1A10" stroke-width=".8"/>
        <path d="M114.6 59.8C111 57.8 106 58.2 102 61L102.6 62.8C106.4 60.8 110.6 60.6 114 61.8Z" fill="#2A1A10" stroke-width=".8"/>
        <!-- 눈: 가늘고 집중한 눈 -->
        <path d="M87.6 64.4Q92 63 96.4 64.6" stroke-width=".8" opacity=".7"/>
        <path d="M112.4 64.4Q108 63 103.6 64.6" stroke-width=".8" opacity=".7"/>
        <circle cx="92.6" cy="67.6" r="1.9" fill="#2A1A10" stroke="none"/><circle cx="107.4" cy="67.6" r="1.9" fill="#2A1A10" stroke="none"/>
        <circle cx="93.1" cy="67" r=".55" fill="#FFF" stroke="none"/><circle cx="107.9" cy="67" r=".55" fill="#FFF" stroke="none"/>
        <path d="M86.6 67Q91.6 64.6 97.2 66.4" stroke-width="2.3"/>
        <path d="M113.4 67Q108.4 64.6 102.8 66.4" stroke-width="2.3"/>
        <path d="M88.6 69.6Q92.4 70.4 96 69.4" stroke-width=".8"/><path d="M111.4 69.6Q107.6 70.4 104 69.4" stroke-width=".8"/>
        <!-- 코: 콧대와 콧망울 -->
        <path d="M101.4 63.6C101.8 67.6 102.4 71.4 103.4 74.6" stroke-width="1"/>
        <path d="M97 74.8Q95.8 76.6 97.8 77.2M103 74.8Q104.2 76.6 102.2 77.2" stroke-width="1.1"/>
        <path d="M98.4 77.4Q100 78.2 101.6 77.4" stroke-width="1.1"/>
        <path d="M101.8 66L103.8 74.6L102.4 74.6Z" fill="url(#tone)" stroke="none" opacity=".7"/>
        <!-- 입: 꽉 다문 입술 -->
        <path d="M94 83.6Q97 82.6 100 83.2Q103 82.6 106 83.6" stroke-width="1.5"/>

        <!-- 붉은 까까머리: 둥근 두상을 따라 짧게 깎은 머리 -->

        <path d="M81.4 64C78.6 46 86 31.6 100 31C114 31.6 121.4 46 118.6 64" stroke-width="2.2"/>

      </svg>
    </div>
  </div>

  <div class="board">
    <div class="led"><div class="time" id="t" role="timer"><span class="dim">00:</span>00:00<span class="cs">.00</span></div></div>
    <div class="row">
      <button id="b1" type="button">시작</button>
      <button id="b2" type="button" disabled>랩</button>
      <button id="b3" type="button" disabled>초기화</button>
    </div>
    <div class="lapline" id="lp"></div>
  </div>

<script>
(function(){
  var t=document.getElementById('t'),lp=document.getElementById('lp'),
      b1=document.getElementById('b1'),b2=document.getElementById('b2'),b3=document.getElementById('b3');
  var run=false,st=0,acc=0,iv=null,laps=0,last=0;

  function el(){return acc+(run?performance.now()-st:0);}
  function pad(n){return String(n).padStart(2,'0');}
  function parts(ms){return{h:Math.min(Math.floor(ms/3600000),99),m:Math.floor(ms/60000)%60,s:Math.floor(ms/1000)%60,cs:Math.floor(ms/10)%100};}
  function fmt(ms){var p=parts(ms);return (p.h?pad(p.h)+':':'')+pad(p.m)+':'+pad(p.s)+'.'+pad(p.cs);}
  function draw(){var p=parts(el());
    t.innerHTML='<span class="'+(p.h?'':'dim')+'">'+pad(p.h)+':</span>'+pad(p.m)+':'+pad(p.s)+'<span class="cs">.'+pad(p.cs)+'</span>';}

  var srSay=(function(){
    var r=document.createElement('div');
    r.setAttribute('role','status');r.setAttribute('aria-live','polite');
    r.style.cssText='position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0';
    document.body.appendChild(r);
    return function(m){r.textContent='';setTimeout(function(){r.textContent=m;},30);};
  })();

  function ui(){
    document.body.classList.toggle('go',run);
    b1.textContent=run?'정지':(acc>0?'재개':'시작');
    b1.classList.toggle('on',run);
    b2.disabled=!run;b3.disabled=run||el()===0;
    if(document.activeElement&&document.activeElement.disabled)b1.focus();
  }
  function go(){
    if(run){acc=el();run=false;clearInterval(iv);iv=null;draw();srSay('정지 '+fmt(acc));}
    else{st=performance.now();run=true;if(!iv)iv=setInterval(draw,31);}
    ui();
  }
  function lap(){
    if(!run)return;
    var e=el(),seg=e-last;last=e;laps++;
    lp.innerHTML='<em>LAP '+laps+'</em>구간 <b>'+fmt(seg)+'</b> &middot; 누적 <b>'+fmt(e)+'</b>';
  }
  function reset(){
    if(run)return;
    acc=0;st=0;laps=0;last=0;lp.textContent='';draw();ui();srSay('초기화했습니다');
  }

  b1.addEventListener('click',go);b2.addEventListener('click',lap);b3.addEventListener('click',reset);
  document.addEventListener('keydown',function(e){
    if(e.metaKey||e.ctrlKey||e.altKey||e.repeat)return;
    if(e.target&&e.target.tagName==='BUTTON'&&e.key===' ')return;
    if(e.key===' '){e.preventDefault();go();}
    else if(e.key==='l'||e.key==='L'){lap();}
    else if(e.key==='r'||e.key==='R'){reset();}
  });
  document.addEventListener('visibilitychange',function(){if(!document.hidden&&run)draw();});
  window.addEventListener('pageshow',function(){if(run&&!iv)iv=setInterval(draw,31);});
  window.addEventListener('pagehide',function(){clearInterval(iv);iv=null;});
  draw();ui();
})();
</script>
</body>
</html>
