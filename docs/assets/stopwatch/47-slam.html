<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>슬램 스탑워치</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='44' fill='%23F0782A' stroke='%232A1A10' stroke-width='6'/><path d='M50 6v88M6 50h88' stroke='%232A1A10' stroke-width='5'/></svg>" />
<style>
  @font-face{font-family:'Pretendard';src:url('../fonts/PretendardVariable.ttf') format('truetype');font-weight:100 900;font-display:swap;}
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overflow:hidden}
  :root{--org:#F5761E;--org-dk:#D9520E;--ink:#2A1A10;--paper:#FFF9EE;--red:#D42A1E;--yel:#FFD23A;--led:#FF4A3A;}
  body{font-family:'Pretendard',-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",sans-serif;color:var(--ink);
    position:relative;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding:8px 8px 8px;word-break:keep-all;
    background:var(--org)}
  /* 방사선 + 망점. 배경층을 따로 잘라 스크롤 영역을 늘리지 않는다 */
  .bg{position:absolute;inset:0;overflow:hidden;pointer-events:none}
  .rays{position:absolute;inset:-40%;
    background:repeating-conic-gradient(from 0deg at 50% 26%,rgba(255,255,255,.16) 0deg 9deg,transparent 9deg 18deg)}
  .dots{position:absolute;inset:0;opacity:.35;
    background:radial-gradient(circle,rgba(255,255,255,.55) 1px,transparent 1.4px) 0 0/9px 9px}

  .top{position:relative;text-align:center;margin-bottom:auto;padding-top:6px}
  h1{font-size:23px;font-weight:900;letter-spacing:.5px;line-height:1;color:#FFF;font-style:italic;
    text-shadow:2px 2px 0 var(--ink),-1px -1px 0 var(--ink),1px -1px 0 var(--ink),-1px 1px 0 var(--ink),4px 4px 0 rgba(42,26,16,.35)}
  .pill{display:inline-block;margin-top:7px;padding:4px 12px;border-radius:999px;background:var(--red);color:#FFF;
    font-size:10.5px;font-weight:800;border:2px solid var(--ink);box-shadow:2px 2px 0 var(--ink)}
  .quote{margin-top:6px;font-size:9.5px;font-weight:700;color:#4A2A14;letter-spacing:.2px}

  /* 선수와 공 */
  .stage{position:relative;width:150px;height:88px;margin:1px auto 0}
  .stage svg{position:absolute;bottom:0;left:0;width:100%;height:100%;overflow:visible}
  .ball{transform-origin:118px 16px}
  body.go .ball{animation:shoot 1.1s cubic-bezier(.35,0,.6,1) infinite alternate}
  @keyframes shoot{from{transform:translate(0,0) rotate(0)}to{transform:translate(16px,-4px) rotate(220deg)}}
  .arm{transform-origin:82px 39px}
  body.go .arm{animation:flick 1.1s ease-in-out infinite alternate}
  @keyframes flick{to{transform:rotate(9deg)}}

  /* 스코어보드 */
  .board{position:relative;width:min(304px,100%);padding:12px 12px 12px;border-radius:18px;background:var(--paper);
    border:3px solid var(--ink);box-shadow:5px 5px 0 var(--ink),0 16px 30px rgba(0,0,0,.25)}
  .led{padding:11px 10px 9px;border-radius:10px;background:#160E0A;border:3px solid #3A2A1E;
    box-shadow:inset 0 0 0 1px #5A4030,inset 0 6px 14px rgba(0,0,0,.7)}
  .time{text-align:center;font-family:"Courier New",Courier,monospace;font-weight:700;font-size:38px;line-height:1;letter-spacing:1px;
    font-variant-numeric:tabular-nums;color:var(--led);text-shadow:0 0 10px rgba(255,74,58,.75),0 0 2px #FFF}
  .time .cs{font-size:19px;color:var(--yel);text-shadow:0 0 10px rgba(255,210,58,.7)}
  .time .dim{color:#3C201A;text-shadow:none}
  .row{display:flex;gap:8px;margin-top:10px}
  button{flex:1;height:38px;border:2.5px solid var(--ink);border-radius:11px;cursor:pointer;font-family:inherit;
    font-size:13.5px;font-weight:900;color:var(--ink);background:#FFF;box-shadow:3px 3px 0 var(--ink);transition:transform .08s,box-shadow .08s}
  button:active:not(:disabled){transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
  #b1{background:var(--yel)}#b1.on{background:var(--red);color:#FFF}#b2{background:#BFE3F5}
  button:disabled{opacity:.42;cursor:default;box-shadow:2px 2px 0 var(--ink)}
  button:focus-visible{outline:3px solid #2A76D2;outline-offset:2px}
  .lapline{height:14px;margin-top:9px;padding-top:6px;border-top:2px dashed var(--ink);font-size:10.5px;font-weight:700;color:#5A3A22;
    font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:center}
  .lapline b{color:var(--ink)}.lapline em{font-style:normal;color:var(--red);margin-right:6px}

  @media (prefers-reduced-motion:reduce){.ball,.arm{animation:none !important}}
</style>
</head>
<body>
  <div class="bg" aria-hidden="true"><div class="rays"></div><div class="dots"></div></div>

  <div class="top">
    <h1>SLAM STOPWATCH</h1>
    <div class="pill">포기를 모르는 남자의 타이머</div>
    <div class="quote">"왼손은 거들 뿐" &middot; 슬램덩크</div>

    <div class="stage" aria-hidden="true">
      <!-- 강백호: 붉은 짧은 머리, 굵은 눈썹, 씩 웃는 입, 북산 10번, "왼손은 거들 뿐" 슛 자세 -->
      <svg viewBox="0 0 150 92">
        <ellipse cx="70" cy="89" rx="40" ry="3.6" fill="rgba(42,26,16,.28)"/>
        <!-- 다리·양말·신발 -->
        <path d="M61 70 L57 84" stroke="#2A1A10" stroke-width="8.5" stroke-linecap="round"/>
        <path d="M79 70 L83 84" stroke="#2A1A10" stroke-width="8.5" stroke-linecap="round"/>
        <path d="M61 70 L57 84" stroke="#F3C39A" stroke-width="5.6" stroke-linecap="round"/>
        <path d="M79 70 L83 84" stroke="#F3C39A" stroke-width="5.6" stroke-linecap="round"/>
        <path d="M58 80 L57 84 M82 80 L83 84" stroke="#FFF" stroke-width="5.6" stroke-linecap="round"/>
        <path d="M49 88 q4 -5 10 -3 l2 3 z" fill="#D42A1E" stroke="#2A1A10" stroke-width="1.8" stroke-linejoin="round"/>
        <path d="M91 88 q-4 -5 -10 -3 l-2 3 z" fill="#D42A1E" stroke="#2A1A10" stroke-width="1.8" stroke-linejoin="round"/>
        <path d="M50 87 h10 M80 87 h10" stroke="#FFF" stroke-width="1.6"/>
        <!-- 반바지 -->
        <path d="M55 60 h30 l2 12 h-13 l-4 -5 l-4 5 h-13 z" fill="#D42A1E" stroke="#2A1A10" stroke-width="2.2" stroke-linejoin="round"/>
        <path d="M56 62 l1 9 M84 62 l-1 9" stroke="#FFF" stroke-width="1.4"/>
        <!-- 유니폼 -->
        <path d="M56 36 l6 -3 h16 l6 3 v26 h-28 z" fill="#D42A1E" stroke="#2A1A10" stroke-width="2.2" stroke-linejoin="round"/>
        <path d="M57 37 v24 M83 37 v24" stroke="#FFF" stroke-width="1.5"/>
        <path d="M62 34 q8 5 16 0" fill="none" stroke="#FFF" stroke-width="1.5"/>
        <text x="70" y="44.5" font-family="Pretendard,Arial,sans-serif" font-size="4.6" font-weight="900" letter-spacing=".3" text-anchor="middle" fill="#FFF">SHOHOKU</text>
        <text x="70" y="58" font-family="Pretendard,Arial,sans-serif" font-size="12.5" font-weight="900" text-anchor="middle" fill="#FFF">10</text>
        <!-- 왼팔: 거드는 손 -->
        <path d="M58 39 L46 30 L44 22" fill="none" stroke="#2A1A10" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M58 39 L46 30 L44 22" fill="none" stroke="#F3C39A" stroke-width="4.4" stroke-linecap="round" stroke-linejoin="round"/>
        <circle cx="44" cy="20" r="3.3" fill="#F3C39A" stroke="#2A1A10" stroke-width="1.5"/>
        <!-- 오른팔: 슛 팔로스루 -->
        <g class="arm">
          <path d="M82 39 L92 24 L100 18" fill="none" stroke="#2A1A10" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M82 39 L92 24 L100 18" fill="none" stroke="#F3C39A" stroke-width="4.4" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M100 18 l4 -4 M100 18 l5 -1 M100 18 l4 2" stroke="#F3C39A" stroke-width="2.6" stroke-linecap="round"/>
          <path d="M100 18 l4 -4 M100 18 l5 -1 M100 18 l4 2" stroke="#2A1A10" stroke-width="4" stroke-linecap="round" opacity="0" />
        </g>
        <!-- 목 -->
        <path d="M70 30 v5" stroke="#F3C39A" stroke-width="7"/>
        <!-- 얼굴 -->
        <path d="M57 18 v6 q0 9 13 9 q13 0 13 -9 v-6 z" fill="#F3C39A" stroke="#2A1A10" stroke-width="2.2" stroke-linejoin="round"/>
        <!-- 붉은 짧은 머리: 위로 짧게 세운 크루컷, 앞머리가 살짝 앞으로 기운다 -->
        <path d="M56 20 v-7 q0 -9 13 -9.5 q15 -.5 16 9 v7.5 q-14.5 -3.5 -29 0 z" fill="#D8341E" stroke="#2A1A10" stroke-width="2.2" stroke-linejoin="round"/>
        <path d="M60 6.5 q5 -3 11 -2 M73 4.6 q6 .4 9 3.4" fill="none" stroke="#2A1A10" stroke-width="1.2" stroke-linecap="round" opacity=".55"/>
        <path d="M63 12.5 q3.5 -1.6 7 0 M74 12.5 q3 -1.4 6 0" fill="none" stroke="#A8220F" stroke-width="1.4" stroke-linecap="round"/>
        <path d="M56 20 v5.5 h2.4 v-5 z M84 20 v5.5 h-2.4 v-5 z" fill="#D8341E" stroke="#2A1A10" stroke-width="1.5" stroke-linejoin="round"/>
        <!-- 굵은 눈썹(안쪽이 내려간 매서운 눈) -->
        <path d="M60 21 L67 23.5" stroke="#2A1A10" stroke-width="2.6" stroke-linecap="round"/>
        <path d="M80 21 L73 23.5" stroke="#2A1A10" stroke-width="2.6" stroke-linecap="round"/>
        <circle cx="64.5" cy="26" r="1.9" fill="#2A1A10"/><circle cx="75.5" cy="26" r="1.9" fill="#2A1A10"/>
        <circle cx="65.2" cy="25.3" r=".6" fill="#FFF"/><circle cx="76.2" cy="25.3" r=".6" fill="#FFF"/>
        <path d="M70 27 l-1 3 h2" fill="none" stroke="#2A1A10" stroke-width="1" stroke-linecap="round"/>
        <!-- 씩 웃는 입 -->
        <path d="M62.5 30.5 q7.5 7 15 0 q-7.5 2.6 -15 0 z" fill="#FFF" stroke="#2A1A10" stroke-width="1.5" stroke-linejoin="round"/>
        <!-- 농구공: 슛 궤적 -->
        <g class="ball">
          <circle cx="118" cy="16" r="11" fill="#F0782A" stroke="#2A1A10" stroke-width="2.2"/>
          <path d="M107 16 h22 M118 5 v22 M110.2 8.2 q7.8 7.8 0 15.6 M125.8 8.2 q-7.8 7.8 0 15.6" stroke="#2A1A10" stroke-width="1.5" fill="none"/>
        </g>
      </svg>
    </div>
  </div>

  <div class="board">
    <div class="led"><div class="time" id="t" role="timer"><span class="dim">00:</span>00:00<span class="cs">.00</span></div></div>
    <div class="row">
      <button id="b1" type="button">시작</button>
      <button id="b2" type="button" disabled>랩</button>
      <button id="b3" type="button" disabled>초기화</button>
    </div>
    <div class="lapline" id="lp"></div>
  </div>

<script>
(function(){
  var t=document.getElementById('t'),lp=document.getElementById('lp'),
      b1=document.getElementById('b1'),b2=document.getElementById('b2'),b3=document.getElementById('b3');
  var run=false,st=0,acc=0,iv=null,laps=0,last=0;

  function el(){return acc+(run?performance.now()-st:0);}
  function pad(n){return String(n).padStart(2,'0');}
  function parts(ms){return{h:Math.min(Math.floor(ms/3600000),99),m:Math.floor(ms/60000)%60,s:Math.floor(ms/1000)%60,cs:Math.floor(ms/10)%100};}
  function fmt(ms){var p=parts(ms);return (p.h?pad(p.h)+':':'')+pad(p.m)+':'+pad(p.s)+'.'+pad(p.cs);}
  function draw(){var p=parts(el());
    t.innerHTML='<span class="'+(p.h?'':'dim')+'">'+pad(p.h)+':</span>'+pad(p.m)+':'+pad(p.s)+'<span class="cs">.'+pad(p.cs)+'</span>';}

  var srSay=(function(){
    var r=document.createElement('div');
    r.setAttribute('role','status');r.setAttribute('aria-live','polite');
    r.style.cssText='position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0';
    document.body.appendChild(r);
    return function(m){r.textContent='';setTimeout(function(){r.textContent=m;},30);};
  })();

  function ui(){
    document.body.classList.toggle('go',run);
    b1.textContent=run?'정지':(acc>0?'재개':'시작');
    b1.classList.toggle('on',run);
    b2.disabled=!run;b3.disabled=run||el()===0;
    if(document.activeElement&&document.activeElement.disabled)b1.focus();
  }
  function go(){
    if(run){acc=el();run=false;clearInterval(iv);iv=null;draw();srSay('정지 '+fmt(acc));}
    else{st=performance.now();run=true;if(!iv)iv=setInterval(draw,31);}
    ui();
  }
  function lap(){
    if(!run)return;
    var e=el(),seg=e-last;last=e;laps++;
    lp.innerHTML='<em>LAP '+laps+'</em>구간 <b>'+fmt(seg)+'</b> &middot; 누적 <b>'+fmt(e)+'</b>';
  }
  function reset(){
    if(run)return;
    acc=0;st=0;laps=0;last=0;lp.textContent='';draw();ui();srSay('초기화했습니다');
  }

  b1.addEventListener('click',go);b2.addEventListener('click',lap);b3.addEventListener('click',reset);
  document.addEventListener('keydown',function(e){
    if(e.metaKey||e.ctrlKey||e.altKey||e.repeat)return;
    if(e.target&&e.target.tagName==='BUTTON'&&e.key===' ')return;
    if(e.key===' '){e.preventDefault();go();}
    else if(e.key==='l'||e.key==='L'){lap();}
    else if(e.key==='r'||e.key==='R'){reset();}
  });
  document.addEventListener('visibilitychange',function(){if(!document.hidden&&run)draw();});
  window.addEventListener('pageshow',function(){if(run&&!iv)iv=setInterval(draw,31);});
  window.addEventListener('pagehide',function(){clearInterval(iv);iv=null;});
  draw();ui();
})();
</script>
</body>
</html>
