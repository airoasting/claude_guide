<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>블랙홀 스탑워치</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌀</text></svg>" />
<style>
  @font-face{font-family:'Pretendard';src:url('../fonts/PretendardVariable.ttf') format('truetype');font-weight:100 900;font-style:normal;font-display:swap;}
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overflow:hidden}
  body{font-family:'Pretendard',-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
    color:#F3ECE6;overflow:hidden;position:relative;
    display:flex;flex-direction:column;align-items:center;justify-content:center;padding:14px;
    background:radial-gradient(125% 95% at 50% 46%,#1D1519 0%,#0C0A0E 54%,#040305 100%)}

  /* ── 별 ── */
  .stars{position:absolute;inset:0;pointer-events:none;
    background-image:
      radial-gradient(1.5px 1.5px at 9% 16%,rgba(255,255,255,.72),transparent),
      radial-gradient(1.2px 1.2px at 24% 8%,rgba(255,235,215,.55),transparent),
      radial-gradient(1.6px 1.6px at 82% 12%,rgba(255,255,255,.62),transparent),
      radial-gradient(1.1px 1.1px at 93% 34%,rgba(230,220,255,.5),transparent),
      radial-gradient(1.4px 1.4px at 6% 62%,rgba(255,255,255,.5),transparent),
      radial-gradient(1.2px 1.2px at 17% 88%,rgba(255,240,220,.45),transparent),
      radial-gradient(1.5px 1.5px at 71% 92%,rgba(255,255,255,.55),transparent),
      radial-gradient(1.1px 1.1px at 95% 76%,rgba(220,215,255,.42),transparent),
      radial-gradient(1.3px 1.3px at 45% 5%,rgba(255,255,255,.4),transparent),
      radial-gradient(1.2px 1.2px at 57% 96%,rgba(255,235,215,.38),transparent);
    animation:twinkle 5.5s ease-in-out infinite}
  @keyframes twinkle{50%{opacity:.55}}

  /* ── 강착원반 ── */
  .void{position:relative;width:208px;height:208px;display:grid;place-items:center;flex-shrink:0}
  .void::before{content:'';position:absolute;inset:-46px;border-radius:50%;pointer-events:none;
    background:radial-gradient(circle,rgba(255,158,96,.22) 26%,rgba(150,86,214,.13) 52%,transparent 72%);
    filter:blur(9px);transition:opacity .5s}
  .disk{position:absolute;inset:0;border-radius:50%;
    background:conic-gradient(from 178deg,
      #FFE2B4 0%,#FFAE6E 10%,#F5735E 22%,#E2568D 34%,
      #A749C9 46%,#5B3FD3 56%,#4433B4 62%,#8747CC 72%,
      #D75282 82%,#FF8F5C 92%,#FFE2B4 100%);
    filter:blur(6px) saturate(1.16) brightness(1.04);
    animation:spin 30s linear infinite}
  /* 역방향으로 도는 층 (원반이 서로 스치며 휘도는 느낌) */
  .disk.sharp{filter:blur(1.6px) saturate(1.3);opacity:.5;inset:11px;animation:spinR 21s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  @keyframes spinR{to{transform:rotate(-360deg)}}

  /* 태양 플레어: 혓바닥처럼 뻗는 빛이 돌면서 부풀었다 꺼진다 */
  .flare{position:absolute;inset:-24px;pointer-events:none;animation:spinR 17s linear infinite}
  .flare i{position:absolute;inset:0;border-radius:50%;display:block;
    background:conic-gradient(from 0deg,
      rgba(255,190,120,0) 0deg,rgba(255,178,104,.62) 16deg,rgba(255,120,90,0) 42deg,
      rgba(255,150,90,0) 84deg,rgba(255,132,78,.55) 106deg,rgba(226,86,141,0) 134deg,
      rgba(190,110,240,0) 178deg,rgba(178,104,246,.5) 202deg,rgba(110,80,230,0) 232deg,
      rgba(255,160,110,0) 286deg,rgba(255,196,130,.58) 310deg,rgba(255,140,90,0) 338deg,
      rgba(255,190,120,0) 360deg);
    filter:blur(15px);animation:breathe 3.6s ease-in-out infinite}
  @keyframes breathe{0%,100%{transform:scale(1);opacity:.62}50%{transform:scale(1.09);opacity:.95}}

  /* 코로나: 바깥으로 밀려나갔다 되돌아온다 */
  .corona{position:absolute;inset:-40px;border-radius:50%;pointer-events:none;
    background:radial-gradient(circle,rgba(255,164,100,.30) 34%,rgba(158,92,222,.16) 56%,transparent 74%);
    filter:blur(12px);animation:surge 5.2s ease-in-out infinite}
  @keyframes surge{0%,100%{transform:scale(.96);opacity:.55}50%{transform:scale(1.12);opacity:.95}}

  /* ── 랩 순간의 태양 폭발 ── */
  .blast{position:absolute;inset:-64px;border-radius:50%;pointer-events:none;opacity:0;z-index:2;
    background:radial-gradient(circle,rgba(255,246,214,.98) 0%,rgba(255,186,104,.82) 20%,
      rgba(246,110,150,.42) 42%,rgba(150,86,220,.18) 60%,transparent 74%)}
  body.blast-on .blast{animation:blast .9s cubic-bezier(.16,.72,.28,1) 1}
  @keyframes blast{
    0%{opacity:0;transform:scale(.3)}
    10%{opacity:1;transform:scale(.66)}
    100%{opacity:0;transform:scale(1.55)}
  }
  .shock{position:absolute;inset:-14px;border-radius:50%;pointer-events:none;opacity:0;z-index:2;
    border:3px solid rgba(255,226,170,.95);box-shadow:0 0 18px rgba(255,190,120,.7)}
  body.blast-on .shock{animation:shock .9s cubic-bezier(.1,.82,.28,1) 1}
  @keyframes shock{
    0%{opacity:.95;transform:scale(.46);border-width:4px}
    100%{opacity:0;transform:scale(2);border-width:.5px}
  }
  /* 폭발 순간 원반이 확 부풀고 코어가 번쩍인다 */
  body.blast-on .disk{filter:blur(6px) saturate(1.9) brightness(1.5)}
  body.blast-on .flare i{opacity:1;filter:blur(11px) brightness(1.5)}
  .disk,.flare i{transition:filter .5s ease,opacity .5s ease}

  /* ── 사건의 지평선 ── */
  .core{position:relative;z-index:3;width:138px;height:138px;border-radius:50%;
    background:radial-gradient(circle at 50% 44%,#221D26 0%,#131117 58%,#08070A 100%);
    box-shadow:0 0 0 1px rgba(255,196,150,.20),inset 0 0 30px rgba(0,0,0,.92),0 0 34px 6px rgba(0,0,0,.8);
    transition:box-shadow .5s ease;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px}
  body.blast-on .core{box-shadow:0 0 0 2px rgba(255,232,180,.95),inset 0 0 30px rgba(0,0,0,.85),0 0 54px 16px rgba(255,178,104,.55)}
  .time{font-size:19px;font-weight:700;letter-spacing:.2px;white-space:nowrap;
    font-variant-numeric:tabular-nums;color:#FFFFFF;text-shadow:0 0 14px rgba(255,190,150,.35)}
  .time .cs{font-size:11.5px;font-weight:600;color:#B9A6D8}

  /* ── 조작부 ── */
  .row{display:flex;gap:9px;margin-top:20px;position:relative;z-index:3}
  button{font-family:inherit;font-size:12.5px;font-weight:700;cursor:pointer;color:#EFE6DE;
    padding:10px 0;width:73px;border-radius:22px;border:1px solid transparent;background:transparent;transition:all .18s}
  button:disabled{opacity:.6;cursor:default}
  button:focus-visible{outline:2px solid #FFC08A;outline-offset:3px}
  #b1{background:linear-gradient(150deg,#FFD3A8,#F1996A);color:#33190A;box-shadow:0 4px 18px rgba(240,150,100,.38)}
  #b1:hover{box-shadow:0 4px 24px rgba(255,175,120,.55);transform:translateY(-1px)}
  #b2,#b3{border-color:rgba(255,228,212,.24);background:rgba(255,255,255,.035)}
  #b2:hover:not(:disabled),#b3:hover:not(:disabled){background:rgba(255,255,255,.11);border-color:rgba(255,228,212,.42)}
  .laps{margin-top:12px;min-height:16px;font-size:11.5px;font-weight:600;letter-spacing:.4px;
    color:rgba(214,204,226,.72);font-variant-numeric:tabular-nums;position:relative;z-index:3;text-align:center}

  /* ── 작동 중: 전부 가속하고 폭발이 잦아진다 ── */
  body.go .disk{animation-duration:8s}
  body.go .disk.sharp{animation-duration:5.4s;opacity:.68}
  body.go .flare{animation-duration:4.6s}
  body.go .flare i{animation-duration:1.5s}
  body.go .corona{animation-duration:2.1s}
  body.go .void::before{opacity:1;animation:bloom 2.6s ease-in-out infinite}
  @keyframes bloom{50%{opacity:.62}}

  @media (prefers-reduced-motion: reduce){
    .stars,.disk,.flare,.flare i,.corona,.void::before,.blast,.shock{animation:none !important}
  }
</style>
</head>
<body>
  <div class="stars" aria-hidden="true"></div>

  <div class="void">
    <div class="corona" aria-hidden="true"></div>
    <div class="blast" aria-hidden="true"></div>
    <div class="shock" aria-hidden="true"></div>
    <div class="flare" aria-hidden="true"><i></i></div>
    <div class="disk" aria-hidden="true"></div>
    <div class="disk sharp" aria-hidden="true"></div>
    <div class="core">
      <div class="time" id="t" role="timer">00:00:00<span class="cs">.00</span></div>
    </div>
  </div>

  <div class="row">
    <button id="b1" type="button">시작</button>
    <button id="b2" type="button" disabled>랩</button>
    <button id="b3" type="button" disabled>리셋</button>
  </div>
  <div class="laps" id="lp" aria-live="polite"></div>

<script>
(function(){
  var t=document.getElementById('t'),b1=document.getElementById('b1'),b2=document.getElementById('b2'),
      b3=document.getElementById('b3'),lp=document.getElementById('lp');
  var run=false,st=0,acc=0,iv=null,laps=[],last=0,blastT=null;
  function el(){return acc+(run?performance.now()-st:0);}
  function pad(n,w){return String(n).padStart(w,'0');}
  function f(ms){if(ms<0)ms=0;var cs=Math.floor(ms/10)%100,s=Math.floor(ms/1000),ss=s%60,m=Math.floor(s/60),mm=m%60,hh=Math.floor(m/60);
    if(hh>99)hh=99;
    return pad(hh,2)+':'+pad(mm,2)+':'+pad(ss,2)+'<span class="cs">.'+pad(cs,2)+'</span>';}
  function plain(ms){if(ms<0)ms=0;var cs=Math.floor(ms/10)%100,s=Math.floor(ms/1000),ss=s%60,mm=Math.floor(s/60);
    return pad(mm,2)+':'+pad(ss,2)+'.'+pad(cs,2);}
  function draw(){t.innerHTML=f(el());}
  function ui(){
    document.body.classList.toggle('go',run);
    b1.textContent=run?'정지':(el()>0?'재개':'시작');
    b2.disabled=!run; b3.disabled=run||el()===0;
  }
  function start(){if(run)return;run=true;st=performance.now();if(!iv)iv=setInterval(draw,31);draw();ui();}
  function stop(){if(!run)return;acc=el();run=false;clearInterval(iv);iv=null;draw();ui();}
  function reset(){if(run)return;run=false;clearInterval(iv);iv=null;acc=0;st=0;laps=[];last=0;lp.textContent='';draw();ui();}
  function lap(){if(!run)return;var e=el(),sp=e-last;last=e;laps.push(sp);
    var best=Math.min.apply(null,laps);
    lp.textContent='LAP '+laps.length+'  +'+plain(sp)+(laps.length>1&&sp===best?'  ★ 최단':'');
    /* 랩을 찍으면 원반이 한 번 폭발한다 */
    document.body.classList.remove('blast-on');
    void document.body.offsetWidth;
    document.body.classList.add('blast-on');
    clearTimeout(blastT);
    blastT=setTimeout(function(){document.body.classList.remove('blast-on');},900);}
  b1.addEventListener('click',function(){run?stop():start();});
  b2.addEventListener('click',lap);
  b3.addEventListener('click',reset);
  document.addEventListener('keydown',function(e){
    if(e.target&&e.target.tagName==='BUTTON'&&e.key===' ')return;
    if(e.key===' '){e.preventDefault();run?stop():start();}
    else if(e.key==='l'||e.key==='L'){lap();}
    else if(e.key==='r'||e.key==='R'){reset();}
  });
  document.addEventListener('visibilitychange',function(){if(!document.hidden&&run)draw();});
  window.addEventListener('pageshow',function(){if(run&&!iv)iv=setInterval(draw,31);});
  window.addEventListener('pagehide',function(){clearInterval(iv);iv=null;clearTimeout(blastT);});
  draw();ui();
})();
</script>
</body>
</html>
