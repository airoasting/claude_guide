<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>그로구 크로노미터</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🟢</text></svg>" />
<style>
  @font-face{font-family:'Pretendard';src:url('../fonts/PretendardVariable.ttf') format('truetype');font-weight:100 900;font-style:normal;font-display:swap;}
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{font-family:'Pretendard',-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
    color:#BDF3C8;overflow:hidden;position:relative;
    display:flex;align-items:center;justify-content:center;padding:12px;
    background:radial-gradient(120% 90% at 50% 62%,#12261B 0%,#0A140F 55%,#050908 100%)}

  /* ── 홀로그램 프로젝터 빛기둥 ── */
  .beam{position:absolute;left:50%;bottom:0;width:236px;height:80%;transform:translateX(-50%);pointer-events:none;
    background:linear-gradient(to top,rgba(94,224,138,.17),rgba(94,224,138,.04) 46%,transparent 78%);
    clip-path:polygon(37% 0,63% 0,100% 100%,0 100%);opacity:.85}

  /* ── 홀로그램 패널 ── */
  .panel{position:relative;z-index:2;width:100%;max-width:254px;padding:14px 16px 13px;
    border-radius:16px;border:1px solid rgba(122,236,160,.55);
    background:linear-gradient(165deg,rgba(30,72,48,.30),rgba(12,28,20,.34));
    -webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);
    box-shadow:0 0 22px rgba(80,220,130,.20),inset 0 0 26px rgba(90,230,140,.09);
    display:flex;flex-direction:column;align-items:center;gap:6px;
    animation:holo 6s ease-in-out infinite}
  @keyframes holo{0%,100%{opacity:1}47%{opacity:.93}49%{opacity:.99}}
  .panel::after{content:'';position:absolute;inset:0;border-radius:16px;pointer-events:none;
    background:repeating-linear-gradient(180deg,rgba(150,255,190,.07) 0 1px,transparent 1px 3px);
    mix-blend-mode:screen}

  /* ── 그로구 ── */
  .grogu{width:108px;height:92px;display:block;filter:drop-shadow(0 0 10px rgba(120,240,165,.5));
    animation:float 4.4s ease-in-out infinite}
  @keyframes float{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-4px) rotate(-2deg)}}
  body.go .grogu{animation-duration:2.2s}
  .eyes{transform-box:view-box;transform-origin:75px 48px;animation:blink 5.2s ease-in-out infinite}
  @keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.08)}97.5%{transform:scaleY(1)}}


  .time{font-size:27px;font-weight:800;letter-spacing:.6px;white-space:nowrap;margin-top:1px;
    font-variant-numeric:tabular-nums;color:#8CF7AE;
    text-shadow:0 0 10px rgba(110,245,155,.65),0 0 24px rgba(80,220,130,.35)}
  .time .cs{font-size:16px;font-weight:700;color:rgba(140,247,174,.62)}

  .row{display:flex;gap:7px;margin-top:4px}
  button{font-family:inherit;font-size:11.5px;font-weight:800;line-height:1;white-space:nowrap;cursor:pointer;
    padding:10px 11px;border-radius:9px;transition:all .17s;color:#DFFBE7;
    border:1px solid rgba(140,240,175,.45);background:rgba(120,235,165,.07)}
  button:disabled{opacity:.6;cursor:default}
  button:focus-visible{outline:2px solid #FFE81F;outline-offset:2px}
  #b1{background:linear-gradient(160deg,#8DEDAE,#4FC97C);border-color:transparent;color:#0A2013;
    box-shadow:0 0 16px rgba(105,225,145,.42)}
  #b1:hover{box-shadow:0 0 22px rgba(130,245,170,.6);transform:translateY(-1px)}
  #b2:hover:not(:disabled),#b3:hover:not(:disabled){background:rgba(140,240,175,.18)}

  .laps{min-height:15px;margin-top:3px;font-size:11px;font-weight:600;letter-spacing:.3px;
    color:rgba(180,240,200,.72);font-variant-numeric:tabular-nums}
  .quote{margin-top:4px;font-size:13px;font-style:italic;letter-spacing:.2px;text-align:center;
    color:rgba(196,242,212,.8);line-height:1.5}

  body.go .panel{border-color:rgba(150,255,190,.8);box-shadow:0 0 30px rgba(90,235,140,.34),inset 0 0 30px rgba(90,230,140,.14)}
  body.go .beam{animation:beamPulse 2.2s ease-in-out infinite}
  @keyframes beamPulse{50%{opacity:.55}}

  @media (prefers-reduced-motion: reduce){.panel,.beam,.grogu,.eyes{animation:none !important}}
</style>
</head>
<body>
  <div class="beam" aria-hidden="true"></div>

  <div class="panel">
    <svg class="grogu" viewBox="0 0 150 128" aria-hidden="true">
      <defs>
        <radialGradient id="skin" cx=".4" cy=".28" r=".8">
          <stop offset="0" stop-color="#DCEEC0"/><stop offset=".5" stop-color="#B4D68E"/><stop offset="1" stop-color="#8BB468"/>
        </radialGradient>
        <linearGradient id="earL" x1="1" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#C6E0A4"/><stop offset="1" stop-color="#93BC70"/>
        </linearGradient>
        <linearGradient id="earR" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#C6E0A4"/><stop offset="1" stop-color="#93BC70"/>
        </linearGradient>
        <linearGradient id="fleece" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#F3ECD6"/><stop offset="1" stop-color="#CDC2A2"/>
        </linearGradient>
        <linearGradient id="robe" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#CCBF9A"/><stop offset="1" stop-color="#9E926F"/>
        </linearGradient>
      </defs>

      <!-- 통통한 귀 -->
      <path d="M50 44 C39 33 23 27 10 31 C4 34 6 45 16 53 C28 62 44 62 53 55 Z" fill="url(#earL)"/>
      <path d="M100 44 C111 33 127 27 140 31 C146 34 144 45 134 53 C122 62 106 62 97 55 Z" fill="url(#earR)"/>
      <path d="M49 46 C40 38 28 33 18 35 C15 38 20 45 27 50 C35 56 45 56 51 52 Z" fill="rgba(122,160,96,.38)"/>
      <path d="M101 46 C110 38 122 33 132 35 C135 38 130 45 123 50 C115 56 105 56 99 52 Z" fill="rgba(122,160,96,.38)"/>

      <!-- 크고 동그란 머리 -->
      <path d="M75 10 C96 10 110 25 110 46 C110 66 96 80 75 80 C54 80 40 66 40 46 C40 25 54 10 75 10 Z" fill="url(#skin)"/>

      <!-- 볼터치 -->
      <ellipse cx="48" cy="60" rx="8" ry="5.4" fill="rgba(240,150,150,.36)"/>
      <ellipse cx="102" cy="60" rx="8" ry="5.4" fill="rgba(240,150,150,.36)"/>

      <!-- 반짝이는 큰 눈 (가끔 깜빡인다) -->
      <g class="eyes">
        <ellipse cx="59" cy="48" rx="12" ry="13.4" fill="#221C16"/>
        <ellipse cx="91" cy="48" rx="12" ry="13.4" fill="#221C16"/>
        <ellipse cx="54.6" cy="42.4" rx="4.2" ry="4.8" fill="rgba(255,255,255,.95)"/>
        <ellipse cx="86.6" cy="42.4" rx="4.2" ry="4.8" fill="rgba(255,255,255,.95)"/>
        <circle cx="63.6" cy="54.4" r="2.1" fill="rgba(255,255,255,.42)"/>
        <circle cx="95.6" cy="54.4" r="2.1" fill="rgba(255,255,255,.42)"/>
      </g>

      <!-- 작은 코 · 방긋 웃는 입 -->
      <path d="M75 61 q1.8 1.8 0 3.2" stroke="rgba(96,132,72,.5)" stroke-width="1.6" fill="none" stroke-linecap="round"/>
      <path d="M69 69 q6 4.6 12 0" stroke="rgba(90,126,68,.62)" stroke-width="2" fill="none" stroke-linecap="round"/>

      <!-- 작고 통통한 몸 -->
      <path d="M75 96 C60 96 48 104 44 128 L106 128 C102 104 90 96 75 96 Z" fill="url(#robe)"/>
      <path d="M75 100 L75 128" stroke="rgba(120,110,82,.35)" stroke-width="1.4"/>
      <!-- 짧은 팔 -->
      <ellipse cx="42" cy="118" rx="11" ry="9.5" fill="url(#fleece)"/>
      <ellipse cx="108" cy="118" rx="11" ry="9.5" fill="url(#fleece)"/>
      <!-- 폭신한 양털 카라 -->
      <path d="M50 79 C57 94 93 94 100 79 C113 84 117 102 107 108 C91 116 59 116 43 108 C33 102 37 84 50 79 Z" fill="url(#fleece)"/>
      <path d="M64 82 q11 5 22 0" stroke="rgba(162,150,120,.35)" stroke-width="1.6" fill="none" stroke-linecap="round"/>
    </svg>

    <div class="time" id="t" role="timer">00:00:00<span class="cs">.00</span></div>

    <div class="row">
      <button id="b1" type="button">시작하라</button>
      <button id="b2" type="button" disabled>기록하라</button>
      <button id="b3" type="button" disabled>비우라</button>
    </div>

    <div class="laps" id="lp" aria-live="polite"></div>
    <div class="quote">"This is the Way."</div>
  </div>

<script>
(function(){
  var t=document.getElementById('t'),b1=document.getElementById('b1'),b2=document.getElementById('b2'),
      b3=document.getElementById('b3'),lp=document.getElementById('lp');
  var run=false,st=0,acc=0,iv=null,laps=[],last=0;
  function el(){return acc+(run?performance.now()-st:0);}
  function pad(n,w){return String(n).padStart(w,'0');}
  function f(ms){if(ms<0)ms=0;var cs=Math.floor(ms/10)%100,s=Math.floor(ms/1000),ss=s%60,m=Math.floor(s/60),mm=m%60,hh=Math.floor(m/60);
    if(hh>99)hh=99;
    return pad(hh,2)+':'+pad(mm,2)+':'+pad(ss,2)+'<span class="cs">.'+pad(cs,2)+'</span>';}
  function plain(ms){if(ms<0)ms=0;var cs=Math.floor(ms/10)%100,s=Math.floor(ms/1000),ss=s%60,mm=Math.floor(s/60);
    return pad(mm,2)+':'+pad(ss,2)+'.'+pad(cs,2);}
  function draw(){t.innerHTML=f(el());}

  /* ── 접근성 공통 ──
     정지·초기화 결과를 스크린리더에 한 번씩 알린다. 시간 표시 자체는
     10ms마다 바뀌므로 라이브 리전으로 두지 않는다. */
  var srSay=(function(){
    var r=document.createElement('div');
    r.setAttribute('role','status'); r.setAttribute('aria-live','polite');
    r.style.cssText='position:absolute;width:1px;height:1px;margin:-1px;padding:0;'+
      'overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0';
    document.body.appendChild(r);
    return function(m){ r.textContent=''; setTimeout(function(){ r.textContent=m; },30); };
  })();
  function srHuman(ms){
    if(ms<0)ms=0;
    var cs=Math.floor(ms/10)%100, s=Math.floor(ms/1000), ss=s%60, mm=Math.floor(s/60);
    return (mm?mm+'분 ':'')+ss+'점'+String(cs).padStart(2,'0')+'초';
  }
  var srWasRun=false, srLast=0;
  function ui(){
    document.body.classList.toggle('go',run);
    b1.textContent=run?'멈추어라':(el()>0?'이어가라':'시작하라');
    b2.disabled=!run; b3.disabled=run||el()===0;
  
    /* 정지와 초기화를 알리고, 방금 누른 버튼이 잠기면 포커스를 되돌린다 */
    var srE=el();
    if(srWasRun&&!run) srSay('정지. 경과 시간 '+srHuman(srE));
    else if(!srWasRun&&!run&&srLast>0&&srE===0) srSay('초기화했습니다');
    srWasRun=run; srLast=srE;
    if(document.activeElement&&document.activeElement.disabled) b1.focus();
  }
  function start(){if(run)return;run=true;st=performance.now();if(!iv)iv=setInterval(draw,31);draw();ui();}
  function stop(){if(!run)return;acc=el();run=false;clearInterval(iv);iv=null;draw();ui();}
  function reset(){if(run)return;acc=0;st=0;laps=[];last=0;lp.textContent='';draw();ui();}
  function lap(){if(!run)return;var e=el(),sp=e-last;last=e;laps.push(sp);
    var best=Math.min.apply(null,laps);
    lp.textContent='기록 '+laps.length+'  +'+plain(sp)+(laps.length>1&&sp===best?'  ★':'');}
  b1.addEventListener('click',function(){run?stop():start();});
  b2.addEventListener('click',lap);
  b3.addEventListener('click',reset);
  document.addEventListener('keydown',function(e){
    if(e.metaKey||e.ctrlKey||e.altKey||e.repeat)return;
    if(e.target&&e.target.tagName==='BUTTON'&&e.key===' ')return;
    if(e.key===' '){e.preventDefault();run?stop():start();}
    else if(e.key==='l'||e.key==='L'){lap();}
    else if(e.key==='r'||e.key==='R'){reset();}
  });
  document.addEventListener('visibilitychange',function(){if(!document.hidden&&run)draw();});
  window.addEventListener('pageshow',function(){if(run&&!iv)iv=setInterval(draw,31);});
  window.addEventListener('pagehide',function(){clearInterval(iv);iv=null;});
  draw();ui();
})();
</script>
</body>
</html>
