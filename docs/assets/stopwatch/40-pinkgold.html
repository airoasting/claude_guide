<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>스켈레톤 와치 스탑워치</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='46' fill='%23C98F63'/><circle cx='50' cy='50' r='36' fill='%23F4F1EA'/><circle cx='50' cy='50' r='26' fill='%23CFCAC0'/><circle cx='50' cy='50' r='4' fill='%23B07B4E'/></svg>" />
<style>
  @font-face{font-family:'Pretendard';src:url('../fonts/PretendardVariable.ttf') format('truetype');font-weight:100 900;font-style:normal;font-display:swap;}
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overflow:hidden}
  body{font-family:'Pretendard',-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",sans-serif;
    word-break:keep-all;display:flex;align-items:center;justify-content:center;
    background:radial-gradient(115% 90% at 50% 36%,#2A211A 0%,#160F0B 58%,#0A0705 100%)}

  /* 무대: viewBox 300x344 비율을 지키며 iframe 크기에 맞춰 줄고 는다 */
  .stage{position:relative;flex-shrink:0;aspect-ratio:300/344;
    width:min(calc(100vw - 6px),calc((100vh - 6px) * .8721))}
  #sv{position:absolute;inset:0;width:100%;height:100%;display:block;overflow:visible}

  /* 투명 조작 버튼. 2시·4시 푸셔와 3시 용두 위에 겹친다 */
  .hit{position:absolute;width:10%;height:8.72%;border:0;padding:0;margin:0;
    background:transparent;cursor:pointer;border-radius:50%}
  .h1{left:82.53%;top:20.35%}
  .h2{left:82.53%;top:58.14%}
  .h3{left:88.67%;top:39.24%}
  .hit:disabled{cursor:default}
  .hit:focus-visible{outline:1.5px solid #F2D7B8;outline-offset:1px}

  /* 푸셔 눌림 */
  .ph{transition:transform .11s ease-out}
  .ph.pr{transform:translateY(2.6px)}
  /* 대기 중 시작 푸셔 안내 */
  #hint{opacity:0}
  body:not(.go) #hint{animation:hint 2.6s ease-in-out infinite}
  @keyframes hint{0%,100%{opacity:0}50%{opacity:.8}}

  #lp{font-variant-numeric:tabular-nums}

  @media (prefers-reduced-motion:reduce){
    body:not(.go) #hint{animation:none;opacity:.5}
    .ph{transition:none}
  }
</style>
</head>
<body>
  <div class="stage" id="wa">
    <svg id="sv" viewBox="0 0 300 344" preserveAspectRatio="xMidYMid meet" aria-hidden="true">
      <defs>
        <!-- 로즈 골드 -->
        <linearGradient id="caseG" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#F9DCC0"/><stop offset=".2" stop-color="#D49C72"/>
          <stop offset=".42" stop-color="#8E5B36"/><stop offset=".56" stop-color="#CB9168"/>
          <stop offset=".7" stop-color="#FCE4CC"/><stop offset=".86" stop-color="#B07750"/>
          <stop offset="1" stop-color="#6F4327"/>
        </linearGradient>
        <linearGradient id="bezG" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#FFE8D2"/><stop offset=".3" stop-color="#D8A27A"/>
          <stop offset=".55" stop-color="#A66F47"/><stop offset=".8" stop-color="#E9BC97"/>
          <stop offset="1" stop-color="#8A5634"/>
        </linearGradient>
        <linearGradient id="bevG" x1="1" y1="1" x2="0" y2="0">
          <stop offset="0" stop-color="#FFE8D2"/><stop offset=".3" stop-color="#D8A27A"/>
          <stop offset=".55" stop-color="#9A643E"/><stop offset=".8" stop-color="#E9BC97"/>
          <stop offset="1" stop-color="#7E4D2D"/>
        </linearGradient>
        <linearGradient id="lightOv" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#fff" stop-opacity=".3"/><stop offset=".45" stop-color="#fff" stop-opacity="0"/>
          <stop offset=".55" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".3"/>
        </linearGradient>
        <linearGradient id="lugG" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0" stop-color="#7A4B2C"/><stop offset=".35" stop-color="#F6D8BA"/>
          <stop offset=".6" stop-color="#C98F65"/><stop offset="1" stop-color="#7A4B2C"/>
        </linearGradient>
        <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#FFEBD6"/><stop offset=".5" stop-color="#D09A6E"/><stop offset="1" stop-color="#8E5C36"/>
        </linearGradient>
        <!-- 무브먼트 금속 -->
        <linearGradient id="gilt" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#F4DDA9"/><stop offset=".45" stop-color="#C9A062"/><stop offset="1" stop-color="#8C6A34"/>
        </linearGradient>
        <linearGradient id="steel" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#F4F4F2"/><stop offset=".5" stop-color="#ABADB2"/><stop offset="1" stop-color="#6C6F76"/>
        </linearGradient>
        <linearGradient id="blue" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0" stop-color="#13286C"/><stop offset=".5" stop-color="#3F6FD2"/><stop offset="1" stop-color="#142C78"/>
        </linearGradient>
        <radialGradient id="rubyG" cx=".35" cy=".35" r=".7">
          <stop offset="0" stop-color="#FF9AA6"/><stop offset=".4" stop-color="#C21E3A"/><stop offset="1" stop-color="#5E0A18"/>
        </radialGradient>
        <radialGradient id="screwG" cx=".35" cy=".3" r=".75">
          <stop offset="0" stop-color="#8FB0F4"/><stop offset=".5" stop-color="#2848A8"/><stop offset="1" stop-color="#0E1E5C"/>
        </radialGradient>
        <!-- 다이얼: 오팔린과 스네일링 -->
        <radialGradient id="opal" cx=".38" cy=".3" r=".85">
          <stop offset="0" stop-color="#FCFBF7"/><stop offset=".6" stop-color="#EEEAE2"/><stop offset="1" stop-color="#D9D3C8"/>
        </radialGradient>
        <radialGradient id="sn" gradientUnits="userSpaceOnUse" cx="0" cy="0" r="1.5" spreadMethod="repeat">
          <stop offset="0" stop-color="#F4F1EB"/><stop offset=".5" stop-color="#E1DCD2"/><stop offset="1" stop-color="#F4F1EB"/>
        </radialGradient>
        <!-- 코트 드 주네브 줄무늬 -->
        <linearGradient id="cotG" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0" stop-color="#8E8D89"/><stop offset=".42" stop-color="#F7F6F3"/>
          <stop offset=".6" stop-color="#DCDBD7"/><stop offset="1" stop-color="#878682"/>
        </linearGradient>
        <pattern id="cotes" patternUnits="userSpaceOnUse" width="5.5" height="20" patternTransform="rotate(30)">
          <rect width="5.5" height="20" fill="url(#cotG)"/>
        </pattern>
        <!-- 페를라주 -->
        <radialGradient id="perlG">
          <stop offset="0" stop-color="#8E8A84"/><stop offset=".55" stop-color="#6B6762"/>
          <stop offset=".85" stop-color="#57534E"/><stop offset="1" stop-color="#3E3B37"/>
        </radialGradient>
        <pattern id="perl" patternUnits="userSpaceOnUse" width="4" height="3.4">
          <rect width="4" height="3.4" fill="#4C4844"/>
          <circle cx="0" cy="0" r="2.05" fill="url(#perlG)"/><circle cx="4" cy="0" r="2.05" fill="url(#perlG)"/>
          <circle cx="0" cy="3.4" r="2.05" fill="url(#perlG)"/><circle cx="4" cy="3.4" r="2.05" fill="url(#perlG)"/>
          <circle cx="2" cy="1.7" r="2.05" fill="url(#perlG)"/>
        </pattern>
        <radialGradient id="plSh">
          <stop offset="0" stop-color="#000" stop-opacity=".05"/><stop offset=".78" stop-color="#000" stop-opacity="0"/>
          <stop offset=".93" stop-color="#000" stop-opacity=".55"/><stop offset="1" stop-color="#000" stop-opacity=".7"/>
        </radialGradient>
        <!-- 문페이즈 -->
        <radialGradient id="skyG" cx=".5" cy=".3" r=".8">
          <stop offset="0" stop-color="#21458F"/><stop offset="1" stop-color="#0A1A48"/>
        </radialGradient>
        <radialGradient id="moonG" cx=".4" cy=".35" r=".7">
          <stop offset="0" stop-color="#FFF6D8"/><stop offset=".6" stop-color="#EBC77F"/><stop offset="1" stop-color="#B98B45"/>
        </radialGradient>
        <clipPath id="moonClip"><path d="M-11,0 A11,11 0 0 1 11,0 Z"/></clipPath>
        <!-- 스트랩: 악어 가죽 결 -->
        <pattern id="croc" patternUnits="userSpaceOnUse" width="9" height="12">
          <rect width="9" height="12" fill="#21130B"/>
          <rect x=".6" y=".6" width="7.8" height="4.8" rx="2" fill="#4B2C1A"/>
          <rect x="-3.9" y="6.6" width="7.8" height="4.8" rx="2" fill="#43271A"/>
          <rect x="5.1" y="6.6" width="7.8" height="4.8" rx="2" fill="#43271A"/>
        </pattern>
        <linearGradient id="strapSh" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0" stop-color="#000" stop-opacity=".5"/><stop offset=".25" stop-color="#000" stop-opacity="0"/>
          <stop offset=".5" stop-color="#fff" stop-opacity=".07"/><stop offset=".75" stop-color="#000" stop-opacity="0"/>
          <stop offset="1" stop-color="#000" stop-opacity=".5"/>
        </linearGradient>
        <linearGradient id="fadeT" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#000"/><stop offset=".6" stop-color="#fff"/>
        </linearGradient>
        <linearGradient id="fadeB" x1="0" y1="0" x2="0" y2="1">
          <stop offset=".4" stop-color="#fff"/><stop offset="1" stop-color="#000"/>
        </linearGradient>
        <mask id="mT" maskUnits="userSpaceOnUse" x="-40" y="-160" width="80" height="60">
          <rect x="-40" y="-152" width="80" height="48" fill="url(#fadeT)"/>
        </mask>
        <mask id="mB" maskUnits="userSpaceOnUse" x="-40" y="100" width="80" height="60">
          <rect x="-40" y="104" width="80" height="48" fill="url(#fadeB)"/>
        </mask>
        <!-- 유리 반사, 디지털 숫자 -->
        <linearGradient id="glare" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#fff" stop-opacity=".3"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
        </linearGradient>
        <linearGradient id="roG" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#FFF1DF"/><stop offset="1" stop-color="#D9A97C"/>
        </linearGradient>
        <clipPath id="dialClip"><circle r="100.6"/></clipPath>
        <filter id="hs" x="-50%" y="-50%" width="200%" height="200%">
          <feDropShadow dx=".8" dy="1.5" stdDeviation=".8" flood-color="#000" flood-opacity=".4"/>
        </filter>
        <filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="6"/></filter>
      </defs>

      <g id="W" transform="translate(150,150)">
        <g id="gStrap"></g>
        <circle cx="3" cy="9" r="118" fill="#000" opacity=".6" filter="url(#soft)"/>
        <g id="gLugs"></g>
        <g id="gPush"></g>
        <g id="gCase"></g>
        <g id="gMvt" clip-path="url(#dialClip)"></g>
        <g id="gDial"></g>
        <g id="gHands" filter="url(#hs)"></g>
        <g id="gGlass"></g>
      </g>
      <g id="ro" transform="translate(150,318)"></g>
      <text id="lp" x="150" y="337" text-anchor="middle" font-size="8.6" font-weight="600"
        letter-spacing=".8" fill="#C9A27C"></text>
    </svg>

    <button class="hit h1" id="b1" type="button" aria-label="시작"></button>
    <button class="hit h2" id="b2" type="button" aria-label="랩" disabled></button>
    <button class="hit h3" id="b3" type="button" aria-label="리셋" disabled></button>
  </div>

<script>
(function(){
  var NS='http://www.w3.org/2000/svg';
  function $(id){return document.getElementById(id);}
  function E(tag,a,p){var e=document.createElementNS(NS,tag);for(var k in a)e.setAttribute(k,a[k]);if(p)p.appendChild(e);return e;}
  /* 12시 기준 시계 방향 각도 → 좌표 */
  function P(r,d){var a=d*Math.PI/180;return [r*Math.sin(a),-r*Math.cos(a)];}
  function R(x,y,d){var a=d*Math.PI/180,c=Math.cos(a),s=Math.sin(a);return [x*c-y*s,x*s+y*c];}
  function n2(v){return Math.round(v*100)/100;}
  function pts(arr){return arr.map(function(p){return n2(p[0])+','+n2(p[1]);}).join(' ');}
  var REDUCE=window.matchMedia('(prefers-reduced-motion: reduce)');
  var SERIF="Georgia,'Times New Roman',serif";

  /* ── 스트랩 ── */
  var gS=$('gStrap');
  [['mT',-152],['mB',106]].forEach(function(o){
    var g=E('g',{mask:'url(#'+o[0]+')'},gS);
    E('rect',{x:-30,y:o[1],width:60,height:46,fill:'url(#croc)'},g);
    E('rect',{x:-30,y:o[1],width:60,height:46,fill:'url(#strapSh)'},g);
    [-26,26].forEach(function(x){
      E('line',{x1:x,y1:o[1],x2:x,y2:o[1]+46,stroke:'#CBA57E','stroke-width':.5,'stroke-dasharray':'2.2 1.3',opacity:.7},g);
    });
  });

  /* ── 러그 ── */
  var gL=$('gLugs');
  [[-1,-1],[1,-1],[-1,1],[1,1]].forEach(function(q){
    var sx=q[0],sy=q[1];
    var d='M'+sx*31+','+sy*100+' L'+sx*31+','+sy*130+' Q'+sx*31+','+sy*136+' '+sx*36.5+','+sy*136+
          ' Q'+sx*42+','+sy*136+' '+sx*42.5+','+sy*129+' L'+sx*43.5+','+sy*100+' Z';
    E('path',{d:d,fill:'url(#lugG)',stroke:'rgba(70,36,14,.7)','stroke-width':.5},gL);
    E('line',{x1:sx*36.8,y1:sy*106,x2:sx*36.8,y2:sy*133,stroke:'rgba(255,240,224,.75)','stroke-width':.6},gL);
  });

  /* ── 푸셔(2시·4시)와 용두(3시) ── */
  var gP=$('gPush');
  function pusher(ang,id){
    var g=E('g',{transform:'rotate('+ang+')'},gP);
    E('rect',{x:-2.4,y:-127,width:4.8,height:14,fill:'url(#lugG)'},g);
    E('rect',{x:-4.4,y:-120.5,width:8.8,height:3.2,rx:1,fill:'url(#lugG)',stroke:'rgba(70,36,14,.6)','stroke-width':.35},g);
    var h=E('g',{'class':'ph',id:id},g);
    E('rect',{x:-5.8,y:-136,width:11.6,height:10.5,rx:2.4,fill:'url(#lugG)',stroke:'rgba(70,36,14,.75)','stroke-width':.5},h);
    E('rect',{x:-4.4,y:-135.4,width:8.8,height:1.3,rx:.6,fill:'rgba(255,244,230,.8)'},h);
    E('line',{x1:-5.4,y1:-127.4,x2:5.4,y2:-127.4,stroke:'rgba(70,36,14,.5)','stroke-width':.4},h);
    return g;
  }
  var p1g=pusher(60,'p1');
  E('circle',{id:'hint',cx:0,cy:-131,r:10,fill:'none',stroke:'#F3D3AE','stroke-width':1},p1g);
  pusher(120,'p2');
  (function(){
    var g=E('g',{transform:'rotate(90)'},gP);
    E('rect',{x:-3.2,y:-126,width:6.4,height:12,fill:'url(#lugG)'},g);
    var h=E('g',{'class':'ph',id:'p3'},g);
    E('rect',{x:-7.6,y:-138,width:15.2,height:13,rx:2.4,fill:'url(#lugG)',stroke:'rgba(70,36,14,.75)','stroke-width':.5},h);
    for(var x=-6.5;x<=6.6;x+=1.3)
      E('line',{x1:n2(x),y1:-137.4,x2:n2(x),y2:-125.6,stroke:'rgba(70,36,14,.55)','stroke-width':.45},h);
    E('rect',{x:-6.6,y:-139.4,width:13.2,height:1.8,rx:.9,fill:'url(#gold)'},h);
  })();

  /* ── 케이스: 연마 단차, 플루티드 베젤, 안쪽 경사 ── */
  var gC=$('gCase'),i,a,p,q;
  E('circle',{r:117.5,fill:'url(#caseG)',stroke:'rgba(55,26,8,.75)','stroke-width':.7},gC);
  E('circle',{r:115.4,fill:'none',stroke:'rgba(255,238,220,.6)','stroke-width':.45},gC);
  E('circle',{r:113,fill:'url(#bezG)',stroke:'rgba(70,36,14,.55)','stroke-width':.4},gC);
  for(i=0;i<144;i++){
    a=i*2.5;
    p=P(105.2,a);q=P(112.6,a);
    E('line',{x1:n2(p[0]),y1:n2(p[1]),x2:n2(q[0]),y2:n2(q[1]),stroke:'rgba(255,246,236,.5)','stroke-width':.8},gC);
    p=P(105.2,a+1.25);q=P(112.6,a+1.25);
    E('line',{x1:n2(p[0]),y1:n2(p[1]),x2:n2(q[0]),y2:n2(q[1]),stroke:'rgba(80,40,14,.42)','stroke-width':.8},gC);
  }
  E('circle',{r:113,fill:'url(#lightOv)'},gC);
  E('circle',{r:104.8,fill:'url(#bevG)',stroke:'rgba(70,36,14,.6)','stroke-width':.4},gC);
  E('circle',{r:100.9,fill:'#15100C'},gC);

  /* ── 무브먼트(스켈레톤) ── */
  var gM=$('gMvt');
  E('circle',{r:100,fill:'#17130F'},gM);
  E('circle',{r:80,fill:'url(#perl)'},gM);
  E('circle',{r:80,fill:'url(#plSh)'},gM);

  function gearPath(r,n,dep,rin){
    var s='',st=360/n,k,b,pp;
    for(k=0;k<n;k++){
      b=k*st;
      pp=P(r-dep,b);s+=(k?'L':'M')+n2(pp[0])+','+n2(pp[1]);
      pp=P(r,b+st*.22);s+='L'+n2(pp[0])+','+n2(pp[1]);
      pp=P(r,b+st*.48);s+='L'+n2(pp[0])+','+n2(pp[1]);
      pp=P(r-dep,b+st*.7);s+='L'+n2(pp[0])+','+n2(pp[1]);
    }
    s+='Z';
    if(rin)s+='M'+rin+',0A'+rin+','+rin+' 0 1 0 '+(-rin)+',0A'+rin+','+rin+' 0 1 0 '+rin+',0Z';
    return s;
  }
  /* 톱니바퀴: 테두리, 살, 허브. 회전용 안쪽 그룹을 돌려준다 */
  function gear(x,y,r,n,spokes,fill){
    var o=E('g',{transform:'translate('+x+','+y+')'},gM);
    E('circle',{r:r+.6,fill:'rgba(0,0,0,.35)',transform:'translate(.6,1)'},o);
    var g=E('g',{},o),k,dep=Math.max(.8,Math.min(1.5,r*.09));
    E('path',{d:gearPath(r,n,dep,n2(r*.8)),fill:fill,'fill-rule':'evenodd',stroke:'rgba(60,36,10,.5)','stroke-width':.25},g);
    for(k=0;k<spokes;k++)
      E('rect',{x:n2(-r*.06),y:n2(-r*.82),width:n2(r*.12),height:n2(r*.58),fill:fill,
        stroke:'rgba(60,36,10,.4)','stroke-width':.2,transform:'rotate('+n2(k*360/spokes)+')'},g);
    E('circle',{r:n2(r*.27),fill:fill,stroke:'rgba(60,36,10,.5)','stroke-width':.25},g);
    return g;
  }
  function jewel(x,y,r){
    E('circle',{cx:x,cy:y,r:r+1.1,fill:'url(#gold)',stroke:'rgba(60,30,10,.6)','stroke-width':.3},gM);
    E('circle',{cx:x,cy:y,r:r,fill:'url(#rubyG)'},gM);
    E('circle',{cx:n2(x-r*.35),cy:n2(y-r*.35),r:n2(r*.28),fill:'rgba(255,255,255,.75)'},gM);
  }
  function screw(x,y,r,rot,par){
    var g=E('g',{transform:'translate('+x+','+y+') rotate('+rot+')'},par||gM);
    E('circle',{r:r,fill:'url(#screwG)',stroke:'rgba(5,10,40,.6)','stroke-width':.25},g);
    E('rect',{x:-r,y:-r*.17,width:r*2,height:r*.34,fill:'#0A1640'},g);
    return g;
  }
  /* 브리지: 챕터 링 아래에서 뻗어 나와 축 위에서 둥글게 끝난다. 줄무늬가 한 방향이 되게 좌표를 직접 돌린다 */
  function bridge(ang,rp,wb,we){
    var mid=(rp+88)/2,wm=Math.min(wb,we)*.8;
    function T(x,y){var r=R(x,y,ang);return n2(r[0])+','+n2(r[1]);}
    var d='M'+T(-wb,-88)+' Q'+T(-wm,-mid)+' '+T(-we,-rp)+' A'+we+','+we+' 0 0 0 '+T(we,-rp)+
          ' Q'+T(wm,-mid)+' '+T(wb,-88)+' Z';
    E('path',{d:d,fill:'rgba(0,0,0,.5)',transform:'translate(.9,1.6)'},gM);
    E('path',{d:d,fill:'url(#cotes)',stroke:'#5E5C58','stroke-width':1.2},gM);

    r.style.cssText='position:absolute;width:1px;height:1px;margin:-1px;padding:0;'+
      'overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0';
    document.body.appendChild(r);
    return function(m){ r.textContent=''; setTimeout(function(){ r.textContent=m; },30); };
  })();
  function srHuman(ms){
    if(ms<0)ms=0;
    var cs2=Math.floor(ms/10)%100, s=Math.floor(ms/1000), ss=s%60, mm=Math.floor(s/60);
    return (mm?mm+'분 ':'')+ss+'점'+String(cs2).padStart(2,'0')+'초';
  }
  var srWasRun=false, srLast=0;
  function ui(){
    document.body.classList.toggle('go',run);
    var e=elp();
    b2.disabled=!run&&e===0; b3.disabled=run||e===0;
    b1.setAttribute('aria-label',run?'정지':(e>0?'재개':'시작'));
    b2.setAttribute('aria-label',run?'랩':'리셋');

    /* 정지와 초기화를 알리고, 방금 누른 버튼이 잠기면 포커스를 되돌린다 */
    var srE=elp();
    if(srWasRun&&!run) srSay('정지. 경과 시간 '+srHuman(srE));
    else if(!srWasRun&&!run&&srLast>0&&srE===0) srSay('초기화했습니다');
    srWasRun=run; srLast=srE;
    if(document.activeElement&&document.activeElement.disabled) b1.focus();
  }
  function press(id){
    var h=$(id);h.classList.add('pr');
    clearTimeout(h._t);h._t=setTimeout(function(){h.classList.remove('pr');},140);
  }
  function start(){if(run)return;run=true;stt=performance.now();colT+=360/14;press('p1');ui();}
  function stop(){if(!run)return;acc=elp();run=false;colT+=360/14;press('p1');ui();}
  function reset(pid){if(run||elp()===0)return;
    fly={t0:performance.now(),c:shownCh,m:shownMn};
    acc=0;stt=0;laps=[];last=0;lp.textContent='';colT+=360/14;press(pid||'p2');ui();}
  function lap(){if(!run)return;var e=elp(),sp=e-last;last=e;laps.push(sp);
    var best=Math.min.apply(null,laps);
    lp.textContent='LAP '+laps.length+'  ·  '+plain(sp)+(laps.length>1&&sp===best?'  ★':'');
    press('p2');
    srSay('랩 '+laps.length+'. 구간 '+srHuman(sp));}
  function toggle(){run?stop():start();}
  b1.addEventListener('click',toggle);
  /* 4시 푸셔: 측정 중엔 랩, 정지 상태에선 리셋 */
  b2.addEventListener('click',function(){run?lap():reset('p2');});
  b3.addEventListener('click',function(){reset('p3');});
  document.addEventListener('keydown',function(e){
    if(e.metaKey||e.ctrlKey||e.altKey||e.repeat)return;
    if(e.target&&e.target.tagName==='BUTTON'&&e.key===' ')return;
    if(e.key===' '){e.preventDefault();toggle();}
    else if(e.key==='l'||e.key==='L'){lap();}
    else if(e.key==='r'||e.key==='R'){reset('p2');}
  });
  ui();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
