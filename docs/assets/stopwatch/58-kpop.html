<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>K-POP 에잇 카운트 스탑워치</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='%230B0B12'/><text x='50' y='68' font-family='Arial' font-weight='900' font-size='54' text-anchor='middle' fill='%23D7FF3A'>8</text></svg>" />
<style>
  /* 가변 글꼴 하나로 굵기 100~900을 실시간으로 바꾼다. 키네틱 타이포의 핵심 재료 */
  @font-face{font-family:'Pretendard';src:url('../fonts/PretendardVariable.ttf') format('truetype');font-weight:100 900;font-style:normal;font-display:swap;}
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overflow:hidden}
  :root{--bg:#0B0B12;--lime:#D7FF3A;--pink:#FF2E88;--cyan:#2EE6FF;--white:#F7F7FA}
  body{font-family:'Pretendard',-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",sans-serif;color:var(--white);
    background:radial-gradient(80% 60% at 50% 46%,#2A0F2A 0%,var(--bg) 70%);
    display:flex;align-items:center;justify-content:center;padding:14px;position:relative}

  /* ── 흐르는 글자 띠 (JS가 속도를 조절한다. 대기 중엔 느리게, 달리면 빠르게) ── */
  .band{position:absolute;left:-20%;right:-20%;white-space:nowrap;overflow:hidden;pointer-events:none;transform:rotate(-7deg)}
  .band .track{display:inline-block;will-change:transform}
  .band span{display:inline-block;padding-right:.5em}
  .b-top{top:5%;background:var(--lime);color:var(--bg);font-size:19px;font-weight:900;letter-spacing:.5px;padding:3px 0}
  .b-mid{top:36%;color:transparent;-webkit-text-stroke:1.2px rgba(255,255,255,.13);font-size:64px;font-weight:900;letter-spacing:-1px;line-height:1}
  .b-bot{bottom:3%;background:var(--pink);color:var(--white);font-size:17px;font-weight:800;letter-spacing:.5px;padding:3px 0}
  .dot{color:var(--pink)}
  .b-bot .dot{color:var(--lime)}
  .b-mid .dot{color:transparent}

  .wrap{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;gap:6px;margin-top:-4px}

  /* ── 카운트: 안무 연습실의 "파이브, 식스, 세븐, 에잇!" ── */
  .count{height:38px;display:flex;align-items:center;justify-content:center;min-width:220px}
  .word{display:inline-block;font-size:31px;font-weight:900;color:var(--lime);font-style:normal;
    transform:skewX(-9deg);text-shadow:3px 3px 0 var(--pink);white-space:nowrap}
  .word.idle{font-weight:300;color:rgba(247,247,250,.55);text-shadow:none;letter-spacing:6px;font-size:18px;animation:breathe 1.6s ease-in-out infinite}
  @keyframes breathe{0%,100%{font-weight:200;letter-spacing:8px}50%{font-weight:700;letter-spacing:4px}}
  .word.slam{animation:slam .46s cubic-bezier(.2,.9,.25,1) both}
  @keyframes slam{
    0%{transform:skewX(-9deg) scale(2.3);opacity:0;font-weight:100;letter-spacing:22px}
    35%{transform:skewX(-9deg) scale(.92);opacity:1;font-weight:900;letter-spacing:-1px}
    55%{transform:skewX(-9deg) scale(1.04)}
    100%{transform:skewX(-9deg) scale(1);opacity:.9;font-weight:800;letter-spacing:0}}

  /* ── 시간: 숫자마다 따로 떨어져 내려앉고, 박자마다 굵기가 출렁인다 ── */
  .time{display:flex;align-items:baseline;font-size:66px;font-weight:800;line-height:1;letter-spacing:-2px;
    font-variant-numeric:tabular-nums;color:var(--white);text-shadow:4px 4px 0 var(--pink),-2px -2px 0 rgba(46,230,255,.55)}
  .time .d{display:inline-block;min-width:.6em;text-align:center}
  .time .c{min-width:.3em}
  .time .d.drop{animation:drop .42s cubic-bezier(.2,.9,.3,1.3)}
  @keyframes drop{
    0%{transform:translateY(-60%) skewX(-14deg) scaleY(1.35);opacity:0;font-weight:900}
    60%{transform:translateY(5%) scaleY(.88);opacity:1}
    100%{transform:none;font-weight:800}}
  .time .cs{font-size:28px;font-weight:600;letter-spacing:-.5px;color:var(--lime);text-shadow:2px 2px 0 var(--pink);margin-left:2px}
  .time.thump{animation:thump .48s ease-out}
  @keyframes thump{0%{font-weight:900;transform:scale(1.07,1.0)}40%{font-weight:600}100%{font-weight:800;transform:none}}

  .lp{height:16px;font-size:11px;font-weight:800;letter-spacing:.5px;color:var(--lime);font-variant-numeric:tabular-nums}

  /* ── 킬링파트: 랩을 찍으면 글자가 한 자씩 날아들어 화면을 가로지른다 ── */
  .kp{position:absolute;left:0;right:0;top:50%;z-index:3;margin-top:-36px;text-align:center;pointer-events:none;
    font-size:40px;font-weight:900;letter-spacing:-1px;white-space:nowrap;color:var(--white);
    text-shadow:3px 3px 0 var(--pink);visibility:hidden}
  .kp.go{visibility:visible}
  .kp i{display:inline-block;font-style:normal;opacity:0}
  .kp.go i{animation:fly 1.15s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--k) * 32ms)}
  @keyframes fly{
    0%{transform:translateX(120px) skewX(-20deg);opacity:0;font-weight:100}
    28%{transform:none;opacity:1;font-weight:900}
    72%{transform:none;opacity:1;font-weight:900}
    100%{transform:translateX(-120px) skewX(20deg);opacity:0;font-weight:100}}
  .kp.go ~ .wrap .time{opacity:.18;transition:opacity .12s}
  .wrap .time{transition:opacity .3s}

  /* ── 버튼: 글자가 주인공. 누르면 자간이 벌어진다 ── */
  .row{display:flex;gap:8px;margin-top:8px}
  button{font-family:inherit;font-size:13px;font-weight:800;cursor:pointer;white-space:nowrap;
    width:84px;height:40px;border-radius:4px;color:var(--white);background:#14141E;
    border:1.5px solid rgba(247,247,250,.75);box-shadow:3px 3px 0 var(--pink);
    transition:letter-spacing .2s,font-weight .2s,transform .07s,box-shadow .07s}
  button:hover:not(:disabled){letter-spacing:2px;font-weight:900}
  button:active:not(:disabled){transform:translate(3px,3px);box-shadow:0 0 0 var(--pink)}
  #b1{background:var(--lime);color:var(--bg);border-color:var(--lime)}
  #b1.run{background:var(--pink);color:var(--white);border-color:var(--pink);box-shadow:3px 3px 0 var(--lime)}
  button:disabled{opacity:.38;cursor:default;box-shadow:none}
  button:focus-visible{outline:2px solid var(--cyan);outline-offset:3px}

  @media (prefers-reduced-motion: reduce){
    *,*::before,*::after{animation-duration:.001ms !important;animation-iteration-count:1 !important;
      transition-duration:.001ms !important}
  }
</style>
</head>
<body>
  <div class="band b-top" aria-hidden="true"><div class="track" data-dir="-1"></div></div>
  <div class="band b-mid" aria-hidden="true"><div class="track" data-dir="1"></div></div>
  <div class="band b-bot" aria-hidden="true"><div class="track" data-dir="-1"></div></div>

  <div class="kp" id="kp" aria-hidden="true"></div>

  <div class="wrap">
    <div class="count" aria-hidden="true"><span class="word idle" id="word">READY?</span></div>
    <div class="time" id="t" role="timer"></div>
    <div class="lp" id="lp" aria-live="polite"></div>
    <div class="row">
      <button id="b2" type="button" disabled aria-label="킬링파트 (랩)">킬링파트</button>
      <button id="b1" type="button">시작</button>
      <button id="b3" type="button" disabled>리셋</button>
    </div>
  </div>
<script>
(function(){
  var REDUCED=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* ── 글자 띠 채우기 ── */
  var BANDS=[
    ['COMEBACK','컴백','ON STAGE','무대 위로','EIGHT COUNT','에잇 카운트'],
    ['K-POP','K-POP','K-POP'],
    ['ENCORE','앵콜','ONE MORE TIME','한 번 더','KILLING PART','킬링파트']
  ];
  var tracks=[].slice.call(document.querySelectorAll('.band .track'));
  tracks.forEach(function(tr,i){
    var html='';
    BANDS[i].forEach(function(w){html+='<span>'+w+'</span><span class="dot">●</span>';});
    tr.innerHTML=html+html+html+html; /* 넉넉히 반복해 두고 한 묶음 폭만큼 돌린다 */
  });
  var widths=tracks.map(function(tr){return tr.scrollWidth/4;});
  var pos=[0,0,0], speed=14, target=14, lastF=performance.now();
  function frame(now){
    var dt=Math.min(.05,(now-lastF)/1000); lastF=now;
    speed+=(target-speed)*Math.min(1,dt*3);          /* 시작·정지 때 띠가 서서히 빨라지고 느려진다 */
    if(!REDUCED) tracks.forEach(function(tr,i){
      var dir=+tr.dataset.dir, w=widths[i]||1;
      pos[i]=(pos[i]+speed*dt*(i===1?.55:1))%w;
      tr.style.transform='translateX('+(dir<0?-pos[i]:pos[i]-w)+'px)';
    });
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  /* ── 스탑워치 ── */
  var t=document.getElementById('t'),b1=document.getElementById('b1'),b2=document.getElementById('b2'),b3=document.getElementById('b3'),
      lp=document.getElementById('lp'),word=document.getElementById('word'),kp=document.getElementById('kp');
  var run=false,st=0,acc=0,iv=null,laps=[],last=0,beat=-1;
  var BPM=120, BEAT=60000/BPM;
  /* 연습실 카운트: 처음 네 박은 "5·6·7·8", 그다음부터 여덟 박을 한 묶음으로 센다 */
  var LEAD=['FIVE','SIX','SEVEN','EIGHT!'], EIGHT=['하나','둘','셋','넷','다섯','여섯','일곱','여덟'];

  function el(){return acc+(run?performance.now()-st:0);}
  function pad(n){return String(n).padStart(2,'0');}
  function plain(ms){if(ms<0)ms=0;var c=Math.floor(ms/10),cc=c%100,s=Math.floor(c/100),ss=s%60,mm=Math.floor(s/60);
    return pad(mm)+':'+pad(ss)+'.'+pad(cc);}

  /* 숫자 칸을 한 번 만들어 두고, 바뀐 칸만 떨어뜨린다 (100분의 1초는 너무 빨라 그냥 바꾼다) */
  var cells=[],cs=null,prev='';
  function build(n){
    t.textContent='';cells=[];
    for(var i=0;i<n;i++){var s=document.createElement('span');s.className='d';t.appendChild(s);cells.push(s);}
    cs=document.createElement('span');cs.className='cs';t.appendChild(cs);prev='';
  }
  function draw(){
    var e=el();if(e<0)e=0;
    var c=Math.floor(e/10),cc=c%100,s=Math.floor(c/100),ss=s%60,mm=Math.floor(s/60);
    var main=pad(mm)+':'+pad(ss);
    if(main.length!==cells.length)build(main.length);
    for(var i=0;i<main.length;i++){
      var ch=main.charAt(i);
      if(prev.charAt(i)!==ch){
        var d=cells[i];d.textContent=ch;d.className=ch===':'?'d c':'d';
        if(prev&&run&&!REDUCED){void d.offsetWidth;d.className+=' drop';}
      }
    }
    prev=main;cs.textContent='.'+pad(cc);
    if(run){var b=Math.floor(e/BEAT);if(b!==beat){beat=b;onBeat(b);}}
  }
  function slam(txt){
    word.className='word';word.textContent=txt;
    if(!REDUCED){void word.offsetWidth;word.className='word slam';}
  }
  function onBeat(b){
    slam(b<4?LEAD[b]:EIGHT[(b-4)%8]);
    if(!REDUCED){t.classList.remove('thump');void t.offsetWidth;t.classList.add('thump');}
  }
  function idleWord(txt){word.className='word idle';word.textContent=txt;}

  /* ── 접근성 공통 ── */
  var srSay=(function(){
    var r=document.createElement('div');
    r.setAttribute('role','status'); r.setAttribute('aria-live','polite');
    r.style.cssText='position:absolute;width:1px;height:1px;margin:-1px;padding:0;'+
      'overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0';
    document.body.appendChild(r);
    return function(m){ r.textContent=''; setTimeout(function(){ r.textContent=m; },30); };
  })();
  function srHuman(ms){
    if(ms<0)ms=0;
    var cs=Math.floor(ms/10)%100, s=Math.floor(ms/1000), ss=s%60, mm=Math.floor(s/60);
    return (mm?mm+'분 ':'')+ss+'점'+String(cs).padStart(2,'0')+'초';
  }
  var srWasRun=false, srLast=0;
  function ui(){
    b1.textContent=run?'정지':(el()>0?'재개':'시작');b1.classList.toggle('run',run);b2.disabled=!run;b3.disabled=run||el()===0;
    target=run?95:14;
    var srE=el();
    if(srWasRun&&!run) srSay('정지. 경과 시간 '+srHuman(srE));
    else if(!srWasRun&&!run&&srLast>0&&srE===0) srSay('초기화했습니다');
    srWasRun=run; srLast=srE;
    if(document.activeElement&&document.activeElement.disabled) b1.focus();
  }
  function start(){run=true;st=performance.now();beat=Math.floor(acc/BEAT)-1;if(!iv)iv=setInterval(draw,31);draw();ui();}
  function stop(){if(!run)return;acc=el();run=false;clearInterval(iv);iv=null;draw();idleWord('PAUSE');ui();}
  function reset(){if(run)return;acc=0;st=0;laps=[];last=0;beat=-1;lp.textContent='';draw();idleWord('READY?');ui();}
  function lap(){
    if(!run)return;
    var e=el(),sp=e-last;last=e;laps.push(sp);var best=Math.min.apply(null,laps);
    lp.textContent='KILLING PART '+laps.length+' · '+plain(sp)+(laps.length>1&&sp===best?' ★':'');
    var txt='KILLING PART',h='';
    for(var i=0;i<txt.length;i++) h+='<i style="--k:'+i+'">'+(txt[i]===' '?'&nbsp;':txt[i])+'</i>';
    kp.innerHTML=h;
    kp.classList.remove('go');void kp.offsetWidth;kp.classList.add('go');
    clearTimeout(kp._t);kp._t=setTimeout(function(){kp.classList.remove('go');},1600);
  }
  b1.onclick=function(){run?stop():start();};b2.onclick=lap;b3.onclick=reset;
  window.addEventListener('pagehide',function(){clearInterval(iv);iv=null;});
  window.addEventListener('pageshow',function(){if(run&&!iv)iv=setInterval(draw,31);});
  document.addEventListener('keydown',function(e){
    if(e.metaKey||e.ctrlKey||e.altKey||e.repeat)return;
    if(e.target&&e.target.tagName==='BUTTON'&&(e.key===' '||e.code==='Space'))return;
    if(e.key===' '){e.preventDefault();run?stop():start();}
    else if(e.key==='l'||e.key==='L'){lap();}
    else if(e.key==='r'||e.key==='R'){reset();}
  });
  document.addEventListener('visibilitychange',function(){if(!document.hidden&&run)draw();});
  draw();ui();
  /* 글꼴이 늦게 오면 띠 폭이 바뀌므로 다시 잰다 */
  if(document.fonts&&document.fonts.ready)document.fonts.ready.then(function(){widths=tracks.map(function(tr){return tr.scrollWidth/4;});});
})();
</script>
</body>
</html>
