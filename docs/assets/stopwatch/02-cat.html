<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>고양이 스탑워치</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐱</text></svg>" />
<style>
  @font-face{font-family:'Pretendard';src:url('../fonts/PretendardVariable.ttf') format('truetype');font-weight:100 900;font-style:normal;font-display:swap;}
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{font-family:'Pretendard',-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
    background:linear-gradient(180deg,#FBD9C4 0%,#FBE7C8 38%,#CDEBD6 62%,#BfE6DE 100%);
    display:flex;align-items:center;justify-content:center;color:#7A5A48;padding:14px;overflow:hidden}
  .wrap{display:flex;flex-direction:column;align-items:center;gap:12px;width:100%;max-width:300px}
  .cat{width:150px;position:relative}
  .cat svg{display:block;width:100%;height:auto;
    filter:drop-shadow(0 8px 18px rgba(150,100,50,.28))}
  /* 시작하면 고양이가 갸웃거린다 */
  .cat.go{transform-origin:bottom center;animation:catSway .8s ease-in-out infinite}
  @keyframes catSway{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
  #earL,#earR{transform-box:fill-box;transform-origin:bottom center}
  .cat.go #earL{animation:cEarL .8s ease-in-out infinite}
  .cat.go #earR{animation:cEarR .8s ease-in-out infinite}
  @keyframes cEarL{0%,100%{transform:rotate(0)}50%{transform:rotate(-9deg)}}
  @keyframes cEarR{0%,100%{transform:rotate(0)}50%{transform:rotate(9deg)}}
  #lids{transform-box:fill-box;transform-origin:center;animation:cBlink 4.8s ease-in-out infinite}
  .cat.go #lids{animation-duration:2.8s}
  @keyframes cBlink{0%,92%,100%{transform:scaleY(0)}96%{transform:scaleY(1)}}
  .card{background:rgba(255,255,255,.72);border-radius:24px;padding:16px 20px 18px;display:flex;flex-direction:column;align-items:center;gap:12px;
    box-shadow:0 8px 22px rgba(120,90,60,.16);backdrop-filter:blur(3px);width:100%}
  .time{font-variant-numeric:tabular-nums;font-weight:800;font-size:40px;color:#C66A3C}
  .time .cs{font-size:20px;color:#E0A06A}
  .row{display:flex;gap:8px}
  button{font-family:inherit;font-weight:800;font-size:13px;color:#fff;border:none;cursor:pointer;
    padding:12px 0;width:76px;border-radius:20px;box-shadow:0 4px 9px rgba(0,0,0,.12);transition:transform .07s,opacity .15s}
  button:active{transform:translateY(2px)}
  #b1{background:#E89A5C;color:#3E2208}#b1.run{background:#E0705C;color:#3E1208}#b2{background:#5EC0BE;color:#10403F}#b3{background:#D6A0C0;color:#422032}
  button:disabled{opacity:.6;cursor:default}
  .lp{font-size:11px;color:#A07A60;font-weight:700;min-height:14px}
  button:focus-visible{outline:3px solid #C66A3C;outline-offset:2px}
  @media (prefers-reduced-motion: reduce){
    *,*::before,*::after{animation-duration:.001ms !important;animation-iteration-count:1 !important;
      transition-duration:.001ms !important;scroll-behavior:auto !important}
  }
  button:hover:not(:disabled){filter:brightness(1.1)}
</style>
</head>
<body>
  <div class="wrap">
    <div class="cat" aria-hidden="true">
      <svg viewBox="0 0 148 132">
        <defs>
          <radialGradient id="fur" cx="42%" cy="32%" r="72%">
            <stop offset="0%" stop-color="#F6DCA6"/>
            <stop offset="52%" stop-color="#E4C283"/>
            <stop offset="100%" stop-color="#C9A25E"/>
          </radialGradient>
          <radialGradient id="iris" cx="38%" cy="32%" r="70%">
            <stop offset="0%" stop-color="#F0C066"/>
            <stop offset="55%" stop-color="#D08A32"/>
            <stop offset="100%" stop-color="#9C5C1C"/>
          </radialGradient>
        </defs>

        <!-- 귀: 브리티시 숏헤어는 작고 둥글며 넓게 벌어져 있다 -->
        <g id="earL">
          <path d="M24,52 C17,34 22,18 33,14 C43,11 52,20 56,32 C44,36 32,43 24,52 Z"
                fill="#DDB877" stroke="#B38C4E" stroke-width="1.6" stroke-linejoin="round"/>
          <path d="M31,46 C27,33 30,23 36,21 C42,19 47,25 49,33 C42,36 35,41 31,46 Z" fill="#E6A79C"/>
        </g>
        <g id="earR">
          <path d="M124,52 C131,34 126,18 115,14 C105,11 96,20 92,32 C104,36 116,43 124,52 Z"
                fill="#DDB877" stroke="#B38C4E" stroke-width="1.6" stroke-linejoin="round"/>
          <path d="M117,46 C121,33 118,23 112,21 C106,19 101,25 99,33 C106,36 113,41 117,46 Z" fill="#E6A79C"/>
        </g>

        <!-- 넓고 둥근 얼굴과 도톰한 볼 -->
        <path d="M74,18 C104,18 128,36 132,64 C135,86 128,106 112,117 C101,125 88,128 74,128
                 C60,128 47,125 36,117 C20,106 13,86 16,64 C20,36 44,18 74,18 Z"
              fill="url(#fur)" stroke="#B38C4E" stroke-width="1.8"/>
        <!-- 볼 그늘과 홍조 -->
        <ellipse cx="32" cy="98" rx="17" ry="14" fill="#D9B172" opacity=".5"/>
        <ellipse cx="116" cy="98" rx="17" ry="14" fill="#D9B172" opacity=".5"/>
        <ellipse cx="28" cy="92" rx="11" ry="7.5" fill="#F19A96" opacity=".45"/>
        <ellipse cx="120" cy="92" rx="11" ry="7.5" fill="#F19A96" opacity=".45"/>
        <!-- 이마 티킹 -->
        <g stroke="#C29C58" stroke-width="2" stroke-linecap="round" opacity=".5" fill="none">
          <path d="M62,30 C64,24 66,22 68,20"/><path d="M74,28 L74,19"/>
          <path d="M86,30 C84,24 82,22 80,20"/>
        </g>

        <!-- 구리빛 큰 눈 -->
        <g>
          <ellipse cx="49" cy="73" rx="18" ry="17" fill="#FFFFFF" opacity=".45"/>
          <ellipse cx="99" cy="73" rx="18" ry="17" fill="#FFFFFF" opacity=".45"/>
          <circle cx="49" cy="73" r="16.5" fill="url(#iris)" stroke="#7C4A16" stroke-width="1.4"/>
          <circle cx="99" cy="73" r="16.5" fill="url(#iris)" stroke="#7C4A16" stroke-width="1.4"/>
          <circle cx="49" cy="74" r="8.4" fill="#1C1208"/>
          <circle cx="99" cy="74" r="8.4" fill="#1C1208"/>
          <circle cx="43.4" cy="67.4" r="4.8" fill="#FFFFFF" opacity=".95"/>
          <circle cx="93.4" cy="67.4" r="4.8" fill="#FFFFFF" opacity=".95"/>
          <circle cx="55" cy="79" r="2.4" fill="#FFFFFF" opacity=".7"/>
          <circle cx="105" cy="79" r="2.4" fill="#FFFFFF" opacity=".7"/>
          <circle cx="41" cy="78" r="1.5" fill="#FFFFFF" opacity=".55"/>
          <circle cx="91" cy="78" r="1.5" fill="#FFFFFF" opacity=".55"/>
          <g id="lids">
            <path d="M32,73 A17 17 0 0 1 66,73 Z" fill="#DDB877"/>
            <path d="M82,73 A17 17 0 0 1 116,73 Z" fill="#DDB877"/>
          </g>
        </g>

        <!-- 짧고 넓은 주둥이 -->
        <ellipse cx="62" cy="103" rx="14.5" ry="11" fill="#F7E6BE" opacity=".95"/>
        <ellipse cx="86" cy="103" rx="14.5" ry="11" fill="#F7E6BE" opacity=".95"/>
        <path d="M74,94 C77.5,94 80,96 80,98 C80,100.5 77,102.6 74,104 C71,102.6 68,100.5 68,98 C68,96 70.5,94 74,94 Z"
              fill="#E0918C" stroke="#BC706C" stroke-width=".9"/>
        <path d="M74,104 L74,107 M74,107 C71.5,111 66.5,111 64,107.5 M74,107 C76.5,111 81.5,111 84,107.5"
              fill="none" stroke="#A87C46" stroke-width="2" stroke-linecap="round"/>

        <!-- 수염 -->
        <g stroke="#8A6A3E" stroke-width="1.5" stroke-linecap="round" opacity=".62" fill="none">
          <path d="M47,98 C34,95 26,93 19,91"/><path d="M47,103 C33,103 25,103 18,103"/>
          <path d="M47,108 C34,110 26,112 20,114"/>
          <path d="M101,98 C114,95 122,93 129,91"/><path d="M101,103 C115,103 123,103 130,103"/>
          <path d="M101,108 C114,110 122,112 128,114"/>
        </g>
      </svg>
    </div>
    <div class="card">
      <div class="time"><span id="t">00:00<span class="cs">.00</span></span></div>
      <div class="row">
        <button id="b1">시작</button>
        <button id="b2" disabled>랩</button>
        <button id="b3" disabled>리셋</button>
      </div>
      <div class="lp" id="lp" aria-live="polite"></div>
    </div>
  </div>
<script>
(function(){
  var t=document.getElementById('t'),b1=document.getElementById('b1'),b2=document.getElementById('b2'),b3=document.getElementById('b3'),lp=document.getElementById('lp');
  var fig=document.querySelector('.cat');
  var run=false,st=0,acc=0,iv=null,laps=[],last=0;
  function el(){return acc+(run?performance.now()-st:0);}
  function f(ms){if(ms<0)ms=0;var c=Math.floor(ms/10),cc=c%100,s=Math.floor(c/100),ss=s%60,mm=Math.floor(s/60);
    return String(mm).padStart(2,'0')+':'+String(ss).padStart(2,'0')+'<span class="cs">.'+String(cc).padStart(2,'0')+'</span>';}
  function plain(ms){if(ms<0)ms=0;var c=Math.floor(ms/10),cc=c%100,s=Math.floor(c/100),ss=s%60,mm=Math.floor(s/60);
    return String(mm).padStart(2,'0')+':'+String(ss).padStart(2,'0')+'.'+String(cc).padStart(2,'0');}
  function draw(){t.innerHTML=f(el());}

  /* ── 접근성 공통 ──
     정지·초기화 결과를 스크린리더에 한 번씩 알린다. 시간 표시 자체는
     10ms마다 바뀌므로 라이브 리전으로 두지 않는다. */
  var srSay=(function(){
    var r=document.createElement('div');
    r.setAttribute('role','status'); r.setAttribute('aria-live','polite');
    r.style.cssText='position:absolute;width:1px;height:1px;margin:-1px;padding:0;'+
      'overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0';
    document.body.appendChild(r);
    return function(m){ r.textContent=''; setTimeout(function(){ r.textContent=m; },30); };
  })();
  function srHuman(ms){
    if(ms<0)ms=0;
    var cs=Math.floor(ms/10)%100, s=Math.floor(ms/1000), ss=s%60, mm=Math.floor(s/60);
    return (mm?mm+'분 ':'')+ss+'점'+String(cs).padStart(2,'0')+'초';
  }
  var srWasRun=false, srLast=0;
  function ui(){b1.textContent=run?'정지':(el()>0?'재개':'시작');b1.classList.toggle('run',run);b2.disabled=!run;b3.disabled=run||el()===0;
    /* 정지와 초기화를 알리고, 방금 누른 버튼이 잠기면 포커스를 되돌린다 */
    var srE=el();
    if(srWasRun&&!run) srSay('정지. 경과 시간 '+srHuman(srE));
    else if(!srWasRun&&!run&&srLast>0&&srE===0) srSay('초기화했습니다');
    srWasRun=run; srLast=srE;
    if(document.activeElement&&document.activeElement.disabled) b1.focus();
  }
  function start(){run=true;st=performance.now();if(!iv)iv=setInterval(draw,31);fig.classList.add('go');draw();ui();}
  function stop(){if(!run)return;acc=el();run=false;clearInterval(iv);iv=null;fig.classList.remove('go');draw();ui();}
  function reset(){if(run)return; run=false;clearInterval(iv);iv=null;acc=0;st=0;laps=[];last=0;fig.classList.remove('go');draw();ui();lp.textContent='';}
  function lap(){if(!run)return;var e=el(),sp=e-last;last=e;laps.push(sp);var best=Math.min.apply(null,laps);lp.textContent='랩 '+laps.length+' · '+plain(sp)+(laps.length>1&&sp===best?' ★':'');}
  b1.onclick=function(){run?stop():start();};b2.onclick=lap;b3.onclick=reset;
  window.addEventListener('pagehide',function(){clearInterval(iv);iv=null;});
  window.addEventListener('pageshow',function(){if(run&&!iv)iv=setInterval(draw,31);});
  document.addEventListener('keydown',function(e){
    if(e.metaKey||e.ctrlKey||e.altKey||e.repeat)return;
    if(e.target&&e.target.tagName==='BUTTON'&&(e.key===' '||e.code==='Space'))return;
    if(e.key===' '){e.preventDefault();run?stop():start();}
    else if(e.key==='l'||e.key==='L'){lap();}
    else if(e.key==='r'||e.key==='R'){reset();}
  });
  document.addEventListener('visibilitychange',function(){if(!document.hidden&&run)draw();});
  draw();ui();
})();
</script>
</body>
</html>
