<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>사람의 아들 스탑워치</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='%23A9B4B8'/><circle cx='50' cy='56' r='26' fill='%2378AA3C'/><path d='M50 30q2-10 10-14' stroke='%233B2A1A' stroke-width='4' fill='none'/></svg>" />
<style>
  @font-face{font-family:'Pretendard';src:url('../fonts/PretendardVariable.ttf') format('truetype');font-weight:100 900;font-style:normal;font-display:swap;}
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overflow:hidden}
  body{font-family:'Pretendard',-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",sans-serif;
    color:#F2F0EA;word-break:keep-all;
    display:flex;align-items:center;justify-content:center;padding:11px;
    background:radial-gradient(115% 90% at 50% 30%,#3B4247 0%,#262B2F 60%,#181A1D 100%)}

  /* 검은 액자 */
  .frame{width:100%;max-width:306px;border-radius:3px;overflow:hidden;padding:6px;
    background:linear-gradient(135deg,#2B2A28,#151514 50%,#2D2C2A);
    box-shadow:0 18px 40px rgba(0,0,0,.6),inset 0 0 0 1px rgba(255,255,255,.07)}
  .canvas{position:relative;overflow:hidden;line-height:0}
  .art{display:block;width:100%;height:auto;background:#9FAAB0}
  /* 그림을 층으로 나눠, 움직이는 층만 다시 합성한다(무거운 필터는 한 번만 그린다) */
  .ly{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;will-change:transform}
  .ly>svg{display:block;width:100%;height:100%}

  /* 정지 상태에서는 모두 멈춰 있고, 작동 중에만 흐른다 */
  .mv{animation-play-state:paused !important}
  body.go .mv{animation-play-state:running !important}
  /* 초기화하면 원작의 자세로 돌아간다 */
  body:not(.live) .mv:not(.gm):not(.gl){animation-name:none}

  /* 구름이 눈에 띄게 흘러간다 */
  .clouds{left:-100%;width:300%;animation:drift 38s linear infinite}
  @keyframes drift{from{transform:translateX(0)}to{transform:translateX(-33.3333%)}}

  /* 골콘드: 중산모 신사들이 하늘에서 천천히 내려온다 */
  .men{opacity:0;transition:opacity .5s ease}
  body.live .men{opacity:1}
  .gm{animation:fall var(--t) linear var(--d) infinite}
  @keyframes fall{from{transform:translate(0,-34px)}to{transform:translate(var(--dx),150px)}}

  /* 바다 물결과 반짝임 */
  .wv{width:200%;animation:waves 26s linear infinite}
  .wv.near{animation-duration:15s}
  @keyframes waves{from{transform:translateX(0)}to{transform:translateX(-50%)}}
  .gl{animation:glint var(--t) ease-in-out var(--d) infinite}
  @keyframes glint{0%,100%{opacity:0}50%{opacity:.95}}

  /* 사과가 크게 떠오르고 천천히 돈다, 잎은 바람에 떤다 */
  #appleFloat{animation:float 3.4s ease-in-out infinite}
  @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-4.8%)}}
  #appleSway{transform-origin:49.6% 34.9%;animation:sway 6.2s ease-in-out infinite}
  @keyframes sway{0%,100%{transform:rotate(0)}25%{transform:rotate(-7deg)}75%{transform:rotate(6deg)}}
  .lf{transform-box:fill-box;animation:flut 1.3s ease-in-out infinite}
  @keyframes flut{0%,100%{transform:rotate(0)}30%{transform:rotate(-14deg)}70%{transform:rotate(10deg)}}

  /* 랩: 사과가 비켜나고 중산모가 살짝 들린다 */
  .canvas.lap #applePeek{animation:peek 1.5s cubic-bezier(.35,0,.25,1)}
  @keyframes peek{0%{transform:translate(0,0)}28%,55%{transform:translate(-1.1%,3.4%)}100%{transform:translate(0,0)}}
  #hat{transform-origin:63% 20.3%}
  .canvas.lap #hat{animation:tip 1.5s cubic-bezier(.35,0,.25,1)}
  @keyframes tip{0%{transform:none}30%,52%{transform:translateY(-5.5%) rotate(-9deg)}100%{transform:none}}

  /* ── 조작부 ── */
  .bar{background:linear-gradient(180deg,#2A2D31 0%,#1C1E21 100%);padding:12px 13px 11px;text-align:center;margin-top:6px;border-radius:2px}
  .time{font-size:26px;font-weight:800;letter-spacing:.3px;line-height:1.1;white-space:nowrap;
    color:#F4F2EC;font-variant-numeric:tabular-nums}
  .time .cs{font-size:14px;font-weight:700;color:#A9C25A}

  .row{display:flex;gap:8px;justify-content:center;margin-top:10px}
  button{font-family:inherit;font-size:12.5px;font-weight:800;cursor:pointer;
    flex:1 1 0;min-width:0;max-width:88px;height:32px;border:0;border-radius:8px;color:#FFFFFF;
    transition:filter .18s,opacity .18s,transform .12s}
  button:hover:not(:disabled){filter:brightness(1.1);transform:translateY(-1px)}
  button:active:not(:disabled){transform:translateY(0)}
  button:disabled{opacity:.36;cursor:default}
  button:focus-visible{outline:2px solid #A9C25A;outline-offset:3px}
  #b1{background:#86A83E;color:#142008}
  #b2{background:#66798A}
  #b3{background:#A7352C}

  /* 랩 줄은 높이를 고정해 랩이 늘어도 화면이 움직이지 않는다 */
  .lapline{margin-top:8px;height:12px;line-height:12px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;
    font-size:10px;font-weight:700;color:rgba(196,214,150,.82);font-variant-numeric:tabular-nums}

  @media (max-height:326px){
    .time{font-size:21px}
    .time .cs{font-size:12px}
    .bar{padding:9px 11px 10px}
  }
  @media (prefers-reduced-motion:reduce){
    .mv,.gm,.gl,.lf,.canvas.lap #applePeek,.canvas.lap #hat{animation:none !important}
    .men{display:none}
    .gl{opacity:.35}
  }
</style>
</head>
<body>

<script>
/* ── 움직이는 층 채우기 ──
   씨앗을 고정한 난수로 신사와 물결을 깔아 매번 같은 그림이 나온다. */
(function(){
  var NS='http://www.w3.org/2000/svg',seed=5;
  function r(){seed=(seed*16807)%2147483647;return (seed-1)/2147483646;}
  function mk(tag,at,par){var e=document.createElementNS(NS,tag);for(var k in at)e.setAttribute(k,at[k]);par.appendChild(e);return e;}
  function n(v){return v.toFixed(2);}

  /* 골콘드처럼 줄을 맞춰 선 신사들: 가까울수록 크고 빠르다 */
  var men=document.getElementById('men'),
      M=[[18,.62],[52,.9],[86,.7],[118,1.05],[150,.6],[184,.95],[214,.72],[246,1.1],[280,.66],[34,.8],[230,.84],[266,.58]];
  for(var i=0;i<M.length;i++){var s=M[i][1],t=(13/s).toFixed(2),
      g=mk('g',{'class':'gm mv'},men);
    g.style.setProperty('--t',t+'s');
    g.style.setProperty('--d',(-(i*0.37%1)*t).toFixed(2)+'s');
    g.style.setProperty('--dx',n((r()-.5)*10)+'px');
    mk('use',{href:'#gman',transform:'translate('+n(M[i][0])+' 0) scale('+s+')',opacity:n(.62+s*.34)},g);}

  /* 물결: 300 폭을 두 번 그려 이어 흐르게 한다 */
  function sea(id,y0,y1,step,op,gl){var sv=document.getElementById(id),rows=[];
    for(var y=y0;y<y1;y+=step+r()*1.2){var x=r()*14,row=[];
      while(x<296){var L=6+r()*10,dark=r()<.22;row.push([x,y+(r()-.5)*1.2,L,dark]);x+=L+12+r()*24;}
      rows.push(row);}
    for(var c=0;c<2;c++){var off=c*300,d1='',d2='';
      rows.forEach(function(row){row.forEach(function(w){
        var p='M'+n(w[0]+off)+','+n(w[1])+' q'+n(w[2]/2)+','+n(-1.4)+' '+n(w[2])+',0 ';
        if(w[3])d2+=p;else d1+=p;});});
      mk('path',{d:d1,stroke:'#B3C3BE','stroke-width':'.75','stroke-linecap':'round',fill:'none',opacity:op},sv);
      mk('path',{d:d2,stroke:'#22313A','stroke-width':'.85','stroke-linecap':'round',fill:'none',opacity:'.5'},sv);}
    /* 물 위에서 반짝이는 빛 */
    for(var k=0;k<gl;k++){var gx=r()*300,gy=y0+r()*(y1-y0),gw=2+r()*3.5,dur=(1.3+r()*1.4).toFixed(2),dl=(-r()*2.6).toFixed(2);
      for(c=0;c<2;c++){var e=mk('path',{d:'M'+n(gx+c*300)+','+n(gy)+' h'+n(gw),stroke:'#F2F6EE','stroke-width':'1','stroke-linecap':'round','class':'gl mv'},sv);
        e.style.setProperty('--t',dur+'s');e.style.setProperty('--d',dl+'s');}}
  }
  sea('wFar',127,150,3.4,'.42',14);
  sea('wNear',151,174,4.2,'.55',10);
})();
</script>
<script>
(function(){
  var t=document.getElementById('t'),lp=document.getElementById('lp'),
      b1=document.getElementById('b1'),b2=document.getElementById('b2'),b3=document.getElementById('b3'),
      cv=document.getElementById('cv');
  var run=false,stt=0,acc=0,iv=null,laps=[],last=0,pt=null;
  function el(){return acc+(run?performance.now()-stt:0);}
  function pad(n,w){return String(n).padStart(w,'0');}
  function f(ms){if(ms<0)ms=0;var cs=Math.floor(ms/10)%100,s=Math.floor(ms/1000),ss=s%60,m=Math.floor(s/60),mm=m%60,hh=Math.floor(m/60);
    if(hh>99)hh=99;
    return pad(hh,2)+':'+pad(mm,2)+':'+pad(ss,2)+'<span class="cs">.'+pad(cs,2)+'</span>';}
  function plain(ms){if(ms<0)ms=0;var cs=Math.floor(ms/10)%100,s=Math.floor(ms/1000),ss=s%60,mm=Math.floor(s/60);
    return pad(mm,2)+':'+pad(ss,2)+'.'+pad(cs,2);}
  function draw(){t.innerHTML=f(el());}
  /* 랩을 찍으면 사과가 비켜나고 모자가 들린다 */
  function peek(){cv.classList.remove('lap');void cv.offsetWidth;cv.classList.add('lap');
    clearTimeout(pt);pt=setTimeout(function(){cv.classList.remove('lap');},1550);}

  /* ── 접근성 공통 ──
     정지·초기화 결과를 스크린리더에 한 번씩 알린다. 시간 표시 자체는
     10ms마다 바뀌므로 라이브 리전으로 두지 않는다. */
  var srSay=(function(){
    var r=document.createElement('div');
    r.setAttribute('role','status'); r.setAttribute('aria-live','polite');
    r.style.cssText='position:absolute;width:1px;height:1px;margin:-1px;padding:0;'+
      'overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0';
    document.body.appendChild(r);
    return function(m){ r.textContent=''; setTimeout(function(){ r.textContent=m; },30); };
  })();
  function srHuman(ms){
    if(ms<0)ms=0;
    var cs=Math.floor(ms/10)%100, s=Math.floor(ms/1000), ss=s%60, mm=Math.floor(s/60);
    return (mm?mm+'분 ':'')+ss+'점'+String(cs).padStart(2,'0')+'초';
  }
  var srWasRun=false, srLast=0;
  function ui(){
    document.body.classList.toggle('go',run);
    document.body.classList.toggle('live',run||el()>0);
    b1.textContent=run?'정지':(el()>0?'재개':'시작');
    b2.disabled=!run; b3.disabled=run||el()===0;

    /* 정지와 초기화를 알리고, 방금 누른 버튼이 잠기면 포커스를 되돌린다 */
    var srE=el();
    if(srWasRun&&!run) srSay('정지. 경과 시간 '+srHuman(srE));
    else if(!srWasRun&&!run&&srLast>0&&srE===0) srSay('초기화했습니다');
    srWasRun=run; srLast=srE;
    if(document.activeElement&&document.activeElement.disabled) b1.focus();
  }
  function start(){if(run)return;run=true;stt=performance.now();if(!iv)iv=setInterval(draw,31);draw();ui();}
  function stop(){if(!run)return;acc=el();run=false;clearInterval(iv);iv=null;draw();ui();}
  function reset(){if(run)return;acc=0;stt=0;laps=[];last=0;lp.textContent='';draw();ui();}
  function lap(){if(!run)return;var e=el(),sp=e-last;last=e;laps.push(sp);
    var best=Math.min.apply(null,laps);
    lp.textContent='LAP '+laps.length+' · '+plain(sp)+(laps.length>1&&sp===best?' ★':'');
    peek();
    srSay('랩 '+laps.length+'. 구간 '+srHuman(sp));}
  b1.addEventListener('click',function(){run?stop():start();});
  b2.addEventListener('click',lap);
  b3.addEventListener('click',reset);
  document.addEventListener('keydown',function(e){
    if(e.metaKey||e.ctrlKey||e.altKey||e.repeat)return;
    if(e.target&&e.target.tagName==='BUTTON'&&e.key===' ')return;
    if(e.key===' '){e.preventDefault();run?stop():start();}
    else if(e.key==='l'||e.key==='L'){lap();}
    else if(e.key==='r'||e.key==='R'){reset();}
  });
  document.addEventListener('visibilitychange',function(){if(!document.hidden&&run)draw();});
  window.addEventListener('pageshow',function(){if(run&&!iv)iv=setInterval(draw,31);});
  window.addEventListener('pagehide',function(){clearInterval(iv);iv=null;});
  draw();ui();
})();
</script>
