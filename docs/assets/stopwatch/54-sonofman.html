<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>사람의 아들 스탑워치</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='%23A9B4B8'/><circle cx='50' cy='56' r='26' fill='%2378AA3C'/><path d='M50 30q2-10 10-14' stroke='%233B2A1A' stroke-width='4' fill='none'/></svg>" />
<style>
  @font-face{font-family:'Pretendard';src:url('../fonts/PretendardVariable.ttf') format('truetype');font-weight:100 900;font-style:normal;font-display:swap;}
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overflow:hidden}
  body{font-family:'Pretendard',-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",sans-serif;
    color:#F2F0EA;word-break:keep-all;
    display:flex;align-items:center;justify-content:center;padding:11px;
    background:radial-gradient(115% 90% at 50% 30%,#3A3F44 0%,#25292D 60%,#17191C 100%)}

  /* 검은 액자 */
  .frame{width:100%;max-width:306px;border-radius:4px;overflow:hidden;padding:6px;
    background:linear-gradient(135deg,#2A2A2C,#141416 50%,#2E2E30);
    box-shadow:0 18px 40px rgba(0,0,0,.6),inset 0 0 0 1px rgba(255,255,255,.08)}
  .art{display:block;width:100%;height:auto;background:#A9B4B8}

  /* 구름은 천천히 흐르고, 사과는 얼굴 앞에 떠 있다 */
  .cloud{animation:drift 40s linear infinite}
  .cloud.b{animation-duration:56s;animation-delay:-20s}
  body.go .cloud{animation-duration:14s}
  body.go .cloud.b{animation-duration:20s}
  @keyframes drift{from{transform:translateX(-60px)}to{transform:translateX(380px)}}
  #apple{transition:transform .9s cubic-bezier(.3,1.3,.5,1)}
  #appleBob{animation:bob 3.6s ease-in-out infinite}
  body.go #apple{transform:translateY(-9px)}
  body.go #appleBob{animation-duration:1.6s}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-1.6px)}}
  #appleBob.wob{animation:wob .5s ease-in-out}
  @keyframes wob{0%,100%{transform:rotate(0)}30%{transform:rotate(-8deg)}65%{transform:rotate(6deg)}}
  #appleBob{transform-box:fill-box;transform-origin:50% 100%}

  /* ── 조작부 ── */
  .bar{background:linear-gradient(180deg,#2B2D31 0%,#1D1F22 100%);padding:12px 13px 11px;text-align:center;margin-top:6px;border-radius:2px}
  .time{font-size:26px;font-weight:800;letter-spacing:.3px;line-height:1.1;white-space:nowrap;
    color:#FFFFFF;font-variant-numeric:tabular-nums}
  .time .cs{font-size:14px;font-weight:700;color:#9CCB5A}

  .row{display:flex;gap:8px;justify-content:center;margin-top:10px}
  button{font-family:inherit;font-size:12.5px;font-weight:800;cursor:pointer;
    flex:1 1 0;min-width:0;max-width:88px;height:32px;border:0;border-radius:8px;color:#FFFFFF;
    transition:filter .18s,opacity .18s,transform .12s}
  button:hover:not(:disabled){filter:brightness(1.1);transform:translateY(-1px)}
  button:active:not(:disabled){transform:translateY(0)}
  button:disabled{opacity:.36;cursor:default}
  button:focus-visible{outline:2px solid #9CCB5A;outline-offset:3px}
  #b1{background:#78AA3C;color:#13220A}
  #b2{background:#6F8794}
  #b3{background:#B0302A}

  .lapline{margin-top:8px;min-height:12px;font-size:10px;font-weight:700;color:rgba(190,215,150,.8);
    font-variant-numeric:tabular-nums}

  @media (max-height:326px){
    .time{font-size:21px}
    .time .cs{font-size:12px}
    .bar{padding:9px 11px 10px}
  }
  @media (prefers-reduced-motion:reduce){
    .cloud,#appleBob,#apple{animation:none !important;transition:none !important}
  }
</style>
</head>
<body>
  <div class="frame">
    <svg class="art" viewBox="0 0 320 190" aria-hidden="true">
      <defs>
        <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#7F909A"/><stop offset="70%" stop-color="#AEB9BC"/><stop offset="100%" stop-color="#C6CCC8"/></linearGradient>
        <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#5D7472"/><stop offset="100%" stop-color="#7A908A"/></linearGradient>
        <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#9A9285"/><stop offset="100%" stop-color="#7C7468"/></linearGradient>
        <linearGradient id="coat" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0%" stop-color="#1E1F23"/><stop offset="45%" stop-color="#34363C"/><stop offset="100%" stop-color="#1A1B1E"/></linearGradient>
        <linearGradient id="hat" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0%" stop-color="#15161A"/><stop offset="40%" stop-color="#3A3C42"/><stop offset="100%" stop-color="#111215"/></linearGradient>
        <radialGradient id="appleG" cx=".38" cy=".34" r=".75">
          <stop offset="0%" stop-color="#C8E07A"/><stop offset="45%" stop-color="#86B442"/><stop offset="100%" stop-color="#4E7E26"/></radialGradient>
        <radialGradient id="skin" cx=".45" cy=".4" r=".7">
          <stop offset="0%" stop-color="#F0D2B8"/><stop offset="100%" stop-color="#D2A88A"/></radialGradient>
        <filter id="soft"><feGaussianBlur stdDeviation="3.2"/></filter>
      </defs>

      <!-- 흐린 하늘과 구름 -->
      <rect width="320" height="190" fill="url(#sky)"/>
      <g filter="url(#soft)" fill="#D9DEDC" opacity=".85">
        <g class="cloud"><ellipse cx="40" cy="40" rx="44" ry="11"/><ellipse cx="66" cy="32" rx="26" ry="10"/></g>
        <g class="cloud b"><ellipse cx="-20" cy="84" rx="50" ry="9"/><ellipse cx="6" cy="76" rx="28" ry="9"/></g>
        <g class="cloud" style="animation-delay:-26s"><ellipse cx="0" cy="18" rx="34" ry="8"/></g>
      </g>

      <!-- 바다와 수평선 -->
      <rect y="124" width="320" height="30" fill="url(#sea)"/>
      <path d="M0,124 H320" stroke="#4C625F" stroke-width="1"/>
      <g stroke="#9CB0AA" stroke-width="1" stroke-linecap="round" opacity=".55">
        <path d="M14,132 h14 M60,138 h10 M96,130 h12 M230,134 h16 M270,141 h10 M292,129 h12 M40,147 h12 M250,148 h12"/>
      </g>

      <!-- 낮은 돌담 -->
      <rect y="150" width="320" height="40" fill="url(#wall)"/>
      <rect y="150" width="320" height="4" fill="#B0A898"/>
      <g stroke="#6C665C" stroke-width=".8" opacity=".6">
        <path d="M0,170 H320 M40,154 V170 M110,154 V170 M230,154 V170 M290,154 V170 M70,170 V190 M260,170 V190"/>
      </g>

      <!-- 원작처럼 인물이 화면을 크게 채우도록 키운다 -->
      <g transform="translate(-40 -17) scale(1.25)">
      <!-- 사람: 검은 외투, 흰 셔츠, 붉은 넥타이 -->
      <g>
        <!-- 외투 몸통과 소매 -->
        <path d="M112,190 C112,150 108,118 116,104 C124,94 140,90 150,88 L170,88 C180,90 196,94 204,104 C212,118 208,150 208,190 Z" fill="url(#coat)"/>
        <path d="M116,104 C108,120 106,150 110,190 L122,190 C120,158 120,130 124,112 Z" fill="#17181B"/>
        <path d="M204,104 C212,120 214,150 210,190 L198,190 C200,158 200,130 196,112 Z" fill="#17181B"/>
        <!-- 한쪽 팔꿈치가 뒤로 꺾인 듯한 소매 주름 -->
        <path d="M200,128 C206,136 206,146 202,152" fill="none" stroke="#0E0F11" stroke-width="1.4"/>
        <path d="M120,130 C114,140 114,150 118,158" fill="none" stroke="#0E0F11" stroke-width="1.4"/>
        <!-- 셔츠와 넥타이 -->
        <path d="M150,88 L160,112 L170,88 Z" fill="#F4F2EC"/>
        <path d="M151,88 L160,98 L169,88 L166,86 L160,92 L154,86 Z" fill="#FFFFFF" stroke="#C9C6BE" stroke-width=".6"/>
        <path d="M157.6,94 L162.4,94 L161.4,98 L163.6,118 L160,123 L156.4,118 L158.6,98 Z" fill="#B42C24"/>
        <path d="M157.6,94 L162.4,94 L161.4,98 L158.6,98 Z" fill="#8E1E18"/>
        <!-- 옷깃 -->
        <path d="M150,88 C146,98 146,108 152,122 L160,112 Z" fill="#26272B" stroke="#0E0F11" stroke-width=".8"/>
        <path d="M170,88 C174,98 174,108 168,122 L160,112 Z" fill="#26272B" stroke="#0E0F11" stroke-width=".8"/>
        <circle cx="160" cy="140" r="1.6" fill="#0E0F11"/><circle cx="160" cy="160" r="1.6" fill="#0E0F11"/>
        <!-- 목과 귀 -->
        <rect x="153" y="78" width="14" height="12" fill="#D8AE90"/>
        <ellipse cx="140.6" cy="62" rx="3.2" ry="6" fill="#D9AF91"/>
        <ellipse cx="179.4" cy="62" rx="3.2" ry="6" fill="#D9AF91"/>
        <!-- 얼굴 (사과 뒤에 숨어 있다) -->
        <ellipse cx="160" cy="62" rx="18.6" ry="22" fill="url(#skin)"/>
        <g fill="#2A1E16">
          <ellipse cx="153" cy="58" rx="2.2" ry="1.4"/><ellipse cx="167" cy="58" rx="2.2" ry="1.4"/>
        </g>
        <path d="M150,54 q3,-1.6 6,0 M164,54 q3,-1.6 6,0" stroke="#5A4434" stroke-width="1" fill="none"/>
        <path d="M160,60 L158.6,68 L161.4,68.6" stroke="#B88A6C" stroke-width="1" fill="none"/>
        <path d="M155,75 Q160,76.6 165,75" stroke="#A0705A" stroke-width="1.2" fill="none"/>
        <!-- 중산모 -->
        <ellipse cx="160" cy="45" rx="27" ry="5.6" fill="#141518"/>
        <path d="M141,45 C140,30 148,20 160,20 C172,20 180,30 179,45 Z" fill="url(#hat)"/>
        <path d="M141.4,41 C152,43.6 168,43.6 178.6,41 L179,45 C168,47.4 152,47.4 141,45 Z" fill="#0C0D0F"/>
        <path d="M150,26 C154,23 160,22.4 164,23" stroke="#5A5C64" stroke-width="1.4" fill="none" stroke-linecap="round" opacity=".7"/>
      </g>

      <!-- 얼굴 앞에 뜬 초록 사과 -->
      <g id="apple">
        <g id="appleBob">
          <circle cx="160" cy="65" r="16.5" fill="url(#appleG)"/>
          <path d="M146,70 C148,80 156,82 162,81.6" stroke="#3E6A1E" stroke-width="1.2" fill="none" opacity=".5"/>
          <ellipse cx="153.6" cy="58.6" rx="4.2" ry="2.6" fill="#E8F2B8" opacity=".7" transform="rotate(-30 153.6 58.6)"/>
          <path d="M158,50.4 Q160,52.6 162,50.4" stroke="#3E6A1E" stroke-width="1.2" fill="none"/>
          <path d="M160,51 C160,46 161.6,43 164,41" stroke="#4A3220" stroke-width="1.8" fill="none" stroke-linecap="round"/>
          <path d="M161.4,46.4 C166,40 174,40 178,43 C172,47 166,48 161.4,46.4 Z" fill="#4E8A2E"/>
          <path d="M161.4,46.4 C166,44.4 172,43.6 178,43" stroke="#2E5A18" stroke-width=".7" fill="none"/>
          <path d="M159.4,47 C155,41 148,41.4 145,44.6 C150,48 155,48.6 159.4,47 Z" fill="#5E9A36"/>
          <path d="M159.4,47 C155,45.6 150,45 145,44.6" stroke="#2E5A18" stroke-width=".7" fill="none"/>
        </g>
      </g>
      </g>
    </svg>

    <div class="bar">
      <div class="time" id="t" role="timer">00:00:00<span class="cs">.00</span></div>
      <div class="row">
        <button id="b1" type="button">시작</button>
        <button id="b2" type="button" disabled>랩</button>
        <button id="b3" type="button" disabled>리셋</button>
      </div>
      <div class="lapline" id="lp" aria-live="polite"></div>
    </div>
  </div>

<script>
/* 랩을 찍으면 사과가 한 번 흔들린다 */
(function(){
  var a=document.getElementById('appleBob'),b2=document.getElementById('b2');
  function wob(){a.classList.remove('wob');void a.getBBox();a.classList.add('wob');setTimeout(function(){a.classList.remove('wob');},520);}
  b2.addEventListener('click',wob);
  document.addEventListener('keydown',function(e){if((e.key==='l'||e.key==='L')&&!b2.disabled&&!e.repeat)wob();});
})();
</script>
<script>
(function(){
  var t=document.getElementById('t'),lp=document.getElementById('lp'),
      b1=document.getElementById('b1'),b2=document.getElementById('b2'),b3=document.getElementById('b3');
  var run=false,stt=0,acc=0,iv=null,laps=[],last=0;
  function el(){return acc+(run?performance.now()-stt:0);}
  function pad(n,w){return String(n).padStart(w,'0');}
  function f(ms){if(ms<0)ms=0;var cs=Math.floor(ms/10)%100,s=Math.floor(ms/1000),ss=s%60,m=Math.floor(s/60),mm=m%60,hh=Math.floor(m/60);
    if(hh>99)hh=99;
    return pad(hh,2)+':'+pad(mm,2)+':'+pad(ss,2)+'<span class="cs">.'+pad(cs,2)+'</span>';}
  function plain(ms){if(ms<0)ms=0;var cs=Math.floor(ms/10)%100,s=Math.floor(ms/1000),ss=s%60,mm=Math.floor(s/60);
    return pad(mm,2)+':'+pad(ss,2)+'.'+pad(cs,2);}
  function draw(){t.innerHTML=f(el());}

  /* ── 접근성 공통 ──
     정지·초기화 결과를 스크린리더에 한 번씩 알린다. 시간 표시 자체는
     10ms마다 바뀌므로 라이브 리전으로 두지 않는다. */
  var srSay=(function(){
    var r=document.createElement('div');
    r.setAttribute('role','status'); r.setAttribute('aria-live','polite');
    r.style.cssText='position:absolute;width:1px;height:1px;margin:-1px;padding:0;'+
      'overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0';
    document.body.appendChild(r);
    return function(m){ r.textContent=''; setTimeout(function(){ r.textContent=m; },30); };
  })();
  function srHuman(ms){
    if(ms<0)ms=0;
    var cs=Math.floor(ms/10)%100, s=Math.floor(ms/1000), ss=s%60, mm=Math.floor(s/60);
    return (mm?mm+'분 ':'')+ss+'점'+String(cs).padStart(2,'0')+'초';
  }
  var srWasRun=false, srLast=0;
  function ui(){
    document.body.classList.toggle('go',run);
    b1.textContent=run?'정지':(el()>0?'재개':'시작');
    b2.disabled=!run; b3.disabled=run||el()===0;

    /* 정지와 초기화를 알리고, 방금 누른 버튼이 잠기면 포커스를 되돌린다 */
    var srE=el();
    if(srWasRun&&!run) srSay('정지. 경과 시간 '+srHuman(srE));
    else if(!srWasRun&&!run&&srLast>0&&srE===0) srSay('초기화했습니다');
    srWasRun=run; srLast=srE;
    if(document.activeElement&&document.activeElement.disabled) b1.focus();
  }
  function start(){if(run)return;run=true;stt=performance.now();if(!iv)iv=setInterval(draw,31);draw();ui();}
  function stop(){if(!run)return;acc=el();run=false;clearInterval(iv);iv=null;draw();ui();}
  function reset(){if(run)return;acc=0;stt=0;laps=[];last=0;lp.textContent='';draw();ui();}
  function lap(){if(!run)return;var e=el(),sp=e-last;last=e;laps.push(sp);
    var best=Math.min.apply(null,laps);
    lp.textContent='LAP '+laps.length+' · '+plain(sp)+(laps.length>1&&sp===best?' ★':'');
    srSay('랩 '+laps.length+'. 구간 '+srHuman(sp));}
  b1.addEventListener('click',function(){run?stop():start();});
  b2.addEventListener('click',lap);
  b3.addEventListener('click',reset);
  document.addEventListener('keydown',function(e){
    if(e.metaKey||e.ctrlKey||e.altKey||e.repeat)return;
    if(e.target&&e.target.tagName==='BUTTON'&&e.key===' ')return;
    if(e.key===' '){e.preventDefault();run?stop():start();}
    else if(e.key==='l'||e.key==='L'){lap();}
    else if(e.key==='r'||e.key==='R'){reset();}
  });
  document.addEventListener('visibilitychange',function(){if(!document.hidden&&run)draw();});
  window.addEventListener('pageshow',function(){if(run&&!iv)iv=setInterval(draw,31);});
  window.addEventListener('pagehide',function(){clearInterval(iv);iv=null;});
  draw();ui();
})();
</script>
</body>
</html>
