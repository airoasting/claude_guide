<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>오피셜 타임키퍼 스탑워치</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='16' fill='%230B1524'/><path d='M50 22l10 20 16-12-6 30H30l-6-30 16 12z' fill='%231FA34A'/></svg>" />
<style>
  @font-face{font-family:'Pretendard';src:url('../fonts/PretendardVariable.ttf') format('truetype');font-weight:100 900;font-display:swap;}
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overflow:hidden}
  :root{--green:#1FA34A;--green-lt:#35C766;--cream:#EEE7D3;--dim:#8B95A6;}
  body{font-family:'Pretendard',-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",sans-serif;color:var(--cream);
    position:relative;display:flex;align-items:center;justify-content:center;padding:10px;word-break:keep-all;
    background:radial-gradient(130% 80% at 50% 0%,#182A44 0%,#0B1524 46%,#050A14 100%)}

  /* 트랙 레인. 화면 양쪽에 스타디움 트랙을 살짝 비친다 */
  .track{position:absolute;inset:0;overflow:hidden;pointer-events:none;opacity:.55}
  .track svg{position:absolute;width:460px;height:460px;left:50%;top:50%;transform:translate(-50%,-44%)}
  .track circle{fill:none;stroke:#8A3B2E;stroke-width:14}
  .track .ln{stroke:#D9C9B4;stroke-width:1;opacity:.5}

  .glass{position:relative;width:min(300px,100%);padding:18px 14px 16px;border-radius:20px;text-align:center;
    background:linear-gradient(160deg,rgba(255,255,255,.10),rgba(255,255,255,.03));
    border:1px solid rgba(255,255,255,.16);
    box-shadow:0 22px 44px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.25);
    -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
  .glass::before{content:"";position:absolute;left:12%;right:12%;top:0;height:1px;
    background:linear-gradient(90deg,transparent,rgba(255,255,255,.6),transparent)}

  .crown{width:22px;height:18px;display:block;margin:0 auto 5px}
  .word{font-family:"Times New Roman",Georgia,serif;font-size:36px;font-weight:700;letter-spacing:7px;line-height:1;
    padding-left:7px;color:var(--cream);text-shadow:0 1px 0 rgba(0,0,0,.4)}
  .tag{margin-top:6px;font-size:8.5px;font-weight:600;letter-spacing:3.4px;color:#B9C1CE;padding-left:3px}
  .rings{display:flex;align-items:center;justify-content:center;gap:12px;margin-top:11px}
  .rings svg{width:56px;height:26px}
  .rings span{font-size:10px;font-weight:700;letter-spacing:4px;color:#D2D8E2;padding-left:4px}

  .time{margin-top:12px;font-size:50px;font-weight:300;letter-spacing:-.5px;line-height:1;
    font-variant-numeric:tabular-nums;color:#F7F2E4;text-shadow:0 0 22px rgba(238,231,211,.18)}
  .time .cs{font-size:24px;letter-spacing:0;color:#C9CFD8}
  .state{height:14px;margin-top:6px;font-size:10px;letter-spacing:2.5px;font-weight:600;color:var(--dim)}
  .state.on{color:var(--green-lt)}

  .row{display:flex;gap:8px;margin-top:12px}
  button{flex:1;height:38px;border:1px solid rgba(255,255,255,.12);border-radius:12px;cursor:pointer;
    font-family:inherit;font-size:13px;font-weight:700;color:#DCE1EA;
    background:rgba(255,255,255,.07);transition:all .16s}
  button:hover:not(:disabled){background:rgba(255,255,255,.13)}
  #b1{background:linear-gradient(180deg,#2FC060,#178F3E);border-color:rgba(255,255,255,.18);color:#F3FFF5;
    box-shadow:0 8px 20px rgba(31,163,74,.35)}
  #b1:hover{filter:brightness(1.06)}
  #b1.on{background:linear-gradient(180deg,#E25A4E,#B93A30);box-shadow:0 8px 20px rgba(226,90,78,.3)}
  button:disabled{opacity:.38;cursor:default}
  button:focus-visible{outline:2px solid var(--green-lt);outline-offset:3px}

  .lapline{height:14px;margin-top:10px;font-size:10.5px;color:#AEB6C4;font-variant-numeric:tabular-nums;letter-spacing:.2px}
  .lapline b{color:var(--cream);font-weight:700}
  .lapline em{font-style:normal;color:var(--green-lt);font-weight:700;margin-right:6px}
</style>
</head>
<body>
  <div class="track" aria-hidden="true">
    <svg viewBox="0 0 460 460">
      <circle cx="230" cy="230" r="196"/><circle cx="230" cy="230" r="180" class="ln"/><circle cx="230" cy="230" r="212" class="ln"/>
      <circle cx="230" cy="230" r="150"/><circle cx="230" cy="230" r="134" class="ln"/><circle cx="230" cy="230" r="166" class="ln"/>
    </svg>
  </div>

  <div class="glass">
    <svg class="crown" viewBox="0 0 44 36" aria-hidden="true">
      <path d="M22 4l6.5 13 11-8-4.5 21H9L4.5 9l11 8z" fill="#1FA34A"/>
      <circle cx="22" cy="3" r="2.6" fill="#1FA34A"/><circle cx="4.5" cy="8.5" r="2.2" fill="#1FA34A"/><circle cx="39.5" cy="8.5" r="2.2" fill="#1FA34A"/>
      <circle cx="13" cy="5.5" r="1.8" fill="#1FA34A"/><circle cx="31" cy="5.5" r="1.8" fill="#1FA34A"/>
      <rect x="9" y="31" width="26" height="2.6" rx="1" fill="#1FA34A"/>
    </svg>
    <div class="word">ROLEX</div>
    <div class="tag">OFFICIAL TIMEKEEPER</div>
    <div class="rings">
      <svg viewBox="0 0 120 56" aria-hidden="true" fill="none" stroke-width="5">
        <circle cx="22" cy="20" r="16" stroke="#0081C8"/><circle cx="60" cy="20" r="16" stroke="#F0F0F0"/><circle cx="98" cy="20" r="16" stroke="#EE334E"/>
        <circle cx="41" cy="35" r="16" stroke="#FCB131"/><circle cx="79" cy="35" r="16" stroke="#00A651"/>
      </svg>
      <span>STOPWATCH</span>
    </div>

    <div class="time" id="t" role="timer">00:00<span class="cs">.00</span></div>
    <div class="state" id="stt">READY</div>

    <div class="row">
      <button id="b2" type="button" disabled>랩</button>
      <button id="b1" type="button">시작</button>
      <button id="b3" type="button" disabled>초기화</button>
    </div>
    <div class="lapline" id="lp"></div>
  </div>

<script>
(function(){
  var t=document.getElementById('t'),stt=document.getElementById('stt'),lp=document.getElementById('lp'),
      b1=document.getElementById('b1'),b2=document.getElementById('b2'),b3=document.getElementById('b3');
  var run=false,st=0,acc=0,iv=null,laps=0,last=0;

  function el(){return acc+(run?performance.now()-st:0);}
  function pad(n){return String(n).padStart(2,'0');}
  function fmt(ms){var cs=Math.floor(ms/10)%100,s=Math.floor(ms/1000)%60,m=Math.min(Math.floor(ms/60000),99);
    return pad(m)+':'+pad(s)+'.'+pad(cs);}
  function draw(){var f=fmt(el());t.innerHTML=f.slice(0,5)+'<span class="cs">'+f.slice(5)+'</span>';}

  var srSay=(function(){
    var r=document.createElement('div');
    r.setAttribute('role','status');r.setAttribute('aria-live','polite');
    r.style.cssText='position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0';
    document.body.appendChild(r);
    return function(m){r.textContent='';setTimeout(function(){r.textContent=m;},30);};
  })();

  function ui(){
    b1.textContent=run?'정지':(acc>0?'재개':'시작');
    b1.classList.toggle('on',run);
    b2.disabled=!run;b3.disabled=run||el()===0;
    stt.textContent=run?'TIMING':(acc>0?'STOPPED':'READY');
    stt.classList.toggle('on',run);
    if(document.activeElement&&document.activeElement.disabled)b1.focus();
  }
  function go(){
    if(run){acc=el();run=false;clearInterval(iv);iv=null;draw();srSay('정지 '+fmt(acc));}
    else{st=performance.now();run=true;if(!iv)iv=setInterval(draw,31);}
    ui();
  }
  function lap(){
    if(!run)return;
    var e=el(),seg=e-last;last=e;laps++;
    lp.innerHTML='<em>LAP '+pad(laps)+'</em>구간 <b>'+fmt(seg)+'</b> &middot; 누적 <b>'+fmt(e)+'</b>';
  }
  function reset(){
    if(run)return;
    acc=0;st=0;laps=0;last=0;lp.textContent='';draw();ui();srSay('초기화했습니다');
  }

  b1.addEventListener('click',go);b2.addEventListener('click',lap);b3.addEventListener('click',reset);
  document.addEventListener('keydown',function(e){
    if(e.metaKey||e.ctrlKey||e.altKey||e.repeat)return;
    if(e.target&&e.target.tagName==='BUTTON'&&e.key===' ')return;
    if(e.key===' '){e.preventDefault();go();}
    else if(e.key==='l'||e.key==='L'){lap();}
    else if(e.key==='r'||e.key==='R'){reset();}
  });
  document.addEventListener('visibilitychange',function(){if(!document.hidden&&run)draw();});
  window.addEventListener('pageshow',function(){if(run&&!iv)iv=setInterval(draw,31);});
  window.addEventListener('pagehide',function(){clearInterval(iv);iv=null;});
  draw();ui();
})();
</script>
</body>
</html>
