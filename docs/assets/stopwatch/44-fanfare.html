<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>7초 챌린지 스탑워치</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='16' fill='%23161010'/><circle cx='50' cy='50' r='32' fill='none' stroke='%23F26A21' stroke-width='7'/></svg>" />
<style>
  @font-face{font-family:'Pretendard';src:url('../fonts/PretendardVariable.ttf') format('truetype');font-weight:100 900;font-style:normal;font-display:swap;}
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overflow:hidden}
  :root{
    --org:#F26A21;
    --org-lt:#F9A03F;
    --ink:#EFE7DF;
  }
  body{font-family:'Pretendard',-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",sans-serif;
    color:var(--ink);word-break:keep-all;position:relative;
    display:flex;flex-direction:column;align-items:center;justify-content:center;padding:10px;
    background:radial-gradient(115% 88% at 50% 34%,#2A1C14 0%,#171010 52%,#0B0707 100%)}

  /* ── 머리말 ── */
  .gear{position:absolute;right:10px;top:8px;width:26px;height:26px;padding:0;border-radius:50%;
    background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.14);cursor:pointer}
  .gear svg{width:14px;height:14px;display:block;margin:0 auto}
  .gear:hover{background:rgba(242,106,33,.2);border-color:rgba(242,106,33,.5)}

  .head{margin-top:8px;text-align:center;font-size:16.5px;font-weight:900;line-height:1.34;letter-spacing:-.2px}
  .head b{color:var(--org)}

  /* ── 다이얼 ── */
  .dial{position:relative;width:158px;height:158px;margin:10px 0 4px}
  .dial svg{display:block;width:100%;height:100%}
  .pill{position:absolute;left:50%;top:-9px;transform:translateX(-50%);display:flex;align-items:center;gap:5px;
    padding:3px 10px;border-radius:999px;background:#2A211C;border:1px solid rgba(255,255,255,.14);
    font-size:9.5px;font-weight:800;white-space:nowrap;color:#CFC2B6}
  .pill i{width:5px;height:5px;border-radius:50%;background:#8A7A6C}
  body.go .pill i{background:var(--org);animation:beat 1s ease-in-out infinite}
  body.win .pill{background:#1F3A24;border-color:rgba(96,200,120,.5);color:#8FE0A6}
  body.win .pill i{background:#60C878;animation:none}
  @keyframes beat{50%{opacity:.35}}

  .num{position:absolute;left:0;right:0;top:50%;transform:translateY(-56%);text-align:center;
    font-size:41px;font-weight:900;letter-spacing:-1px;line-height:1;font-variant-numeric:tabular-nums;
    color:#FFF8F2}
  .num .cs{font-size:22px;color:var(--org-lt)}
  .target{position:absolute;left:50%;bottom:26px;transform:translateX(-50%);padding:3px 11px;border-radius:999px;
    background:var(--org-lt);color:#2A1608;font-size:9.5px;font-weight:900;letter-spacing:.7px;white-space:nowrap}

  .result{height:16px;font-size:11px;font-weight:800;letter-spacing:.2px;color:#A9998C;
    font-variant-numeric:tabular-nums}
  .result.ok{color:#7BD894}
  .result.near{color:var(--org-lt)}

  /* ── 조작부 ── */
  .row{display:flex;gap:9px;align-items:center;margin-top:9px}
  button{font-family:inherit;cursor:pointer;transition:all .16s;border:0}
  #b2{font-size:12.5px;font-weight:800;padding:12px 0;width:92px;border-radius:999px;
    background:rgba(255,255,255,.06);color:#D8CBBF;border:1px solid rgba(255,255,255,.16)}
  #b2:hover:not(:disabled){background:rgba(255,255,255,.12)}
  #b1{font-size:15px;font-weight:900;letter-spacing:1.4px;padding:13px 0;width:150px;border-radius:999px;
    background:linear-gradient(180deg,#F9862F,#E0561A);color:#FFF6EF;
    box-shadow:0 8px 22px rgba(242,106,33,.34)}
  #b1:hover{transform:translateY(-1px);box-shadow:0 11px 26px rgba(242,106,33,.44)}
  button:disabled{opacity:.4;cursor:default;transform:none;box-shadow:none}
  button:focus-visible{outline:2px solid var(--org-lt);outline-offset:3px}

  /* ── 설정 ── */
  .set{position:absolute;right:10px;top:38px;z-index:9;width:176px;padding:11px;border-radius:12px;
    background:#221913;border:1px solid rgba(255,255,255,.16);box-shadow:0 14px 30px rgba(0,0,0,.55);
    display:none}
  .set.on{display:block}
  .set h3{font-size:10px;font-weight:800;letter-spacing:.6px;color:#A9998C;margin-bottom:8px}
  .set .line{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
  .set .line:last-child{margin-bottom:0}
  .set span{font-size:11px;font-weight:700;color:#E4D8CD}
  .stp{display:flex;align-items:center;gap:6px}
  .stp button{width:22px;height:22px;border-radius:6px;background:rgba(255,255,255,.09);color:#F0E4D8;
    font-size:13px;font-weight:900;line-height:1}
  .stp button:hover:not(:disabled){background:var(--org);color:#2A1608}
  .stp b{min-width:34px;text-align:center;font-size:12px;font-weight:900;color:var(--org-lt);
    font-variant-numeric:tabular-nums}
  #snd{padding:4px 10px;border-radius:999px;font-size:10.5px;font-weight:800;
    background:rgba(242,106,33,.22);color:var(--org-lt)}
  #snd.off{background:rgba(255,255,255,.08);color:#9A8B7E}

  /* ── 팡파레 ── */
  .conf{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:8}
  .conf i{position:absolute;top:-14px;width:7px;height:11px;border-radius:1px;opacity:0;
    animation:drop 1.5s cubic-bezier(.3,.6,.5,1) forwards}
  @keyframes drop{
    0%{opacity:1;transform:translateY(0) rotate(0)}
    100%{opacity:0;transform:translateY(380px) rotate(540deg)}}

  @media (prefers-reduced-motion: reduce){
    .pill i{animation:none !important}
    .conf i{animation-duration:.01s}
  }
</style>
</head>
<body>
  <button class="gear" id="gear" type="button" aria-label="이벤트 설정" aria-expanded="false">
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <path d="M12 8.6A3.4 3.4 0 1012 15.4 3.4 3.4 0 0012 8.6z" fill="none" stroke="#E4D8CD" stroke-width="1.8"/>
      <path d="M12 2.6l1.5 2.6 3-.4.5 3 2.7 1.4-1.4 2.8 1.4 2.8-2.7 1.4-.5 3-3-.4L12 21.4l-1.5-2.6-3 .4-.5-3-2.7-1.4L5.7 12 4.3 9.2 7 7.8l.5-3 3 .4z"
        fill="none" stroke="#E4D8CD" stroke-width="1.4" stroke-linejoin="round"/>
    </svg>
  </button>

  <div class="set" id="set">
    <h3>이벤트 설정</h3>
    <div class="line">
      <span>목표 시간</span>
      <span class="stp">
        <button id="mn" type="button" aria-label="목표 시간 줄이기">&minus;</button>
        <b id="tv">7초</b>
        <button id="pl" type="button" aria-label="목표 시간 늘리기">+</button>
      </span>
    </div>
    <div class="line">
      <span>성공 팡파레</span>
      <button id="snd" type="button" aria-pressed="true">소리 켬</button>
    </div>
  </div>

  <div class="head"><b id="hn">7초</b>에 정확히 멈추면<br>사은품이 팡!</div>

  <div class="dial">
    <svg viewBox="0 0 200 200" aria-hidden="true">
      <g id="ticks"></g>
      <circle cx="100" cy="100" r="88" fill="none" stroke="rgba(242,106,33,.24)" stroke-width="2"/>
      <circle id="arc" cx="100" cy="100" r="88" fill="none" stroke="#F26A21" stroke-width="3.4"
        stroke-linecap="round" transform="rotate(-90 100 100)"
        stroke-dasharray="0 553" />
    </svg>
    <div class="pill" id="pill"><i></i><span id="pt">준비</span></div>
    <div class="num" id="t" role="timer">00<span class="cs">.00</span></div>
    <div class="target" id="tg">TARGET 07.00</div>
  </div>

  <div class="result" id="rs"></div>

  <div class="row">
    <button id="b2" type="button" disabled>다시하기</button>
    <button id="b1" type="button">START</button>
  </div>

  <div class="conf" id="conf" aria-hidden="true"></div>

<script>
(function(){
  /* ── 눈금 ── */
  var g=document.getElementById('ticks'),NS='http://www.w3.org/2000/svg';
  for(var i=0;i<60;i++){
    var big=i%5===0,r1=big?78:79,r2=big?68:73,a=i*6*Math.PI/180;
    var ln=document.createElementNS(NS,'line');
    ln.setAttribute('x1',100+r1*Math.sin(a)); ln.setAttribute('y1',100-r1*Math.cos(a));
    ln.setAttribute('x2',100+r2*Math.sin(a)); ln.setAttribute('y2',100-r2*Math.cos(a));
    ln.setAttribute('stroke',big?'rgba(255,255,255,.5)':'rgba(255,255,255,.2)');
    ln.setAttribute('stroke-width',big?2.6:1.2);
    ln.setAttribute('stroke-linecap','round');
    g.appendChild(ln);
  }

  var t=document.getElementById('t'),rs=document.getElementById('rs'),pt=document.getElementById('pt'),
      arc=document.getElementById('arc'),tg=document.getElementById('tg'),hn=document.getElementById('hn'),
      b1=document.getElementById('b1'),b2=document.getElementById('b2'),
      gear=document.getElementById('gear'),set=document.getElementById('set'),
      mn=document.getElementById('mn'),pl=document.getElementById('pl'),tv=document.getElementById('tv'),
      snd=document.getElementById('snd'),conf=document.getElementById('conf');
  var run=false,st=0,acc=0,iv=null,target=7000,sound=true,done=false;
  var C=2*Math.PI*88;

  function el(){return acc+(run?performance.now()-st:0);}
  function pad(n,w){return String(n).padStart(w,'0');}
  function f(ms){if(ms<0)ms=0;var cs=Math.floor(ms/10)%100,s=Math.floor(ms/1000);
    if(s>99)s=99;
    return pad(s,2)+'<span class="cs">.'+pad(cs,2)+'</span>';}
  function draw(){
    var e=el();
    t.innerHTML=f(e);
    var p=Math.min(e/target,1);
    arc.setAttribute('stroke-dasharray',(C*p).toFixed(1)+' '+C.toFixed(1));
    arc.setAttribute('stroke',e>target?'#E0561A':'#F26A21');
  }
  function setTarget(sec){
    target=sec*1000;
    tv.textContent=sec+'초';
    hn.textContent=sec+'초';
    tg.textContent='TARGET '+pad(sec,2)+'.00';
    mn.disabled=sec<=3; pl.disabled=sec>=15;
  }

  /* ── 팡파레 ──
     성공한 순간에만 짧게 울린다. 소리는 설정에서 끌 수 있다. */
  function fanfare(){
    if(!sound)return;
    try{
      var AC=window.AudioContext||window.webkitAudioContext; if(!AC)return;
      var ac=new AC(),now=ac.currentTime,notes=[523.25,659.25,783.99,1046.5];
      notes.forEach(function(hz,i){
        var o=ac.createOscillator(),gn=ac.createGain(),at=now+i*0.09;
        o.type='triangle'; o.frequency.value=hz;
        gn.gain.setValueAtTime(0.0001,at);
        gn.gain.exponentialRampToValueAtTime(0.16,at+0.02);
        gn.gain.exponentialRampToValueAtTime(0.0001,at+(i===3?0.55:0.22));
        o.connect(gn); gn.connect(ac.destination); o.start(at); o.stop(at+0.7);
      });
      setTimeout(function(){ac.close();},1400);
    }catch(err){}
  }
  function confetti(){
    var cols=['#F26A21','#F9A03F','#FFD86B','#7BD894','#6FC3E8','#FFF3E6'];
    for(var i=0;i<26;i++){
      var s=document.createElement('i');
      s.style.left=(6+Math.random()*88)+'%';
      s.style.background=cols[i%cols.length];
      s.style.animationDelay=(Math.random()*0.35)+'s';
      s.style.animationDuration=(1.2+Math.random()*0.6)+'s';
      conf.appendChild(s);
    }
    setTimeout(function(){conf.innerHTML='';},2400);
  }

  var srSay=(function(){
    var r=document.createElement('div');
    r.setAttribute('role','status'); r.setAttribute('aria-live','polite');
    r.style.cssText='position:absolute;width:1px;height:1px;margin:-1px;padding:0;'+
      'overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0';
    document.body.appendChild(r);
    return function(m){ r.textContent=''; setTimeout(function(){ r.textContent=m; },30); };
  })();

  function ui(){
    document.body.classList.toggle('go',run);
    b1.textContent=run?'STOP':'START';
    b2.disabled=run||el()===0;
    pt.textContent=run?'측정 중':(done?(document.body.classList.contains('win')?'성공!':'다시 도전'):'준비');
    if(document.activeElement&&document.activeElement.disabled) b1.focus();
  }
  function start(){
    if(run)return;
    document.body.classList.remove('win');
    acc=0;st=performance.now();run=true;done=false;rs.textContent='';rs.className='result';
    if(!iv)iv=setInterval(draw,31);
    draw();ui();
  }
  function stop(){
    if(!run)return;
    acc=el();run=false;done=true;clearInterval(iv);iv=null;draw();
    /* 표시된 두 자리까지 목표와 같으면 성공이다 */
    var shown=Math.floor(acc/10)*10, diff=shown-target, ad=Math.abs(diff);
    var sec=(target/1000).toFixed(2);
    if(ad<10){
      document.body.classList.add('win');
      rs.textContent='정확히 '+sec+'초, 사은품 당첨!';rs.className='result ok';
      srSay('성공. 정확히 '+sec+'초입니다');
      confetti();fanfare();
    }else if(ad<=60){
      rs.textContent=(diff>0?'+':'-')+(ad/1000).toFixed(2)+'초 차이, 아깝습니다';rs.className='result near';
      srSay('아깝습니다. '+(ad/1000).toFixed(2)+'초 차이');
    }else{
      rs.textContent=(diff>0?'+':'-')+(ad/1000).toFixed(2)+'초 차이, 다시 도전';rs.className='result';
      srSay((ad/1000).toFixed(2)+'초 차이. 다시 도전하세요');
    }
    ui();
  }
  function reset(){
    if(run)return;
    acc=0;st=0;done=false;document.body.classList.remove('win');
    rs.textContent='';rs.className='result';conf.innerHTML='';
    draw();ui();srSay('초기화했습니다');
  }

  b1.addEventListener('click',function(){run?stop():start();});
  b2.addEventListener('click',reset);
  gear.addEventListener('click',function(){
    var on=set.classList.toggle('on');
    gear.setAttribute('aria-expanded',on?'true':'false');
  });
  mn.addEventListener('click',function(){setTarget(Math.max(3,target/1000-1));reset();});
  pl.addEventListener('click',function(){setTarget(Math.min(15,target/1000+1));reset();});
  snd.addEventListener('click',function(){
    sound=!sound;
    snd.textContent=sound?'소리 켬':'소리 끔';
    snd.classList.toggle('off',!sound);
    snd.setAttribute('aria-pressed',sound?'true':'false');
  });
  document.addEventListener('keydown',function(e){
    if(e.metaKey||e.ctrlKey||e.altKey||e.repeat)return;
    if(e.target&&e.target.tagName==='BUTTON'&&e.key===' ')return;
    if(e.key===' '){e.preventDefault();run?stop():start();}
    else if(e.key==='r'||e.key==='R'){reset();}
    else if(e.key==='Escape'){set.classList.remove('on');gear.setAttribute('aria-expanded','false');}
  });
  document.addEventListener('visibilitychange',function(){if(!document.hidden&&run)draw();});
  window.addEventListener('pageshow',function(){if(run&&!iv)iv=setInterval(draw,31);});
  window.addEventListener('pagehide',function(){clearInterval(iv);iv=null;});

  setTarget(7);draw();ui();
})();
</script>
</body>
</html>
