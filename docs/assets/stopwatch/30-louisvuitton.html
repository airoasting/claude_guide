<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>루이비통 모노그램 스탑워치</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='16' fill='%234E3823'/></svg>" />
<style>
  @font-face{font-family:'Pretendard';src:url('../fonts/PretendardVariable.ttf') format('truetype');font-weight:100 900;font-style:normal;font-display:swap;}
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overflow:hidden}
  :root{
    --canvas:#4E3823;
    --motif:#D9BE86;
    --leather:#D2B183;
    --ink:#3A2716;
    --gold:#C9A24A;
  }
  body{font-family:'Pretendard',-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
    color:var(--ink);position:relative;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:12px 12px 90px;
    background:var(--canvas)}

  /* 모노그램 캔버스 */
  .canvas{position:absolute;inset:0;pointer-events:none;opacity:.9}
  .canvas svg{width:100%;height:100%;display:block}
  /* 캔버스 위에 얹히는 빛 */
  body::after{content:'';position:absolute;inset:0;pointer-events:none;
    background:radial-gradient(120% 90% at 50% 8%,rgba(255,225,170,.18) 0%,transparent 58%),
               linear-gradient(180deg,transparent 55%,rgba(0,0,0,.34) 100%)}

  /* ── 가죽 태그 ── */
  .strap{position:relative;z-index:2;width:26px;height:34px;border-radius:4px;
    background:linear-gradient(90deg,#8B6A43,#C7A575 42%,#7E5F3B);
    box-shadow:0 2px 5px rgba(0,0,0,.42)}
  .strap::after{content:'';position:absolute;left:50%;bottom:5px;width:13px;height:13px;margin-left:-6.5px;
    border-radius:50%;background:radial-gradient(circle at 36% 30%,#F0DCA4,#A5822F);
    box-shadow:inset 0 0 0 1.5px rgba(90,66,20,.5),0 1px 2px rgba(0,0,0,.4)}

  .tag{position:relative;z-index:2;width:100%;max-width:212px;padding:20px 16px 16px;border-radius:14px;
    background:linear-gradient(165deg,#E3C495 0%,#D2B183 44%,#B8946099 100%),linear-gradient(#D2B183,#D2B183);
    box-shadow:0 14px 30px rgba(0,0,0,.42),inset 0 1px 0 rgba(255,240,210,.7);
    text-align:center}
  /* 스티치 */
  .tag::before{content:'';position:absolute;inset:7px;border-radius:9px;pointer-events:none;
    border:1.5px dashed rgba(94,64,32,.42)}
  /* 가죽 결 */
  .tag::after{content:'';position:absolute;inset:0;border-radius:14px;pointer-events:none;opacity:.5;
    background:repeating-linear-gradient(112deg,rgba(255,255,255,.05) 0 2px,transparent 2px 5px)}

  .plate{position:relative;z-index:1}
  .lbl{font-family:Georgia,'Times New Roman',serif;
    font-size:8.5px;font-weight:700;letter-spacing:3.4px;text-indent:3.4px;color:rgba(64,41,18,.9)}
  .time{font-family:Georgia,'Times New Roman',serif;margin-top:6px;
    font-size:26px;font-weight:400;letter-spacing:.4px;white-space:nowrap;line-height:1.08;
    font-variant-numeric:tabular-nums;color:var(--ink);
    text-shadow:0 1px 0 rgba(255,240,210,.7)}
  .time .cs{font-size:15px;color:#6B4E22}
  .rule{width:84px;height:1px;margin:9px auto 0;
    background:linear-gradient(90deg,transparent,rgba(120,88,44,.5),transparent)}
  .laps{text-align:center;margin-top:7px;min-height:13px;font-size:10px;font-weight:700;letter-spacing:.3px;
    color:rgba(58,39,18,.95);font-variant-numeric:tabular-nums}

  /* ── 조작부 ── */
  .row{position:absolute;left:0;right:0;bottom:34px;z-index:3;justify-content:center;display:flex;gap:9px}
  button{font-family:inherit;font-size:12.5px;font-weight:700;cursor:pointer;white-space:nowrap;
    padding:11px 0;width:77px;border-radius:10px;transition:all .18s;
    color:#F3E4C4;border:1.5px solid rgba(201,162,74,.75);background:rgba(28,18,8,.82);
    -webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);
    box-shadow:0 4px 12px rgba(0,0,0,.42)}
  button:disabled{opacity:1;color:rgba(243,228,196,.55);background:rgba(20,13,5,.95);
    border-color:rgba(201,162,74,.45);cursor:default}
  button:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
  button:hover:not(:disabled){background:rgba(28,18,8,.94);border-color:var(--gold)}
  #b1{background:linear-gradient(160deg,#E6C883,#B58F3E);color:#33220D;border-color:transparent;font-weight:800;
    box-shadow:0 5px 14px rgba(0,0,0,.38)}
  #b1:hover{background:linear-gradient(160deg,#F2D897,#C39C47);transform:translateY(-1px)}

  body.go .strap::after{box-shadow:inset 0 0 0 1.5px rgba(90,66,20,.5),0 0 10px rgba(240,210,130,.65)}
  body.go .tag{box-shadow:0 16px 34px rgba(0,0,0,.46),inset 0 1px 0 rgba(255,240,210,.85),0 0 0 1px rgba(201,162,74,.4)}
  @media (prefers-reduced-motion: reduce){
    *,*::before,*::after{animation-duration:.001ms !important;animation-iteration-count:1 !important;
      transition-duration:.001ms !important;scroll-behavior:auto !important}
  }
</style>
</head>
<body>
  <div class="canvas" aria-hidden="true">
    <svg viewBox="0 0 352 352" preserveAspectRatio="xMidYMid slice">
      <defs>
        <pattern id="mono" width="44" height="44" patternUnits="userSpaceOnUse">
          <!-- 네 잎 꽃 -->
          <g fill="#D9BE86" transform="translate(11,11)">
            <circle cx="0" cy="-5" r="3.2"/><circle cx="5" cy="0" r="3.2"/>
            <circle cx="0" cy="5" r="3.2"/><circle cx="-5" cy="0" r="3.2"/>
            <circle cx="0" cy="0" r="2.4"/>
          </g>
          <!-- 네 꼭짓점 별 -->
          <path transform="translate(33,11)" fill="#D9BE86"
                d="M0 -9 Q1.7 -1.7 9 0 Q1.7 1.7 0 9 Q-1.7 1.7 -9 0 Q-1.7 -1.7 0 -9 Z"/>
          <!-- 원 안의 꽃 -->
          <g transform="translate(33,33)">
            <circle r="9.2" fill="none" stroke="#D9BE86" stroke-width="1.7"/>
            <g fill="#D9BE86">
              <circle cx="0" cy="-3.4" r="2.2"/><circle cx="3.4" cy="0" r="2.2"/>
              <circle cx="0" cy="3.4" r="2.2"/><circle cx="-3.4" cy="0" r="2.2"/>
            </g>
          </g>
          <path transform="translate(11,33)" fill="#D9BE86"
                d="M0 -7.4 Q1.4 -1.4 7.4 0 Q1.4 1.4 0 7.4 Q-1.4 1.4 -7.4 0 Q-1.4 -1.4 0 -7.4 Z"/>
        </pattern>
      </defs>
      <rect width="352" height="352" fill="url(#mono)"/>
    </svg>
  </div>

  <div class="strap" aria-hidden="true"></div>

  <div class="tag">
    <div class="plate">
      <div class="lbl">MONOGRAM</div>
      <div class="time" id="t" role="timer">00:00:00<span class="cs">.00</span></div>
      <div class="rule" aria-hidden="true"></div>
      <div class="laps" id="lp" aria-live="polite"></div>
    </div>
  </div>

  <div class="row">
    <button id="b1" type="button">시작</button>
    <button id="b2" type="button" disabled>랩</button>
    <button id="b3" type="button" disabled>리셋</button>
  </div>

<script>
(function(){
  var t=document.getElementById('t'),b1=document.getElementById('b1'),b2=document.getElementById('b2'),
      b3=document.getElementById('b3'),lp=document.getElementById('lp');
  var run=false,st=0,acc=0,iv=null,laps=[],last=0;
  function el(){return acc+(run?performance.now()-st:0);}
  function pad(n,w){return String(n).padStart(w,'0');}
  function f(ms){if(ms<0)ms=0;var cs=Math.floor(ms/10)%100,s=Math.floor(ms/1000),ss=s%60,m=Math.floor(s/60),mm=m%60,hh=Math.floor(m/60);
    if(hh>99)hh=99;
    return pad(hh,2)+':'+pad(mm,2)+':'+pad(ss,2)+'<span class="cs">.'+pad(cs,2)+'</span>';}
  function plain(ms){if(ms<0)ms=0;var cs=Math.floor(ms/10)%100,s=Math.floor(ms/1000),ss=s%60,mm=Math.floor(s/60);
    return pad(mm,2)+':'+pad(ss,2)+'.'+pad(cs,2);}
  function draw(){t.innerHTML=f(el());}
  function ui(){
    document.body.classList.toggle('go',run);
    b1.textContent=run?'정지':(el()>0?'재개':'시작');
    b2.disabled=!run; b3.disabled=run||el()===0;
  }
  function start(){if(run)return;run=true;st=performance.now();if(!iv)iv=setInterval(draw,31);draw();ui();}
  function stop(){if(!run)return;acc=el();run=false;clearInterval(iv);iv=null;draw();ui();}
  function reset(){if(run)return;acc=0;st=0;laps=[];last=0;lp.textContent='';draw();ui();}
  function lap(){if(!run)return;var e=el(),sp=e-last;last=e;laps.push(sp);
    var best=Math.min.apply(null,laps);
    lp.textContent='LAP '+laps.length+'  +'+plain(sp)+(laps.length>1&&sp===best?'  ★ 최단':'');}
  b1.addEventListener('click',function(){run?stop():start();});
  b2.addEventListener('click',lap);
  b3.addEventListener('click',reset);
  document.addEventListener('keydown',function(e){
    if(e.target&&e.target.tagName==='BUTTON'&&e.key===' ')return;
    if(e.key===' '){e.preventDefault();run?stop():start();}
    else if(e.key==='l'||e.key==='L'){lap();}
    else if(e.key==='r'||e.key==='R'){reset();}
  });
  document.addEventListener('visibilitychange',function(){if(!document.hidden&&run)draw();});
  window.addEventListener('pageshow',function(){if(run&&!iv)iv=setInterval(draw,31);});
  window.addEventListener('pagehide',function(){clearInterval(iv);iv=null;});
  draw();ui();
})();
</script>
</body>
</html>
