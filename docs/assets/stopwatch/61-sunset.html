<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>선셋 프리웨이 스탑워치</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><defs><linearGradient id='s' x2='0' y2='1'><stop offset='0' stop-color='%23402060'/><stop offset='.6' stop-color='%23E0505A'/><stop offset='1' stop-color='%23FFC060'/></linearGradient></defs><rect width='100' height='100' fill='url(%23s)'/><circle cx='64' cy='66' r='20' fill='%23FFE7A0'/><path d='M0 74H100V100H0Z' fill='%231A0E1C'/><path d='M24 74C26 50 28 34 32 22' stroke='%231A0E1C' stroke-width='4' fill='none'/></svg>" />
<style>
  @font-face{font-family:'Pretendard';src:url('../fonts/PretendardVariable.ttf') format('truetype');font-weight:100 900;font-style:normal;font-display:swap;}
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overflow:hidden}
  body{font-family:'Pretendard',-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",sans-serif;
    background:#140A16;color:#fff;position:relative}
  .scene{position:absolute;inset:0;width:100%;height:100%;display:block}

  /* ── 흐르는 배경 ──
     같은 그림을 두 장 이어 붙여 360만큼 밀면 끊김 없이 돈다.
     먼 것일수록 느리다(산 → 빌딩 → 야자수 → 가로등 → 차선) */
  .mv{animation:scroll linear infinite;animation-play-state:paused}
  body.go .mv{animation-play-state:running}
  #hills{animation-duration:90s}
  #city{animation-duration:46s}
  #palms{animation-duration:3.4s}
  #posts{animation-duration:1.5s}
  #lanes{animation-duration:.42s}
  @keyframes scroll{to{transform:translateX(-360px)}}

  /* 차: 달리는 동안 바퀴가 돌고 차체가 미세하게 튄다 */
  .wheel{transform-box:fill-box;transform-origin:50% 50%;animation:spin .28s linear infinite;animation-play-state:paused}
  body.go .wheel{animation-play-state:running}
  @keyframes spin{to{transform:rotate(360deg)}}
  #carBody{animation:bob .16s ease-in-out infinite alternate;animation-play-state:paused}
  body.go #carBody{animation-play-state:running}
  @keyframes bob{to{transform:translateY(-.8px)}}
  #tail{opacity:.55;transition:opacity .2s}
  body.go #tail{opacity:1}
  .streak{opacity:0}
  body.go .streak{animation:streak .55s linear infinite}
  body.go .streak.b{animation-duration:.47s;animation-delay:.2s}
  body.go .streak.c{animation-duration:.63s;animation-delay:.36s}
  @keyframes streak{0%{transform:translateX(0);opacity:0}15%{opacity:.7}100%{transform:translateX(-380px);opacity:0}}

  /* ── HUD ── 굵은 기울임 글씨에 검은 외곽선 */
  .hud{position:absolute;top:10px;right:12px;text-align:right;pointer-events:none}
  .stars{display:flex;gap:3px;justify-content:flex-end}
  .stars svg{width:17px;height:17px;overflow:visible}
  .stars path{fill:rgba(255,255,255,.12);stroke:rgba(0,0,0,.75);stroke-width:2;stroke-linejoin:round;paint-order:stroke}
  .stars .on path{fill:#FFFFFF}
  .stars .new{animation:wanted .5s steps(1) 4}
  @keyframes wanted{0%{opacity:1}50%{opacity:.15}}
  .time{margin-top:3px;font-size:31px;font-weight:900;font-style:italic;letter-spacing:.5px;line-height:1;
    color:#7BD36B;font-variant-numeric:tabular-nums;white-space:nowrap;
    -webkit-text-stroke:5px #0B0B0B;paint-order:stroke fill;text-shadow:0 2px 0 rgba(0,0,0,.4)}
  .time .cs{font-size:19px}
  .split{margin-top:4px;font-size:11px;font-weight:800;font-style:italic;letter-spacing:.5px;color:#FFFFFF;
    font-variant-numeric:tabular-nums;-webkit-text-stroke:3px #0B0B0B;paint-order:stroke fill;min-height:14px}

  /* 랩을 누르면 화면 가운데에 큰 글씨가 떴다 사라진다 */
  .banner{position:absolute;left:0;right:0;top:34%;text-align:center;pointer-events:none;opacity:0}
  .banner b{display:block;font-size:30px;font-weight:900;font-style:italic;letter-spacing:1px;color:#F2C14E;
    -webkit-text-stroke:6px #0B0B0B;paint-order:stroke fill;text-shadow:0 3px 0 rgba(0,0,0,.35)}
  .banner span{display:block;margin-top:2px;font-size:13px;font-weight:800;color:#fff;font-variant-numeric:tabular-nums;
    -webkit-text-stroke:3.5px #0B0B0B;paint-order:stroke fill}
  .banner.show{animation:banner 1.9s ease-out}
  @keyframes banner{0%{opacity:0;transform:scale(1.25)}10%{opacity:1;transform:scale(1)}78%{opacity:1}100%{opacity:0}}

  /* 미니맵과 체력·방어 막대 */
  .radar{position:absolute;left:10px;bottom:18px;width:64px;height:64px;border-radius:50%;overflow:hidden;
    border:2px solid rgba(0,0,0,.7);box-shadow:0 2px 8px rgba(0,0,0,.5);background:#3E4A40}
  .radar svg{width:100%;height:100%;display:block}
  .bars{position:absolute;left:10px;bottom:8px;width:64px;display:flex;gap:2px}
  .bars i{flex:1;height:5px;background:rgba(0,0,0,.6);border:1px solid rgba(0,0,0,.8);position:relative;overflow:hidden}
  .bars i::after{content:"";position:absolute;inset:0;transform-origin:0 50%;transform:scaleX(var(--v,0))}
  #hp::after{background:#5DBB4E}
  #ar::after{background:#4FA6E0}

  .row{position:absolute;right:10px;bottom:10px;left:84px;display:flex;gap:6px}
  button{font-family:inherit;font-size:12px;font-weight:800;cursor:pointer;flex:1 1 0;min-width:0;height:30px;
    border:0;border-radius:3px;color:#fff;background:rgba(10,8,14,.72);
    box-shadow:inset 0 0 0 1px rgba(255,255,255,.14);transition:background .15s,opacity .15s,transform .1s}
  button:hover:not(:disabled){background:rgba(40,34,52,.85)}
  button:active:not(:disabled){transform:translateY(1px)}
  button:disabled{opacity:.4;cursor:default}
  button:focus-visible{outline:2px solid #F2C14E;outline-offset:2px}
  #b1{background:#F4F4F4;color:#0B0B0B;box-shadow:none}
  #b1:hover{background:#FFFFFF}

  @media (prefers-reduced-motion:reduce){
    .mv,.wheel,#carBody,body.go .streak,.stars .new,.banner.show{animation:none !important}
    .banner.show{opacity:1}
  }
</style>
</head>
<body>
  <svg class="scene" viewBox="0 0 360 360" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
    <defs>
      <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#2A1A4C"/>
        <stop offset=".3" stop-color="#6A2C6C"/>
        <stop offset=".5" stop-color="#C8475E"/>
        <stop offset=".64" stop-color="#F08A4C"/>
        <stop offset=".76" stop-color="#FFC66E"/>
      </linearGradient>
      <radialGradient id="sun" cx="50%" cy="50%" r="50%">
        <stop offset="0" stop-color="#FFF6CE"/><stop offset=".6" stop-color="#FFE08A"/><stop offset="1" stop-color="#FFB45A"/>
      </radialGradient>
      <radialGradient id="glow" cx="50%" cy="50%" r="50%">
        <stop offset="0" stop-color="#FFD27A" stop-opacity=".75"/><stop offset="1" stop-color="#FF8A4C" stop-opacity="0"/>
      </radialGradient>
      <linearGradient id="deck" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#3A2234"/><stop offset="1" stop-color="#22141F"/>
      </linearGradient>
      <linearGradient id="under" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#160B18"/><stop offset="1" stop-color="#0A050C"/>
      </linearGradient>
      <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#F7A36A"/><stop offset=".55" stop-color="#B8507A"/><stop offset="1" stop-color="#3A1E44"/>
      </linearGradient>
      <linearGradient id="paint" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#4A1E2E"/><stop offset=".5" stop-color="#22101C"/><stop offset="1" stop-color="#120810"/>
      </linearGradient>
      <!-- 야자수 한 그루 (밑동이 원점) -->
      <g id="palm">
        <path d="M-2,0 C0,-35 3,-70 7,-100 L9.5,-100 C5,-70 2.4,-35 2,0 Z"/>
        <g fill="none" stroke-width="2.4" stroke-linecap="round">
          <path d="M8,-100 Q22,-112 36,-96"/><path d="M8,-100 Q26,-102 32,-84"/>
          <path d="M8,-100 Q-8,-114 -22,-98"/><path d="M8,-100 Q-10,-102 -16,-84"/>
          <path d="M8,-100 Q14,-120 27,-119"/><path d="M8,-100 Q1,-120 -10,-121"/>
          <path d="M8,-100 Q16,-96 18,-80"/>
        </g>
      </g>
      <!-- 가로등 하나 -->
      <g id="post">
        <rect x="-1.4" y="-46" width="2.8" height="46"/>
        <path d="M0,-46 Q0,-52 10,-52 L16,-52" fill="none" stroke-width="2.2"/>
        <rect x="13" y="-54" width="8" height="3" rx="1"/>
      </g>
    </defs>

    <!-- 하늘과 해 -->
    <rect width="360" height="300" fill="url(#sky)"/>
    <circle cx="246" cy="196" r="90" fill="url(#glow)"/>
    <circle cx="246" cy="196" r="38" fill="url(#sun)"/>
    <g fill="#FFB27A" opacity=".55">
      <ellipse cx="80" cy="96" rx="70" ry="3"/><ellipse cx="150" cy="110" rx="56" ry="2.4"/>
      <ellipse cx="290" cy="122" rx="80" ry="3"/><ellipse cx="226" cy="146" rx="60" ry="2"/>
      <ellipse cx="60" cy="150" rx="46" ry="2"/>
    </g>

    <!-- 먼 산 -->
    <g id="hills" class="mv">
      <path id="hillPath" fill="#7C3A5E" opacity=".85" d="M0,206 C30,186 52,180 78,190 C104,200 120,176 150,172 C182,168 200,190 230,186 C262,182 280,166 312,176 C334,183 348,198 360,206 L360,240 L0,240 Z"/>
      <use href="#hillPath" x="360"/>
    </g>
    <!-- 도심 빌딩 실루엣 (스크립트가 채운다) -->
    <g id="city" class="mv"></g>

    <!-- 야자수 -->
    <g id="palms" class="mv" fill="#1C0E20" stroke="#1C0E20"></g>

    <!-- 고가 고속도로: 방호벽, 가로등, 노면, 아래 그늘 -->
    <rect x="0" y="234" width="360" height="15" fill="#2E1A2A"/>
    <rect x="0" y="234" width="360" height="2" fill="#F2A464" opacity=".75"/>
    <g id="posts" class="mv" fill="#160A18" stroke="#160A18"></g>
    <rect x="0" y="249" width="360" height="44" fill="url(#deck)"/>
    <g id="lanes" class="mv" fill="#E8C69A" opacity=".55"></g>
    <rect x="0" y="293" width="360" height="6" fill="#0E060F"/>
    <rect x="0" y="299" width="360" height="61" fill="url(#under)"/>

    <!-- 속도선 -->
    <g fill="#FFE2B8">
      <rect class="streak" x="360" y="252" width="34" height="1.6" rx=".8"/>
      <rect class="streak b" x="360" y="262" width="22" height="1.4" rx=".7"/>
      <rect class="streak c" x="360" y="276" width="40" height="1.6" rx=".8"/>
    </g>

    <!-- 스포츠카: 노을을 등지고 달린다 -->
    <ellipse cx="180" cy="287" rx="72" ry="4" fill="#000" opacity=".45"/>
    <g transform="translate(113 286) scale(1.15)">
      <g id="carBody">
        <path id="tail" d="M-26,-22 L0,-24 L0,-19 L-26,-19 Z" fill="#FF2A3A" opacity=".55" style="filter:blur(2px)"/>
        <!-- 낮은 쿠페: 긴 보닛, 가운데 실내, 짧은 트렁크 -->
        <path d="M2,-12 L1,-21 Q1,-25 6,-26 L22,-27.5 C30,-34 36,-40 44,-41 L62,-41.5 C68,-41 72,-37 80,-29.5 L106,-26 Q114,-25 116,-20 L116,-13 Q116,-11 113,-11 L105.5,-11 A11.5,11.5 0 0 0 82.5,-11 L35.5,-11 A11.5,11.5 0 0 0 12.5,-11 L4,-11 Q2,-11 2,-12 Z" fill="url(#paint)"/>
        <path d="M6,-26 L22,-27.5 C30,-34 36,-40 44,-41 L62,-41.5 C68,-41 72,-37 80,-29.5 L106,-26 Q112,-25.4 114.5,-22.5" fill="none" stroke="#FFB070" stroke-width="1.1" opacity=".85"/>
        <path d="M27.5,-28.6 C33,-33.5 38,-37.4 45,-38.6 L52,-38.8 L52,-29.4 Z" fill="url(#glass)"/>
        <path d="M55,-38.9 L62,-39.2 C66.5,-38.8 70.5,-35.6 75.5,-30 L55,-29.6 Z" fill="url(#glass)"/>
        <path d="M8,-20 L110,-21" stroke="#FF8A5A" stroke-width=".6" opacity=".5"/>
        <path d="M53.5,-29 V-13 M78,-28 V-14" stroke="#000" stroke-width=".6" opacity=".45"/>
        <path d="M38,-12.4 H80" stroke="#FF8A5A" stroke-width=".8" opacity=".35"/>
        <rect x="0" y="-24.5" width="3.6" height="4.6" rx="1" fill="#FF3344"/>
        <rect x="111.5" y="-23.6" width="4" height="3" rx="1" fill="#FFF2C0"/>
      </g>
      <g class="wheel">
        <circle cx="24" cy="-10" r="10" fill="#0B070C"/>
        <circle cx="24" cy="-10" r="6.4" fill="none" stroke="#7A6A80" stroke-width="1.4"/>
        <path d="M24,-16 V-4 M18,-10 H30 M19.8,-14.2 L28.2,-5.8 M28.2,-14.2 L19.8,-5.8" stroke="#7A6A80" stroke-width="1"/>
      </g>
      <g class="wheel">
        <circle cx="94" cy="-10" r="10" fill="#0B070C"/>
        <circle cx="94" cy="-10" r="6.4" fill="none" stroke="#7A6A80" stroke-width="1.4"/>
        <path d="M94,-16 V-4 M88,-10 H100 M89.8,-14.2 L98.2,-5.8 M98.2,-14.2 L89.8,-5.8" stroke="#7A6A80" stroke-width="1"/>
      </g>
    </g>
  </svg>

  <div class="hud" aria-hidden="true">
    <div class="stars" id="stars"></div>
    <div class="time" id="t">00:00<span class="cs">.00</span></div>
    <div class="split" id="sp"></div>
  </div>
  <div class="banner" id="bn" aria-hidden="true"><b id="bnT">LAP 01</b><span id="bnS"></span></div>

  <div class="radar" aria-hidden="true">
    <svg viewBox="-50 -50 100 100">
      <g id="map" stroke-linecap="round">
        <rect x="-80" y="-80" width="160" height="160" fill="#4A5648"/>
        <g fill="#56644F"><rect x="-70" y="-62" width="44" height="30"/><rect x="18" y="-46" width="36" height="40"/><rect x="-46" y="20" width="52" height="34"/></g>
        <path d="M-80,-20 H80 M-80,34 H80 M-30,-80 V80 M24,-80 V80 M-80,70 L70,-80" stroke="#9AA096" stroke-width="5" fill="none"/>
        <path d="M-80,-20 H80 M-80,34 H80 M-30,-80 V80 M24,-80 V80" stroke="#C9CCC4" stroke-width="2" fill="none"/>
        <path d="M0,0 L0,-20 L24,-20 L24,-80" stroke="#B05ED8" stroke-width="3.4" fill="none"/>
      </g>
      <path d="M0,-6 L5,6 L0,3 L-5,6 Z" fill="#FFFFFF" stroke="#000" stroke-width="1"/>
    </svg>
  </div>
  <div class="bars" aria-hidden="true"><i id="hp"></i><i id="ar"></i></div>

  <div class="row">
    <button id="b1" type="button">시작</button>
    <button id="b2" type="button" disabled>랩</button>
    <button id="b3" type="button" disabled>리셋</button>
  </div>

<script>
/* ── 배경 채우기 ──
   빌딩, 야자수, 가로등, 차선을 0~360 한 장과 360~720 한 장으로 똑같이 깐다.
   씨앗을 고정한 난수라 열 때마다 같은 도시가 나온다. */
(function(){
  var NS='http://www.w3.org/2000/svg',seed=23;
  function r(){seed=(seed*16807)%2147483647;return (seed-1)/2147483646;}
  function mk(tag,a,p){var e=document.createElementNS(NS,tag);for(var k in a)e.setAttribute(k,a[k]);p.appendChild(e);return e;}
  var city=document.getElementById('city'),one=[],x=0;
  while(x<360){var w=9+Math.floor(r()*14),down=(x>50&&x<150),h=down?40+r()*62:16+r()*30;
    one.push([x,w,h]);x+=w+(r()<.3?2:0);}
  /* 도심 한가운데 둥근 왕관 지붕의 탑 하나 */
  one.push([96,16,112,'crown']);
  [0,360].forEach(function(off){
    var g=mk('g',{transform:'translate('+off+' 0)'},city);
    one.forEach(function(b){
      var bx=b[0],bw=b[1],bh=b[2];
      if(b[3]==='crown'){mk('rect',{x:bx,y:236-bh,width:bw,height:bh,rx:7,fill:'#3A1C3C'},g);
        mk('rect',{x:bx+3,y:236-bh-6,width:bw-6,height:8,rx:3,fill:'#3A1C3C'},g);}
      else mk('rect',{x:bx,y:236-bh,width:bw,height:bh,fill:r()<.5?'#3A1C3C':'#45213F'},g);
      var n=Math.floor(bh/9);
      for(var i=0;i<n;i++)if(r()<.22)mk('rect',{x:(bx+2+r()*(bw-5)).toFixed(1),y:(236-bh+4+i*9).toFixed(1),width:2,height:2.4,fill:'#FFC77A',opacity:.75},g);
    });
  });
  var palms=document.getElementById('palms');
  [[20,1.05],[110,.82],[168,1.15],[262,.9],[318,1.0]].forEach(function(p){
    [0,360].forEach(function(off){mk('use',{href:'#palm',transform:'translate('+(p[0]+off)+' 236) scale('+p[1]+')'},palms);});
  });
  var posts=document.getElementById('posts');
  for(var px=40;px<720;px+=120)mk('use',{href:'#post',transform:'translate('+px+' 236)'},posts);
  for(var jx=0;jx<720;jx+=30)mk('rect',{x:jx,y:236,width:1.2,height:13,fill:'#1A0E1A',opacity:.8},posts);
  var lanes=document.getElementById('lanes');
  for(var lx=0;lx<720;lx+=40)mk('rect',{x:lx,y:269,width:20,height:2.2,rx:1},lanes);

  var stars=document.getElementById('stars');
  for(var s=0;s<5;s++){var sv=mk('svg',{viewBox:'0 0 24 24'},stars);
    mk('path',{d:'M12,2 L14.9,8.6 L22,9.3 L16.6,14 L18.2,21 L12,17.3 L5.8,21 L7.4,14 L2,9.3 L9.1,8.6 Z'},sv);}
})();
</script>
<script>
(function(){
  var t=document.getElementById('t'),sp=document.getElementById('sp'),stars=document.getElementById('stars').children,
      bn=document.getElementById('bn'),bnT=document.getElementById('bnT'),bnS=document.getElementById('bnS'),
      map=document.getElementById('map'),hp=document.getElementById('hp'),ar=document.getElementById('ar'),
      b1=document.getElementById('b1'),b2=document.getElementById('b2'),b3=document.getElementById('b3');
  var run=false,stt=0,acc=0,raf=0,laps=[],last=0;
  function el(){return acc+(run?performance.now()-stt:0);}
  function pad(n,w){return String(n).padStart(w,'0');}
  function plain(ms){if(ms<0)ms=0;var cs=Math.floor(ms/10)%100,s=Math.floor(ms/1000),ss=s%60,mm=Math.floor(s/60);
    return pad(mm,2)+':'+pad(ss,2)+'.'+pad(cs,2);}
  function draw(){
    var ms=el(),cs=Math.floor(ms/10)%100,s=Math.floor(ms/1000),ss=s%60,mm=Math.floor(s/60),hh=Math.floor(mm/60);
    t.innerHTML=(hh?pad(hh,2)+':'+pad(mm%60,2):pad(mm,2))+':'+pad(ss,2)+'<span class="cs">.'+pad(cs,2)+'</span>';
    /* 미니맵은 천천히 돌고, 초록 막대는 1분, 파란 막대는 현재 랩이 1분에 얼마나 찼는지 */
    map.setAttribute('transform','rotate('+(-(ms/1000)*6%360).toFixed(2)+')');
    hp.style.setProperty('--v',((ms%60000)/60000).toFixed(4));
    ar.style.setProperty('--v',Math.min(1,(ms-last)/60000).toFixed(4));
  }
  function loop(){draw();if(run)raf=requestAnimationFrame(loop);}
  function drawStars(fresh){for(var i=0;i<5;i++){stars[i].classList.toggle('on',i<laps.length);
    stars[i].classList.toggle('new',fresh&&i===laps.length-1);}}

  /* ── 접근성 공통 ──
     정지·초기화 결과를 스크린리더에 한 번씩 알린다. 시간 표시 자체는
     10ms마다 바뀌므로 라이브 리전으로 두지 않는다. */
  var srSay=(function(){
    var r=document.createElement('div');
    r.setAttribute('role','status'); r.setAttribute('aria-live','polite');
    r.style.cssText='position:absolute;width:1px;height:1px;margin:-1px;padding:0;'+
      'overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0';
    document.body.appendChild(r);
    return function(m){ r.textContent=''; setTimeout(function(){ r.textContent=m; },30); };
  })();
  function srHuman(ms){
    if(ms<0)ms=0;
    var cs=Math.floor(ms/10)%100, s=Math.floor(ms/1000), ss=s%60, mm=Math.floor(s/60);
    return (mm?mm+'분 ':'')+ss+'점'+String(cs).padStart(2,'0')+'초';
  }
  var srWasRun=false, srLast=0;
  function ui(){
    document.body.classList.toggle('go',run);
    b1.textContent=run?'정지':(el()>0?'재개':'시작');
    b2.disabled=!run; b3.disabled=run||el()===0;

    /* 정지와 초기화를 알리고, 방금 누른 버튼이 잠기면 포커스를 되돌린다 */
    var srE=el();
    if(srWasRun&&!run) srSay('정지. 경과 시간 '+srHuman(srE));
    else if(!srWasRun&&!run&&srLast>0&&srE===0) srSay('초기화했습니다');
    srWasRun=run; srLast=srE;
    if(document.activeElement&&document.activeElement.disabled) b1.focus();
  }
  function banner(title,sub){bnT.textContent=title;bnS.textContent=sub;
    bn.classList.remove('show');void bn.offsetWidth;bn.classList.add('show');}
  function start(){if(run)return;run=true;stt=performance.now();cancelAnimationFrame(raf);raf=requestAnimationFrame(loop);ui();}
  function stop(){if(!run)return;acc=el();run=false;cancelAnimationFrame(raf);draw();ui();}
  function reset(){if(run)return;acc=0;stt=0;laps=[];last=0;sp.textContent='';drawStars(false);
    bn.classList.remove('show');draw();ui();}
  function lap(){if(!run)return;var e=el(),d=e-last;last=e;laps.push(d);
    var best=Math.min.apply(null,laps),isBest=laps.length>1&&d===best;
    drawStars(laps.length<=5);
    sp.textContent='LAP '+pad(laps.length,2)+' · '+plain(d)+(isBest?' ★':'');
    banner('LAP '+pad(laps.length,2),plain(d)+(isBest?'  BEST':''));
    srSay('랩 '+laps.length+'. 구간 '+srHuman(d));}
  b1.addEventListener('click',function(){run?stop():start();});
  b2.addEventListener('click',lap);
  b3.addEventListener('click',reset);
  document.addEventListener('keydown',function(e){
    if(e.metaKey||e.ctrlKey||e.altKey||e.repeat)return;
    if(e.target&&e.target.tagName==='BUTTON'&&e.key===' ')return;
    if(e.key===' '){e.preventDefault();run?stop():start();}
    else if(e.key==='l'||e.key==='L'){lap();}
    else if(e.key==='r'||e.key==='R'){reset();}
  });
  document.addEventListener('visibilitychange',function(){if(!document.hidden&&run){cancelAnimationFrame(raf);raf=requestAnimationFrame(loop);}});
  drawStars(false);draw();ui();
})();
</script>
</body>
</html>
