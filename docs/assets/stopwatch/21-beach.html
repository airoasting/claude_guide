<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>여름 해변 스탑워치</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏖️</text></svg>" />
<style>
  @font-face{font-family:'Pretendard';src:url('../fonts/PretendardVariable.ttf') format('truetype');font-weight:100 900;font-style:normal;font-display:swap;}
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overflow:hidden}
  body{font-family:'Pretendard',-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
    position:relative;overflow:hidden;color:#3a4a58;
    display:flex;align-items:center;justify-content:center;padding:14px;
    background:linear-gradient(180deg,#9DD6F0 0%,#BCE6F7 100%)}
  /* ── 풍경 레이어 ── */
  .sun{position:absolute;top:7%;right:9%;width:52px;height:52px;border-radius:50%;
    background:radial-gradient(circle at 42% 38%,#FFE38A,#F7C94A 70%);
    box-shadow:0 0 26px rgba(255,214,90,.75)}
  .cloud{position:absolute;background:#fff;border-radius:40px;opacity:.92}
  .cloud::before,.cloud::after{content:'';position:absolute;background:#fff;border-radius:50%}
  .c1{top:11%;left:9%;width:64px;height:20px}
  .c1::before{width:26px;height:26px;top:-13px;left:11px}
  .c1::after{width:19px;height:19px;top:-9px;left:32px}
  .c2{top:24%;left:56%;width:46px;height:15px}
  .c2::before{width:19px;height:19px;top:-9px;left:8px}
  .c2::after{width:14px;height:14px;top:-6px;left:24px}
  .sea{position:absolute;left:0;right:0;top:46%;bottom:0;
    background:linear-gradient(180deg,#3E8FC7 0%,#2E6FA8 100%)}

  /* 수면 너울: 사인파 두 겹이 서로 다른 속도로 흘러간다 */
  .swell{position:absolute;left:0;width:200%;pointer-events:none;animation:roll 7s linear infinite}
  .swell svg{width:100%;height:100%;display:block}
  .swell.back{top:-17px;height:26px;opacity:.72;animation-duration:9.5s}
  .swell.front{top:-10px;height:19px;animation-duration:6s;animation-direction:reverse}
  @keyframes roll{to{transform:translateX(-50%)}}

  /* 수면 윤슬 (빛이 스치는 가는 선) */
  .glint{position:absolute;left:-30px;right:-30px;height:2px;border-radius:2px;pointer-events:none;
    background:repeating-linear-gradient(90deg,rgba(255,255,255,.6) 0 13px,transparent 13px 34px);
    animation:glide 9s linear infinite}
  .g1{top:16%;opacity:.5;animation-duration:11s}
  .g2{top:31%;opacity:.66;animation-duration:8s;animation-direction:reverse}
  .g3{top:52%;height:3px;opacity:.5;animation-duration:6s}
  @keyframes glide{to{background-position-x:34px}}

  body.go .swell.back{animation-duration:4.6s}
  body.go .swell.front{animation-duration:2.9s}
  body.go .g1{animation-duration:5.4s}
  body.go .g2{animation-duration:4s}
  body.go .g3{animation-duration:2.9s}

  .sand{position:absolute;left:0;right:0;bottom:0;height:17%;background:linear-gradient(180deg,#E8CF9E 0%,#DDBE85 100%)}
  /* 물거품이 모래를 적셨다 물러난다 */
  .surf{position:absolute;left:0;right:0;top:-14px;height:22px;pointer-events:none;overflow:hidden;
    animation:wash 5.4s ease-in-out infinite}
  .surf-in{position:absolute;left:0;top:0;width:200%;height:100%;animation:roll 5s linear infinite}
  .surf-in svg{width:100%;height:100%;display:block}
  @keyframes wash{
    0%,100%{transform:translateY(8px) scaleY(.6);opacity:.5}
    46%{transform:translateY(-4px) scaleY(1.15);opacity:.95}
  }
  body.go .surf{animation-duration:2.9s}
  body.go .surf-in{animation-duration:2.4s}
  .critter{position:absolute;font-size:26px;line-height:1;
    filter:drop-shadow(0 2px 3px rgba(140,110,60,.3))}
  .cr1{left:9%;bottom:6%}
  .cr2{left:45%;bottom:14%;font-size:22px}
  .cr3{right:11%;bottom:7%}
  body.go .cr1{animation:scuttle 1.9s ease-in-out infinite}
  body.go .cr3{animation:scuttle 2.3s ease-in-out infinite reverse}
  @keyframes scuttle{0%,100%{transform:translateX(0) rotate(0)}50%{transform:translateX(9px) rotate(-6deg)}}
  /* ── 유리 카드 ── */
  .panel{position:relative;z-index:2;width:100%;max-width:296px;padding:22px 16px 18px;border-radius:22px;
    background:rgba(255,255,255,.34);border:1px solid rgba(255,255,255,.55);
    -webkit-backdrop-filter:blur(7px);backdrop-filter:blur(7px);
    box-shadow:0 12px 30px rgba(40,90,130,.18);
    display:flex;flex-direction:column;align-items:center;gap:14px}
  .time{font-variant-numeric:tabular-nums;font-weight:800;font-size:37px;letter-spacing:.5px;color:#243B50}
  .time .cs{font-size:21px;color:#3E6E96}
  /* ── 해파리 버튼 ── */
  .row{display:flex;gap:14px}
  .laps{min-height:15px;font-size:11.5px;font-weight:700;letter-spacing:.3px;
    color:#2E4A62;font-variant-numeric:tabular-nums;text-align:center}
  button{position:relative;width:64px;height:66px;border:none;background:none;cursor:pointer;padding:0;
    transition:transform .08s,opacity .15s;filter:drop-shadow(0 5px 6px rgba(40,80,110,.22))}
  button:active{transform:translateY(3px)}
  button:disabled{opacity:.6;cursor:default}
  button:focus-visible{outline:3px solid #2E4A62;outline-offset:3px;border-radius:12px}
  button svg{width:100%;height:100%;display:block}
  button .lbl{position:absolute;left:0;right:0;bottom:22px;font-family:inherit;
    font-size:12px;font-weight:800;text-align:center;pointer-events:none}
  #b1 .lbl{color:#2E6B48}#b2 .lbl{color:#8A3226}#b3 .lbl{color:#2A4E86}
  body.go button .jelly{transform-origin:50% 100%}
  body.go #b2 .jelly{animation:jellySway 1.6s ease-in-out infinite}
  @keyframes jellySway{0%,100%{transform:rotate(-2deg)}50%{transform:rotate(2deg)}}
  @media (prefers-reduced-motion: reduce){
    .swell,.glint,.surf,.surf-in,.critter,body.go #b2 .jelly{animation:none !important}
  }
  button:hover:not(:disabled){filter:brightness(1.1)}
</style>
</head>
<body>
  <div class="sun" aria-hidden="true"></div>
  <div class="cloud c1" aria-hidden="true"></div>
  <div class="cloud c2" aria-hidden="true"></div>
  <div class="sea" aria-hidden="true">
    <div class="swell back">
      <svg viewBox="0 0 240 26" preserveAspectRatio="none">
        <path d="M0 16 q15 -10 30 0 t30 0 t30 0 t30 0 t30 0 t30 0 t30 0 t30 0 V26 H0 Z" fill="#69B0DC"/>
      </svg>
    </div>
    <div class="swell front">
      <svg viewBox="0 0 240 19" preserveAspectRatio="none">
        <path d="M0 11 q15 -8 30 0 t30 0 t30 0 t30 0 t30 0 t30 0 t30 0 t30 0 V19 H0 Z" fill="#3E8FC7"/>
      </svg>
    </div>
    <span class="glint g1"></span><span class="glint g2"></span><span class="glint g3"></span>
  </div>
  <div class="sand" aria-hidden="true">
    <div class="surf"><div class="surf-in">
      <svg viewBox="0 0 240 22" preserveAspectRatio="none">
        <path d="M0 12 q15 -9 30 0 t30 0 t30 0 t30 0 t30 0 t30 0 t30 0 t30 0 V22 H0 Z" fill="rgba(255,255,255,.9)"/>
      </svg>
    </div></div>
    <span class="critter cr1">🦀</span>
    <span class="critter cr2">🐚</span>
    <span class="critter cr3">🦀</span>
  </div>

  <div class="panel">
    <div class="time"><span id="t">00:00:00<span class="cs">.00</span></span></div>
    <div class="row">
      <button id="b1" aria-label="시작">
        <svg viewBox="0 0 64 66" aria-hidden="true"><g class="jelly">
          <path d="M8 40 A24 27 0 0 1 56 40 L52 46 L46 41 L40 47 L32 41 L24 47 L18 41 L12 46 Z" fill="#BFE3C9" stroke="#7FBF93" stroke-width="2"/>
          <path d="M32 14 L20 42 M32 14 L32 43 M32 14 L44 42" stroke="#8FCBA1" stroke-width="1.6" fill="none"/>
        </g></svg><span class="lbl">시작</span>
      </button>
      <button id="b2" aria-label="랩" disabled>
        <svg viewBox="0 0 64 66" aria-hidden="true"><g class="jelly">
          <path d="M8 40 A24 27 0 0 1 56 40 L52 46 L46 41 L40 47 L32 41 L24 47 L18 41 L12 46 Z" fill="#F5B3AC" stroke="#DE7A6C" stroke-width="2"/>
          <path d="M32 14 L20 42 M32 14 L32 43 M32 14 L44 42" stroke="#E8938A" stroke-width="1.6" fill="none"/>
        </g></svg><span class="lbl">랩</span>
      </button>
      <button id="b3" aria-label="리셋" disabled>
        <svg viewBox="0 0 64 66" aria-hidden="true"><g class="jelly">
          <path d="M8 40 A24 27 0 0 1 56 40 L52 46 L46 41 L40 47 L32 41 L24 47 L18 41 L12 46 Z" fill="#BBD4F2" stroke="#7FA6D9" stroke-width="2"/>
          <path d="M32 14 L20 42 M32 14 L32 43 M32 14 L44 42" stroke="#93B8E4" stroke-width="1.6" fill="none"/>
        </g></svg><span class="lbl">리셋</span>
      </button>
    </div>
    <div class="laps" id="lp" aria-live="polite"></div>
  </div>
<script>
(function(){
  var t=document.getElementById('t'),b1=document.getElementById('b1'),b2=document.getElementById('b2'),
      b3=document.getElementById('b3'),lp=document.getElementById('lp');
  var run=false,st=0,acc=0,iv=null,laps=[],last=0;
  function el(){return acc+(run?performance.now()-st:0);}
  function pad(n){return String(n).padStart(2,'0');}
  function f(ms){if(ms<0)ms=0;var c=Math.floor(ms/10),cc=c%100,s2=Math.floor(c/100),ss=s2%60,m=Math.floor(s2/60),mm=m%60,hh=Math.floor(m/60);
    if(hh>99)hh=99;
    return pad(hh)+':'+pad(mm)+':'+pad(ss)+'<span class="cs">.'+pad(cc)+'</span>';}
  function plain(ms){if(ms<0)ms=0;var c=Math.floor(ms/10),cc=c%100,s2=Math.floor(c/100),ss=s2%60,mm=Math.floor(s2/60);
    return pad(mm)+':'+pad(ss)+'.'+pad(cc);}
  function draw(){t.innerHTML=f(el());}
  function ui(){
    document.body.classList.toggle('go',run);
    var lbl=run?'정지':(el()>0?'재개':'시작');
    b1.querySelector('.lbl').textContent=lbl; b1.setAttribute('aria-label',lbl);
    b2.disabled=!run; b3.disabled=run||el()===0;
  }
  function start(){if(run)return;run=true;st=performance.now();if(!iv)iv=setInterval(draw,31);draw();ui();}
  function stop(){if(!run)return;acc=el();run=false;clearInterval(iv);iv=null;draw();ui();}
  function reset(){if(run)return;acc=0;st=0;laps=[];last=0;lp.textContent='';draw();ui();}
  function lap(){if(!run)return;var e=el(),sp=e-last;last=e;laps.push(sp);
    var best=Math.min.apply(null,laps);
    lp.textContent='LAP '+laps.length+'  +'+plain(sp)+(laps.length>1&&sp===best?'  \u2605 \ucd5c\ub2e8':'');}
  b1.addEventListener('click',function(){run?stop():start();});
  b2.addEventListener('click',lap);
  b3.addEventListener('click',reset);
  document.addEventListener('keydown',function(e){
    if(e.target&&e.target.tagName==='BUTTON'&&e.key===' ')return;
    if(e.key===' '){e.preventDefault();run?stop():start();}
    else if(e.key==='l'||e.key==='L'){lap();}
    else if(e.key==='r'||e.key==='R'){reset();}
  });
  window.addEventListener('pageshow',function(){if(run&&!iv)iv=setInterval(draw,31);});
  window.addEventListener('pagehide',function(){clearInterval(iv);iv=null;});
  document.addEventListener('visibilitychange',function(){if(!document.hidden&&run)draw();});
  draw();ui();
})();
</script>
</body>
</html>
