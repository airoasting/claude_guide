<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>오렌지 크로노그래프</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⌚</text></svg>" />
<style>
  @font-face{font-family:'Pretendard';src:url('../fonts/PretendardVariable.ttf') format('truetype');font-weight:100 900;font-style:normal;font-display:swap;}
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{font-family:'Pretendard',-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
    color:#FFF3EA;overflow:hidden;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:11px;padding:12px 12px 90px;
    background:radial-gradient(120% 100% at 50% 18%,#FF8A3C 0%,#F2681F 42%,#D8500F 100%)}

  /* ── 스틸 케이스 ── */
  .case{position:relative;width:184px;height:188px;padding:15px;flex-shrink:0;
    border-radius:44px/48px;
    background:linear-gradient(148deg,#FBFCFD 0%,#C3C9D0 20%,#F1F4F7 38%,#98A0A9 58%,#E4E9ED 76%,#8C949D 100%);
    box-shadow:0 12px 28px rgba(96,32,0,.34),0 2px 0 rgba(255,255,255,.55) inset,0 -2px 6px rgba(0,0,0,.18) inset}
  /* 푸셔 */
  .push{position:absolute;right:-7px;width:9px;height:26px;border-radius:4px;
    background:linear-gradient(90deg,#A8B0B8,#EDF1F4 40%,#8B939B);
    box-shadow:1px 1px 3px rgba(90,30,0,.35)}
  .push.p1{top:44px}
  .push.p2{top:110px}
  body.go .push.p1{transform:translateX(2px)}
  .push{transition:transform .12s}

  /* ── 다이얼 ── */
  .dial{position:relative;width:154px;height:158px;border-radius:32px/34px;overflow:hidden;
    background:
      repeating-linear-gradient(180deg,rgba(255,255,255,.055) 0 1px,transparent 1px 4px),
      radial-gradient(120% 100% at 50% 0%,#2B3E5C 0%,#1B2A42 52%,#101B2C 100%);
    box-shadow:inset 0 0 0 1px rgba(255,255,255,.14),inset 0 6px 16px rgba(0,0,0,.45);
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}

  .idx span{position:absolute;left:50%;top:9px;width:2.6px;height:9px;margin-left:-1.3px;border-radius:1.5px;
    background:#F0F3F6;box-shadow:0 0 3px rgba(0,0,0,.4);transform-origin:50% 70px}
  .idx span.g{background:linear-gradient(180deg,#E6C87A,#B58F3E);width:9px;height:3px;margin-left:-4.5px;
    border-radius:1.5px;top:12px;transform-origin:50% 67px}

  .hand{position:absolute;left:50%;top:22px;width:1.6px;height:57px;margin-left:-.8px;
    background:linear-gradient(180deg,#FF6B4A,#C9381C);border-radius:1px;transform-origin:50% 100%;
    box-shadow:0 0 4px rgba(255,90,60,.5);z-index:2}
  .pivot{position:absolute;left:50%;top:75.5px;width:7px;height:7px;margin-left:-3.5px;border-radius:50%;
    background:radial-gradient(circle at 35% 30%,#F6DFA8,#B58F3E);z-index:3;box-shadow:0 1px 2px rgba(0,0,0,.5)}

  .dtxt{position:relative;z-index:1;text-align:center;margin-top:-16px}
  .dtxt .l1{font-size:8px;font-weight:800;letter-spacing:2.2px;text-indent:2.2px;color:rgba(226,236,248,.82)}
  .dtxt .l2{font-size:7px;font-weight:700;letter-spacing:1.8px;text-indent:1.8px;color:#C9A24A;margin-top:1px}
  .time{position:relative;z-index:4;margin-top:14px;font-size:22px;font-weight:700;letter-spacing:.6px;
    white-space:nowrap;font-variant-numeric:tabular-nums;color:#FFFFFF;text-shadow:0 1px 3px rgba(0,0,0,.55)}
  .time .cs{font-size:13px;font-weight:600;color:#E9B77A}

  /* ── 조작부 ── */
  .row{position:absolute;left:0;right:0;bottom:34px;z-index:3;justify-content:center;display:flex;gap:9px;align-items:center}
  button{font-family:inherit;font-size:12.5px;font-weight:700;cursor:pointer;white-space:nowrap;
    padding:11.5px 0;width:76px;border-radius:16px;transition:all .17s;
    color:#7A2C08;border:1px solid rgba(255,240,228,.85);background:rgba(255,255,255,.86)}
  button:disabled{opacity:1;color:rgba(96,34,4,.86);background:rgba(255,255,255,.68);
    border-color:rgba(255,240,228,.6);cursor:default}
  button:focus-visible{outline:2px solid #FFF;outline-offset:2px}
  button:hover:not(:disabled){background:#FFFFFF}
  #b1{background:linear-gradient(160deg,#FBEEE0,#EFD6BE);color:#8A3208;border-color:transparent;font-weight:800;
    box-shadow:0 4px 14px rgba(110,38,0,.3)}
  #b1:hover{background:linear-gradient(160deg,#FFF7EE,#F5E1CC);transform:translateY(-1px)}

  .laps{position:absolute;left:0;right:0;bottom:14px;z-index:3;text-align:center;min-height:15px;font-size:11px;font-weight:600;letter-spacing:.3px;
    color:#FFFFFF;text-shadow:0 1px 3px rgba(120,40,0,.8);font-variant-numeric:tabular-nums}

  @media (prefers-reduced-motion: reduce){.hand{transition:none !important}}
</style>
</head>
<body>
  <div class="case">
    <span class="push p1" aria-hidden="true"></span>
    <span class="push p2" aria-hidden="true"></span>
    <div class="dial">
      <div class="idx" aria-hidden="true"></div>
      <div class="dtxt"><div class="l1">CHRONOGRAPH</div><div class="l2">GENEVA</div></div>
      <div class="hand" id="hand" aria-hidden="true"></div>
      <div class="pivot" aria-hidden="true"></div>
      <div class="time" id="t" role="timer">00:00<span class="cs">.00</span></div>
    </div>
  </div>

  <div class="row">
    <button id="b2" type="button" disabled>랩</button>
    <button id="b1" type="button">시작</button>
    <button id="b3" type="button" disabled>리셋</button>
  </div>
  <div class="laps" id="lp" aria-live="polite"></div>

<script>
(function(){
  /* 인덱스 배톤 12개 배치 (3·6·9·12시는 골드) */
  var idx=document.querySelector('.idx'),i;
  for(i=0;i<12;i++){
    var s=document.createElement('span');
    if(i%3===0)s.className='g';
    s.style.transform='rotate('+(i*30)+'deg)';
    idx.appendChild(s);
  }

  var t=document.getElementById('t'),hand=document.getElementById('hand'),
      b1=document.getElementById('b1'),b2=document.getElementById('b2'),
      b3=document.getElementById('b3'),lp=document.getElementById('lp');
  var run=false,st=0,acc=0,iv=null,laps=[],last=0;
  function el(){return acc+(run?performance.now()-st:0);}
  function pad(n,w){return String(n).padStart(w,'0');}
  function f(ms){if(ms<0)ms=0;var cs=Math.floor(ms/10)%100,s=Math.floor(ms/1000),ss=s%60,mm=Math.floor(s/60);
    if(mm>99)mm=99;
    return pad(mm,2)+':'+pad(ss,2)+'<span class="cs">.'+pad(cs,2)+'</span>';}
  function plain(ms){if(ms<0)ms=0;var cs=Math.floor(ms/10)%100,s=Math.floor(ms/1000),ss=s%60,mm=Math.floor(s/60);
    return pad(mm,2)+':'+pad(ss,2)+'.'+pad(cs,2);}
  function draw(){
    var e=el();
    t.innerHTML=f(e);
    /* 초침: 60초에 한 바퀴 */
    hand.style.transform='rotate('+((e/60000)*360)+'deg)';
  }

  /* ── 접근성 공통 ──
     정지·초기화 결과를 스크린리더에 한 번씩 알린다. 시간 표시 자체는
     10ms마다 바뀌므로 라이브 리전으로 두지 않는다. */
  var srSay=(function(){
    var r=document.createElement('div');
    r.setAttribute('role','status'); r.setAttribute('aria-live','polite');
    r.style.cssText='position:absolute;width:1px;height:1px;margin:-1px;padding:0;'+
      'overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0';
    document.body.appendChild(r);
    return function(m){ r.textContent=''; setTimeout(function(){ r.textContent=m; },30); };
  })();
  function srHuman(ms){
    if(ms<0)ms=0;
    var cs=Math.floor(ms/10)%100, s=Math.floor(ms/1000), ss=s%60, mm=Math.floor(s/60);
    return (mm?mm+'분 ':'')+ss+'점'+String(cs).padStart(2,'0')+'초';
  }
  var srWasRun=false, srLast=0;
  function ui(){
    document.body.classList.toggle('go',run);
    b1.textContent=run?'정지':(el()>0?'재개':'시작');
    b2.disabled=!run; b3.disabled=run||el()===0;
  
    /* 정지와 초기화를 알리고, 방금 누른 버튼이 잠기면 포커스를 되돌린다 */
    var srE=el();
    if(srWasRun&&!run) srSay('정지. 경과 시간 '+srHuman(srE));
    else if(!srWasRun&&!run&&srLast>0&&srE===0) srSay('초기화했습니다');
    srWasRun=run; srLast=srE;
    if(document.activeElement&&document.activeElement.disabled) b1.focus();
  }
  function start(){if(run)return;run=true;st=performance.now();if(!iv)iv=setInterval(draw,31);draw();ui();}
  function stop(){if(!run)return;acc=el();run=false;clearInterval(iv);iv=null;draw();ui();}
  function reset(){if(run)return;acc=0;st=0;laps=[];last=0;lp.textContent='';draw();ui();}
  function lap(){if(!run)return;var e=el(),sp=e-last;last=e;laps.push(sp);
    var best=Math.min.apply(null,laps);
    lp.textContent='LAP '+laps.length+'  +'+plain(sp)+(laps.length>1?(sp===best?'  ★ 최단':'  · 최단 '+plain(best)):'');}
  b1.addEventListener('click',function(){run?stop():start();});
  b2.addEventListener('click',lap);
  b3.addEventListener('click',reset);
  document.addEventListener('keydown',function(e){
    if(e.metaKey||e.ctrlKey||e.altKey||e.repeat)return;
    if(e.target&&e.target.tagName==='BUTTON'&&e.key===' ')return;
    if(e.key===' '){e.preventDefault();run?stop():start();}
    else if(e.key==='l'||e.key==='L'){lap();}
    else if(e.key==='r'||e.key==='R'){reset();}
  });
  document.addEventListener('visibilitychange',function(){if(!document.hidden&&run)draw();});
  window.addEventListener('pageshow',function(){if(run&&!iv)iv=setInterval(draw,31);});
  window.addEventListener('pagehide',function(){clearInterval(iv);iv=null;});
  draw();ui();
})();
</script>
</body>
</html>
